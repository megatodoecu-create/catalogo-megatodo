<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#ff2a2a;
color:white;
text-align:center;
padding:20px;
}

.volver{
display:inline-block;
margin:10px;
text-decoration:none;
color:#ff2a2a;
font-weight:bold;
}

.buscador{
padding:20px;
text-align:center;
}

.buscador input{
width:90%;
max-width:500px;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

.productos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.15);
position:relative;
}

.oferta{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
font-weight:bold;
padding:8px 12px;
border-radius:8px;
z-index:10;
}

.card img{
width:100%;
height:280px;
object-fit:contain;
}

.info{
padding:15px;
}

.nombre{
font-size:18px;
font-weight:bold;
}

.descripcion{
font-size:13px;
color:#666;
margin-top:6px;
line-height:1.4;
}

.tamano{
color:#666;
margin-top:8px;
}

.precio{
color:#ff2a2a;
font-size:24px;
font-weight:bold;
margin-top:10px;
}

.btn{
display:block;
margin-top:15px;
background:#25D366;
color:white;
text-align:center;
padding:10px;
border-radius:8px;
text-decoration:none;
}

/* BOTÓN SUBIR */
#btnArriba{
position:fixed;
bottom:20px;
right:20px;
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:22px;
box-shadow:0 4px 10px rgba(0,0,0,.3);
cursor:pointer;
z-index:9999;
}

@media (max-width:600px){
#btnArriba{
width:60px;
height:60px;
font-size:24px;
}
}

</style>
</head>

<body>

<div id="btnArriba" onclick="irArriba()">⬆️</div>

<a class="volver" href="index.html">← Volver al inicio</a>

<header>
<h1 id="titulo"></h1>
</header>

<div class="buscador">
<input type="text" id="buscadorCategoria" placeholder="Buscar producto en esta categoría...">
</div>

<div id="productos" class="productos"></div>

<script>

const categoria = new URLSearchParams(window.location.search).get("cat");
const productoBuscado = new URLSearchParams(window.location.search).get("producto");

document.getElementById("titulo").textContent = categoria;

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

fetch(url)
.then(res => res.json())
.then(data => {

const contenedor = document.getElementById("productos");

let filtrados = data.filter(item => item.Categoria === categoria);

if(productoBuscado){
filtrados = filtrados.filter(item =>
item.Nombre &&
item.Nombre.toLowerCase().trim() === productoBuscado.toLowerCase().trim()
);
}

function mostrarProductos(lista){

contenedor.innerHTML = "";

lista.forEach(producto => {

contenedor.innerHTML += `
<div class="card">

${producto.Oferta === "SI" ? '<div class="oferta">🔥 OFERTA</div>' : ''}

<img src="${producto.Foto}" alt="${producto.Nombre}">

<div class="info">

<div class="nombre">${producto.Nombre}</div>

${producto.Descripción ? `
<div class="descripcion">
${producto.Descripción}
</div>
` : ""}

${producto.Tamaño ? `
<div class="tamano">
Tamaño: ${producto.Tamaño}
</div>
` : ""}

<div class="precio">$${producto.Precio}</div>

<a class="btn"
target="_blank"
href="https://wa.me/593990924437?text=Hola,%20quiero%20información%20sobre%20${encodeURIComponent(producto.Nombre)}">
Consultar por WhatsApp
</a>

</div>
</div>
`;
});

}

mostrarProductos(filtrados);

// buscador
document.getElementById("buscadorCategoria").addEventListener("input", function(){
const texto = this.value.toLowerCase();

const resultado = filtrados.filter(p =>
p.Nombre.toLowerCase().includes(texto)
);

mostrarProductos(resultado);
});

})
.catch(err => {
document.getElementById("productos").innerHTML =
"<h2>Error cargando productos.</h2>";
console.error(err);
});

// BOTÓN SUBIR
window.addEventListener("scroll", function(){
const btn = document.getElementById("btnArriba");
if(!btn) return;

btn.style.display = window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({
top: 0,
behavior: "smooth"
});
}

</script>

</body>
</html>
