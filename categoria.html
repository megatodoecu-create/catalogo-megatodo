<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categoría - Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.volver-home{
position:fixed;
top:15px;
left:15px;
background:#333;
color:white;
padding:10px 14px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
z-index:9999;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

header{
background:#ff2a2a;
color:white;
text-align:center;
padding:15px;
font-size:20px;
font-weight:bold;
margin-top:60px;
}

.buscador{
text-align:center;
padding:15px;
}

.buscador input{
width:90%;
max-width:500px;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.productos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.15);
transition:0.2s;
}

.card:hover{
transform:scale(1.02);
}

.card img{
width:100%;
height:240px;
object-fit:contain;
background:white;
cursor:pointer;
}

.info{
padding:15px;
}

.nombre{
font-size:16px;
font-weight:bold;
margin-bottom:5px;
}

.precio{
font-size:18px;
color:#ff2a2a;
font-weight:bold;
margin-top:5px;
}

.descripcion{
font-size:13px;
color:#666;
margin-top:5px;
}

.tamano{
font-size:13px;
color:#777;
margin-top:5px;
}

.btn{
display:block;
margin-top:10px;
background:#25D366;
color:white;
text-align:center;
padding:10px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

#btnArriba{
position:fixed;
bottom:20px;
left:20px;
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
z-index:9999;
}

.btn-carrito-global{
position:fixed;
top:15px;
right:15px;
background:#ff2a2a;
color:white;
padding:12px 18px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
box-shadow:0 4px 12px rgba(0,0,0,.25);
z-index:9999;
}

</style>
</head>

<body>

<a href="carrito.html" class="btn-carrito-global">🛒 Carrito</a>
<a class="volver-home" href="index.html">← Inicio</a>

<div id="btnArriba" onclick="irArriba()">⬆️</div>

<header>
<h1 id="titulo"></h1>
</header>

<div class="buscador">
<input type="text" id="buscadorCat" placeholder="Buscar producto en esta categoría...">
</div>

<div id="productos" class="productos"></div>

<script>

const categoria = new URLSearchParams(window.location.search).get("cat");
document.getElementById("titulo").textContent = categoria;

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

let productosGlobal = [];

fetch(url)
.then(res => res.json())
.then(data => {
    productosGlobal = data.filter(p => p.Categoria === categoria);
    render(productosGlobal);
});

/* =========================
   NORMALIZAR TEXTO
========================= */
function normalizar(texto) {
return (texto || "")
.toString()
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g, "");
}

/* =========================
   BUSCADOR TIPO INDEX
========================= */
document.getElementById("buscadorCat").addEventListener("input", filtrarCategoria);

document.getElementById("buscadorCat").addEventListener("keydown", function(e) {
if (e.key === "Enter") {
filtrarCategoria();
}
});

function filtrarCategoria() {

const texto = normalizar(document.getElementById("buscadorCat").value);
const palabras = texto.split(" ").filter(p => p.length > 0);

const filtrados = productosGlobal.filter(p => {

const nombre = normalizar(p.Nombre);
const categoria = normalizar(p.Categoria);
const descripcion = normalizar(p["Descripción"] || p["Descripcion"]);

return palabras.some(word =>
nombre.includes(word) ||
categoria.includes(word) ||
descripcion.includes(word)
);

});

render(filtrados);
}

/* =========================
   RENDER
========================= */
function render(lista){

const contenedor = document.getElementById("productos");

contenedor.innerHTML = lista.map(p => {

const codigo = (p.Código || "").toString().trim();
const foto = p["Foto 1"] || "https://via.placeholder.com/300";

const descripcion = (p.Descripción || "").trim();
const tamaño = (p.Tamaño || "").trim();

const linkProducto = `https://megatodoecu-create.github.io/catalogo-megatodo/producto.html?codigo=${encodeURIComponent(codigo)}`;

const mensaje = `Hola, quiero información sobre:

${p.Nombre || ""}

Precio: $${p.Precio || ""}

Código: ${codigo}

Link:
${linkProducto}`;

return `
<div class="card">

<a href="${linkProducto}">
<img src="${foto}">
</a>

<div class="info">

<div class="nombre">${p.Nombre || ""}</div>

${descripcion ? `<div class="descripcion">${descripcion}</div>` : ""}

${tamaño ? `<div class="tamano">Tamaño: ${tamaño}</div>` : ""}

<div class="precio">$${p.Precio || ""}</div>

<a class="btn"
target="_blank"
href="https://wa.me/593990924437?text=${encodeURIComponent(mensaje)}">
📲 WhatsApp
</a>

</div>
</div>
`;

}).join("");

}

/* BOTÓN SUBIR */
window.addEventListener("scroll", function(){
document.getElementById("btnArriba").style.display =
window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({ top: 0, behavior: "smooth" });
}

</script>

</body>
</html>
