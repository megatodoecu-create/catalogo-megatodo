<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categoría - Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

/* 🔥 BOTÓN VOLVER INICIO */
.volver-home{
position:fixed;
top:15px;
left:15px;
background:#333;
color:white;
padding:10px 14px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
z-index:9999;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

/* HEADER */
header{
background:#ff2a2a;
color:white;
text-align:center;
padding:15px;
font-size:20px;
font-weight:bold;
margin-top:60px;
}

/* 🔎 BUSCADOR */
.buscador{
text-align:center;
padding:15px;
}

.buscador input{
width:90%;
max-width:500px;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

/* SUGERENCIAS */
.sugerencias{
max-width:500px;
margin:0 auto;
background:white;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
overflow:hidden;
}

.sugerencia{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.sugerencia:hover{
background:#f5f5f5;
}

/* GRID */
.productos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

/* CARD */
.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.15);
position:relative;
transition:0.2s;
}

.card:hover{
transform:scale(1.02);
}

/* IMAGEN */
.card img{
width:100%;
height:240px;
object-fit:contain;
background:white;
cursor:pointer;
}

/* INFO */
.info{
padding:15px;
}

.nombre{
font-size:16px;
font-weight:bold;
margin-bottom:5px;
}

.precio{
font-size:18px;
color:#ff2a2a;
font-weight:bold;
margin-top:5px;
}

/* WHATSAPP */
.btn{
display:block;
margin-top:10px;
background:#25D366;
color:white;
text-align:center;
padding:10px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

/* BOTÓN SUBIR */
#btnArriba{
position:fixed;
bottom:20px;
left:20px;
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
z-index:9999;
}


 .btn-carrito-global{
position:fixed;
top:15px;
right:15px;
background:#ff2a2a;
color:white;
padding:12px 18px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
box-shadow:0 4px 12px rgba(0,0,0,.25);
z-index:9999;
transition:0.2s;
}

.btn-carrito-global:hover{
transform:scale(1.05);
} 
</style>
</head>

<body>
<a href="carrito.html" class="btn-carrito-global">🛒 Carrito</a>
<!-- 🔥 BOTÓN INICIO -->
<a class="volver-home" href="index.html">← Inicio</a>

<div id="btnArriba" onclick="irArriba()">⬆️</div>

<header>
<h1 id="titulo"></h1>
</header>

<!-- 🔎 BUSCADOR -->
<div class="buscador">
<input type="text" id="buscadorCat" placeholder="Buscar producto en esta categoría...">
<div id="sugerencias"></div>
</div>

<div id="productos" class="productos"></div>

<script>

const categoria = new URLSearchParams(window.location.search).get("cat");
document.getElementById("titulo").textContent = categoria;

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

let productosGlobal = [];

fetch(url)
.then(res => res.json())
.then(data => {

productosGlobal = data.filter(p => p.Categoria === categoria);
render(productosGlobal);

});

// 🔥 RENDER PRODUCTOS
function render(lista){

const contenedor = document.getElementById("productos");

contenedor.innerHTML = lista.map(p => {

const codigo = p.Código || p.Codigo || p.ID || "";
const foto = p["Foto 1"] || p.Foto || "https://via.placeholder.com/300";

const descripcion = p.Descripción && p.Descripción.trim() !== "" ? p.Descripción : "";
const tamaño = p.Tamaño && p.Tamaño.trim() !== "" ? p.Tamaño : "";

return `
<div class="card">

<a href="producto.html?codigo=${codigo}">
<img src="${foto}" alt="${p.Nombre}">
</a>

<div class="info">

<div class="nombre">${p.Nombre || ""}</div>

${descripcion ? `<div class="descripcion">${descripcion}</div>` : ""}

${tamaño ? `<div class="tamano">Tamaño: ${tamaño}</div>` : ""}

<div class="precio">$${p.Precio || ""}</div>

const mensaje = `
Hola, quiero información sobre:

${p.Nombre}

Precio: $${p.Precio}

Código: ${p.Código}

Link del producto:
${window.location.origin}/producto.html?codigo=${p.Código}
`;

const wpp = `https://wa.me/593990924437?text=${encodeURIComponent(mensaje)}`;

</div>
</div>
`;
}).join("");

}

// 🔎 BUSCADOR SOLO EN CATEGORÍA
document.getElementById("buscadorCat").addEventListener("input", function(){

const texto = this.value.toLowerCase().trim();
const sugerencias = document.getElementById("sugerencias");

if(texto === ""){
render(productosGlobal);
sugerencias.innerHTML = "";
return;
}

// SOLO BUSCA DENTRO DE ESTA CATEGORÍA
const filtrados = productosGlobal.filter(p =>
(p.Nombre || "").toLowerCase().includes(texto)
);

// RENDER
render(filtrados);

// SUGERENCIAS (TOP 5)
sugerencias.innerHTML = filtrados.slice(0,5).map(p => `
<div class="sugerencia" onclick="ir('${p.Código}')">
${p.Nombre}
</div>
`).join("");

});

// IR A PRODUCTO
function ir(codigo){
window.location.href = "producto.html?codigo=" + codigo;
}

// BOTÓN SUBIR
window.addEventListener("scroll", function(){
document.getElementById("btnArriba").style.display =
window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({ top: 0, behavior: "smooth" });
}

</script>

</body>
</html>
