<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categoría - Megatodo</title>

<style>

/* =========================
   GENERAL
========================= */

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
}

/* =========================
   BOTÓN INICIO
========================= */

.volver-home{
    position:fixed;
    top:15px;
    left:15px;
    background:#333;
    color:white;
    padding:10px 14px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    z-index:9999;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

/* =========================
   CARRITO
========================= */

.btn-carrito-global{
    position:fixed;
    top:15px;
    right:15px;
    background:#d63384;
    color:white;
    padding:11px 16px;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
    box-shadow:0 4px 12px rgba(0,0,0,.20);
    z-index:9999;
}

/* =========================
   ENCABEZADO
========================= */

header{
    margin-top:70px;
    margin-left:15px;
    margin-right:15px;
    padding:22px 15px;
    text-align:center;

    background:linear-gradient(
        135deg,
        #ffe4ec,
        #fff0f5,
        #fce4ec
    );

    border-radius:18px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.08);
}

header h1{
    margin:0;
    color:#d63384;
    font-size:28px;
    font-weight:bold;
}

/* =========================
   BUSCADOR
========================= */

.buscador-contenedor{
    width:90%;
    max-width:600px;
    margin:20px auto 5px;
    position:relative;
}

.buscador-contenedor input{
    width:100%;
    box-sizing:border-box;

    padding:14px 48px 14px 18px;

    border:1px solid #ddd;
    border-radius:30px;

    background:white;

    font-size:16px;
    outline:none;

    box-shadow:0 3px 12px rgba(0,0,0,.08);

    transition:.2s;
}

.buscador-contenedor input:focus{
    border-color:#d63384;
    box-shadow:0 3px 15px rgba(214,51,132,.15);
}

.icono-busqueda{
    position:absolute;
    right:17px;
    top:50%;
    transform:translateY(-50%);
    font-size:21px;
    pointer-events:none;
}

/* =========================
   SUGERENCIAS
========================= */

#sugerencias{
    width:90%;
    max-width:600px;
    margin:0 auto;

    background:white;

    border-radius:12px;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

    position:relative;
    z-index:9998;

    overflow:hidden;
}

.sug-item{
    padding:12px 15px;
    cursor:pointer;
    border-bottom:1px solid #eee;
    font-size:14px;
}

.sug-item:last-child{
    border-bottom:none;
}

.sug-item:hover{
    background:#fff0f5;
    color:#d63384;
}

/* =========================
   GRID PRODUCTOS
========================= */

.productos{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;

    padding:25px 20px;
}

/* =========================
   TARJETA
========================= */

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;

    box-shadow:
        0 3px 10px rgba(0,0,0,.10);

    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);

    box-shadow:
        0 7px 18px rgba(0,0,0,.15);
}

/* =========================
   IMAGEN
========================= */

.imagen-producto{
    position:relative;
    background:white;
}

.card img{
    width:100%;
    height:240px;

    object-fit:contain;

    background:white;

    cursor:pointer;

    display:block;
}

/* =========================
   ETIQUETAS
========================= */

.etiqueta{
    position:absolute;
    left:10px;

    padding:5px 12px;

    border-radius:20px;

    font-size:12px;
    font-weight:bold;

    color:white;

    z-index:10;

    box-shadow:
        0 2px 6px rgba(0,0,0,.20);
}

.etiqueta.oferta{
    top:10px;
    background:#ff4d6d;
}

.etiqueta.nuevo{
    top:45px;
    background:#2ecc71;
}

/* =========================
   INFORMACIÓN
========================= */

.info{
    padding:15px;
}

.nombre{
    font-size:16px;
    font-weight:bold;
    margin-bottom:6px;
}

.precio{
    font-size:19px;
    color:#d63384;
    font-weight:bold;
    margin-top:8px;
}

.descripcion{
    font-size:13px;
    color:#666;
    margin-top:6px;
    line-height:1.4;
}

.tamano{
    font-size:13px;
    color:#777;
    margin-top:6px;
}

/* =========================
   WHATSAPP
========================= */

.btn{
    display:block;

    margin-top:12px;

    background:#25D366;
    color:white;

    text-align:center;

    padding:10px;

    border-radius:8px;

    text-decoration:none;

    font-weight:bold;

    transition:.2s;
}

.btn:hover{
    opacity:.9;
}

/* =========================
   SIN RESULTADOS
========================= */

.sin-resultados{
    grid-column:1 / -1;

    text-align:center;

    padding:50px 20px;

    color:#777;

    font-size:16px;
}

.sin-resultados strong{
    color:#d63384;
}

/* =========================
   BOTÓN SUBIR
========================= */

#btnArriba{
    position:fixed;

    bottom:20px;
    left:20px;

    width:50px;
    height:50px;

    background:#d63384;
    color:white;

    border-radius:50%;

    display:none;

    align-items:center;
    justify-content:center;

    font-size:21px;

    cursor:pointer;

    z-index:9999;

    box-shadow:
        0 4px 12px rgba(0,0,0,.20);
}

/* =========================
   CELULAR
========================= */

@media(max-width:600px){

    .volver-home{
        top:10px;
        left:10px;
        padding:8px 11px;
        font-size:13px;
    }

    .btn-carrito-global{
        top:10px;
        right:10px;
        padding:9px 12px;
        font-size:13px;
    }

    header{
        margin-top:60px;
        margin-left:10px;
        margin-right:10px;
        padding:18px 10px;
    }

    header h1{
        font-size:23px;
    }

    .buscador-contenedor{
        width:92%;
    }

    .productos{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
        padding:18px 10px;
    }

    .card img{
        height:180px;
    }

    .info{
        padding:11px;
    }

    .nombre{
        font-size:14px;
    }

    .precio{
        font-size:17px;
    }

    .descripcion,
    .tamano{
        font-size:12px;
    }

    .btn{
        font-size:13px;
        padding:9px 5px;
    }

}

</style>

</head>

<body>


<!-- =========================
     CARRITO
========================= -->

<a href="carrito.html" class="btn-carrito-global">
    🛒 Carrito
    <span id="cartCount">0</span>
</a>


<!-- =========================
     INICIO
========================= -->

<a class="volver-home" href="index.html">
    ← Inicio
</a>


<!-- =========================
     BOTÓN SUBIR
========================= -->

<div id="btnArriba" onclick="irArriba()">
    ⬆️
</div>


<!-- =========================
     TÍTULO
========================= -->

<header>

    <h1 id="titulo"></h1>

</header>


<!-- =========================
     BUSCADOR
========================= -->

<div class="buscador-contenedor">

    <input
        type="text"
        id="buscadorCat"
        placeholder="Buscar producto en esta categoría..."
        autocomplete="off">

    <span class="icono-busqueda">
        🔎
    </span>

</div>


<!-- =========================
     SUGERENCIAS
========================= -->

<div id="sugerencias"></div>


<!-- =========================
     PRODUCTOS
========================= -->

<div id="productos" class="productos"></div>


<script>


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto){

    return (texto || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();

}


/* =====================================================
   OBTENER CATEGORÍA
===================================================== */

const parametros =
    new URLSearchParams(window.location.search);

const categoriaOriginal =
    parametros.get("cat") || "";

const categoria =
    normalizar(categoriaOriginal);


/* =====================================================
   MOSTRAR TÍTULO
===================================================== */

document.getElementById("titulo").textContent =
    categoriaOriginal;


/* =====================================================
   URL GOOGLE SHEETS
===================================================== */

const url =
    "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";


/* =====================================================
   PRODUCTOS
===================================================== */

let productosGlobal = [];


/* =====================================================
   CARGAR PRODUCTOS
===================================================== */

fetch(url)

.then(res => {

    if(!res.ok){
        throw new Error("No se pudo cargar el catálogo.");
    }

    return res.json();

})

.then(data => {

    /*
       Filtramos solamente la categoría actual.

       Se utiliza normalizar() para que:

       Cosméticos

       y

       Cosmeticos

       sean considerados iguales.
    */

    productosGlobal = data.filter(p => {

        return normalizar(p.Categoria) === categoria;

    });

    render(productosGlobal);

})

.catch(error => {

    console.error(error);

    document.getElementById("productos").innerHTML = `

        <div class="sin-resultados">

            No se pudo cargar el catálogo.

            <br><br>

            <strong>Intenta nuevamente.</strong>

        </div>

    `;

});


/* =====================================================
   BUSCADOR - ESCRIBIR
===================================================== */

const buscador =
    document.getElementById("buscadorCat");


buscador.addEventListener("input",function(){

    mostrarSugerencias(this.value);

    filtrarCategoria();

});


/* =====================================================
   BUSCADOR - ENTER
===================================================== */

buscador.addEventListener("keydown",function(e){

    if(e.key === "Enter"){

        e.preventDefault();

        filtrarCategoria();

        document.getElementById(
            "sugerencias"
        ).innerHTML = "";

        /*
           Quitamos el foco para que quede claro
           que la búsqueda fue realizada.
        */

        this.blur();

    }

});


/* =====================================================
   SUGERENCIAS
===================================================== */

function mostrarSugerencias(valor){

    const texto =
        normalizar(valor);

    const contenedor =
        document.getElementById("sugerencias");


    /* Si está vacío, no mostramos sugerencias */

    if(!texto){

        contenedor.innerHTML = "";

        return;

    }


    /*
       Buscar coincidencias por nombre
       o descripción.
    */

    const sugeridos =
        productosGlobal
        .filter(p => {

            const nombre =
                normalizar(p.Nombre);

            const descripcion =
                normalizar(
                    p["Descripción"] ||
                    p["Descripcion"]
                );

            return (
                nombre.includes(texto) ||
                descripcion.includes(texto)
            );

        })
        .slice(0,5);


    if(sugeridos.length === 0){

        contenedor.innerHTML = "";

        return;

    }


    contenedor.innerHTML = "";


    sugeridos.forEach(p => {

        const item =
            document.createElement("div");

        item.className =
            "sug-item";

        item.textContent =
            p.Nombre || "";


        item.addEventListener(
            "click",
            function(){

                buscador.value =
                    p.Nombre || "";

                contenedor.innerHTML = "";

                filtrarCategoria();

            }
        );


        contenedor.appendChild(item);

    });

}


/* =====================================================
   FILTRAR PRODUCTOS
===================================================== */

function filtrarCategoria(){

    const texto =
        normalizar(
            buscador.value
        );


    /*
       Si el buscador está vacío,
       mostramos todos los productos.
    */

    if(!texto){

        render(productosGlobal);

        return;

    }


    /*
       Dividimos la búsqueda en palabras.

       Ejemplo:

       "peluche snoopy"

       se convierte en:

       ["peluche","snoopy"]
    */

    const palabras =
        texto
        .split(/\s+/)
        .filter(p => p.length > 0);


    const filtrados =
        productosGlobal.filter(p => {


            const nombre =
                normalizar(p.Nombre);


            const descripcion =
                normalizar(
                    p["Descripción"] ||
                    p["Descripcion"]
                );


            /*
               Todas las palabras deben
               encontrarse en nombre o descripción.
            */

            return palabras.every(word => {

                return (
                    nombre.includes(word) ||
                    descripcion.includes(word)
                );

            });

        });


    render(filtrados);

}


/* =====================================================
   RENDERIZAR PRODUCTOS
===================================================== */

function render(lista){

    const contenedor =
        document.getElementById("productos");


    /* =========================
       SIN RESULTADOS
    ========================= */

    if(!lista || lista.length === 0){

        contenedor.innerHTML = `

            <div class="sin-resultados">

                No encontramos productos
                para tu búsqueda.

                <br><br>

                <strong>Intenta con otro nombre.</strong>

            </div>

        `;

        return;

    }


    /* =========================
       PRODUCTOS
    ========================= */

    contenedor.innerHTML = lista.map(p => {


        /* =========================
           DATOS
        ========================= */

        const codigo =
            (p.Código || "")
            .toString()
            .trim();


        const foto =
            (p["Foto 1"] || "")
            .toString()
            .trim();


        const descripcion =
            (p.Descripción || "")
            .toString()
            .trim();


        const tamaño =
            (p.Tamaño || "")
            .toString()
            .trim();


        const oferta =
            (p.Oferta || "")
            .toString()
            .trim()
            .toUpperCase() === "SI";


        const nuevo =
            (p.Nuevo || "")
            .toString()
            .trim()
            .toUpperCase() === "SI";


        /* =========================
           FOTO
        ========================= */

        const fotoFinal =
            foto ||
            "https://via.placeholder.com/300";


        /* =========================
           ETIQUETAS
        ========================= */

        let etiquetas = "";


        if(oferta){

            etiquetas += `

                <div class="etiqueta oferta">
                    OFERTA
                </div>

            `;

        }


        if(nuevo){

            etiquetas += `

                <div class="etiqueta nuevo">
                    NUEVO
                </div>

            `;

        }


        /* =========================
           LINK PRODUCTO
        ========================= */

        const linkProducto =
            "https://megatodoecu-create.github.io/catalogo-megatodo/producto.html?codigo="
            +
            encodeURIComponent(codigo);


        /* =========================
           MENSAJE WHATSAPP
        ========================= */

        const mensaje =
`Hola, quiero información sobre:

${p.Nombre || ""}

Precio: $${p.Precio || ""}

Código: ${codigo}

Link:
${linkProducto}`;


        /* =========================
           TARJETA
        ========================= */

        return `

            <div class="card">


                <div class="imagen-producto">

                    ${etiquetas}


                    <a href="${linkProducto}">

                        <img
                            src="${fotoFinal}"
                            alt="${p.Nombre || "Producto"}"
                            loading="lazy">

                    </a>

                </div>


                <div class="info">


                    <div class="nombre">

                        ${p.Nombre || ""}

                    </div>


                    ${
                        descripcion
                        ?
                        `<div class="descripcion">
                            ${descripcion}
                        </div>`
                        :
                        ""
                    }


                    ${
                        tamaño
                        ?
                        `<div class="tamano">
                            Tamaño: ${tamaño}
                        </div>`
                        :
                        ""
                    }


                    <div class="precio">

                        $${p.Precio || ""}

                    </div>


                    <a
                        class="btn"
                        target="_blank"
                        href="https://wa.me/593990924437?text=${encodeURIComponent(mensaje)}">

                        📲 WhatsApp

                    </a>


                </div>

            </div>

        `;

    }).join("");

}


/* =====================================================
   BOTÓN SUBIR
===================================================== */

window.addEventListener(
    "scroll",
    function(){

        const boton =
            document.getElementById("btnArriba");


        boton.style.display =
            window.scrollY > 200
            ? "flex"
            : "none";

    }
);


/* =====================================================
   IR ARRIBA
===================================================== */

function irArriba(){

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =====================================================
   CARRITO
===================================================== */

function getCart(){

    return JSON.parse(
        localStorage.getItem("carrito")
    ) || [];

}


function actualizarCarritoUI(){

    const carrito =
        getCart();


    const total =
        carrito.reduce(
            (sum,p) =>
                sum + (Number(p.cantidad) || 1),
            0
        );


    document.getElementById(
        "cartCount"
    ).textContent = total;

}


/* =====================================================
   ACTUALIZAR CARRITO
===================================================== */

actualizarCarritoUI();


</script>

</body>

</html>
