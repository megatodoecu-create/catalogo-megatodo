<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categoría - Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

/* HEADER */
header{
background:#ff2a2a;
color:white;
text-align:center;
padding:15px;
font-size:20px;
font-weight:bold;
}

.volver{
display:block;
margin:10px;
text-decoration:none;
color:#ff2a2a;
font-weight:bold;
}

/* GRID */
.productos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

/* CARD */
.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.15);
position:relative;
}

.card img{
width:100%;
height:260px;
object-fit:contain;
background:white;
}

/* OFERTA */
.oferta{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
padding:6px 10px;
font-size:12px;
border-radius:6px;
font-weight:bold;
}

/* INFO */
.info{
padding:15px;
}

.nombre{
font-size:18px;
font-weight:bold;
margin-bottom:6px;
}

.descripcion{
font-size:13px;
color:#666;
margin:6px 0;
line-height:1.4;
}

.tamano{
font-size:13px;
color:#777;
margin:5px 0;
}

.precio{
font-size:22px;
color:#ff2a2a;
font-weight:bold;
margin-top:10px;
}

/* WHATSAPP */
.btn{
display:block;
margin-top:10px;
background:#25D366;
color:white;
text-align:center;
padding:10px;
border-radius:8px;
text-decoration:none;
}

/* BOTÓN SUBIR */
#btnArriba{
position:fixed;
bottom:20px;
left:20px;
right:auto !important;
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
z-index:9999;
box-shadow:0 4px 12px rgba(0,0,0,.3);
}

</style>
</head>

<body>

<!-- BOTÓN SUBIR -->
<div id="btnArriba" onclick="irArriba()">⬆️</div>

<a class="volver" href="index.html">← Volver al inicio</a>

<header>
<h1 id="titulo"></h1>
</header>

<div id="productos" class="productos"></div>

<script>

const categoria = new URLSearchParams(window.location.search).get("cat");
document.getElementById("titulo").textContent = categoria;

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

fetch(url)
.then(res => res.json())
.then(data => {

const filtrados = data.filter(p => p.Categoria === categoria);

const contenedor = document.getElementById("productos");

if(filtrados.length === 0){
contenedor.innerHTML = "<h3 style='text-align:center;'>No hay productos</h3>";
return;
}

contenedor.innerHTML = filtrados.map(p => {

const descripcion = p.Descripción ? `<div class="descripcion">${p.Descripción}</div>` : "";
const tamaño = p.Tamaño ? `<div class="tamano">Tamaño: ${p.Tamaño}</div>` : "";

return `
<div class="card">

${p.Oferta === "SI" ? `<div class="oferta">OFERTA</div>` : ""}

<img src="${p.Foto}" alt="${p.Nombre}">

<div class="info">

<div class="nombre">${p.Nombre}</div>

${descripcion}
${tamaño}

<div class="precio">$${p.Precio}</div>

<a class="btn"
target="_blank"
href="https://wa.me/593990924437?text=Hola,%20quiero%20información%20del%20producto:%20${encodeURIComponent(p.Nombre)}%20-%20Precio:%20$${p.Precio}">
💬 WhatsApp
</a>

</div>
</div>
`;
}).join("");

});

/* BOTÓN SUBIR */
window.addEventListener("scroll", function(){
const btn = document.getElementById("btnArriba");
btn.style.display = window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({ top: 0, behavior: "smooth" });
}

</script>

</body>
</html>
