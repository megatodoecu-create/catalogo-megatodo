<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Producto - Megatodo</title>

<style>

/* =========================
   GENERAL
========================= */

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
}


/* =========================
   BOTÓN INICIO
========================= */

.volver-home{

    position:fixed;

    top:15px;
    left:15px;

    background:#333;
    color:white;

    padding:10px 14px;

    border-radius:8px;

    text-decoration:none;

    font-weight:bold;

    z-index:9999;

    box-shadow:
        0 2px 10px rgba(0,0,0,.2);

    transition:.2s;
}


.volver-home:hover{

    transform:scale(1.05);

}


/* =========================
   CARRITO
========================= */

.btn-carrito-global{

    position:fixed;

    top:15px;
    right:15px;

    background:#d63384;

    color:white;

    padding:11px 16px;

    border-radius:50px;

    text-decoration:none;

    font-weight:bold;

    box-shadow:
        0 4px 12px rgba(0,0,0,.20);

    z-index:9999;

    transition:.2s;
}


.btn-carrito-global:hover{

    transform:scale(1.05);

}


/* =========================
   CONTADOR
========================= */

#cartCount{

    background:white;

    color:#d63384;

    font-size:12px;

    padding:3px 7px;

    border-radius:50%;

    margin-left:6px;

    font-weight:bold;

}


/* =========================
   BOTÓN ARRIBA
========================= */

#btnArriba{

    position:fixed;

    bottom:20px;
    left:20px;

    width:50px;
    height:50px;

    background:#d63384;

    color:white;

    border-radius:50%;

    display:none;

    align-items:center;
    justify-content:center;

    font-size:21px;

    cursor:pointer;

    z-index:9999;

    box-shadow:
        0 4px 12px rgba(0,0,0,.20);

}


/* =========================
   CONTENEDOR
========================= */

.contenedor{

    max-width:1100px;

    margin:80px auto 30px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:25px;

    padding:20px;

}


/* =========================
   GALERÍA
========================= */

.galeria{

    background:white;

    padding:20px;

    border-radius:18px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.08);

}


/* =========================
   IMAGEN PRINCIPAL
========================= */

.galeria-principal{

    width:100%;

    height:430px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:white;

    border-radius:12px;

}


.galeria-principal img{

    width:100%;

    height:100%;

    object-fit:contain;

    border-radius:10px;

}


/* =========================
   MINIATURAS
========================= */

.miniaturas{

    display:flex;

    gap:10px;

    margin-top:15px;

    justify-content:center;

    flex-wrap:wrap;

}


.miniaturas img{

    width:80px;
    height:80px;

    object-fit:contain;

    border-radius:10px;

    cursor:pointer;

    border:2px solid transparent;

    background:white;

    transition:.2s;

}


.miniaturas img:hover{

    border-color:#d63384;

}


.miniaturas img.activa{

    border-color:#d63384;

}


/* =========================
   INFORMACIÓN
========================= */

.info{

    background:white;

    padding:25px;

    border-radius:18px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.08);

}


.titulo{

    font-size:26px;

    font-weight:bold;

    line-height:1.25;

}


/* =========================
   ETIQUETAS
========================= */

#etiquetas{

    margin-bottom:10px;

}


.oferta{

    display:inline-block;

    background:#ff4d6d;

    color:white;

    padding:6px 12px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

    margin-right:5px;

}


.nuevo{

    display:inline-block;

    background:#2ecc71;

    color:white;

    padding:6px 12px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

}


/* =========================
   PRECIO
========================= */

.precio{

    font-size:29px;

    color:#d63384;

    font-weight:bold;

    margin:12px 0;

}


.precio-anterior{

    text-decoration:line-through;

    color:#888;

    margin-left:10px;

    font-size:16px;

}


/* =========================
   STOCK
========================= */

.stock{

    margin-top:15px;

    color:#2e8b57;

    font-weight:bold;

}


/* =========================
   DESCRIPCIÓN
========================= */

.descripcion{

    margin-top:18px;

    color:#555;

    line-height:1.6;

    font-size:15px;

}


/* =========================
   BOTONES
========================= */

.btn{

    display:block;

    margin-top:15px;

    padding:13px;

    text-align:center;

    border-radius:10px;

    text-decoration:none;

    font-weight:bold;

    transition:.2s;

}


.btn:hover{

    transform:translateY(-1px);

}


.btn-wpp{

    background:#25D366;

    color:white;

}


.btn-carrito{

    background:#d63384;

    color:white;

    border:none;

    width:100%;

    box-sizing:border-box;

    cursor:pointer;

    font-size:15px;

}


/* =========================
   PRODUCTO NO ENCONTRADO
========================= */

.no-encontrado{

    max-width:600px;

    margin:150px auto;

    padding:40px 20px;

    background:white;

    border-radius:18px;

    text-align:center;

    box-shadow:
        0 4px 15px rgba(0,0,0,.08);

}


.no-encontrado h2{

    color:#d63384;

}


/* =========================
   CELULAR
========================= */

@media(max-width:900px){

    .contenedor{

        grid-template-columns:1fr;

        margin-top:70px;

        padding:15px;

    }


    .galeria-principal{

        height:350px;

    }

}


@media(max-width:600px){

    .volver-home{

        top:10px;
        left:10px;

        padding:8px 11px;

        font-size:13px;

    }


    .btn-carrito-global{

        top:10px;
        right:10px;

        padding:9px 12px;

        font-size:13px;

    }


    .contenedor{

        margin-top:60px;

        padding:10px;

    }


    .galeria{

        padding:12px;

    }


    .galeria-principal{

        height:300px;

    }


    .miniaturas img{

        width:65px;
        height:65px;

    }


    .info{

        padding:18px;

    }


    .titulo{

        font-size:22px;

    }


    .precio{

        font-size:25px;

    }


    .descripcion{

        font-size:14px;

    }

}

</style>

</head>


<body>


<!-- =========================
     CARRITO
========================= -->

<a
    href="carrito.html"
    class="btn-carrito-global">

    🛒 Carrito

    <span id="cartCount">
        0
    </span>

</a>


<!-- =========================
     INICIO
========================= -->

<a
    class="volver-home"
    href="index.html">

    ← Inicio

</a>


<!-- =========================
     BOTÓN ARRIBA
========================= -->

<div
    id="btnArriba"
    onclick="irArriba()">

    ⬆️

</div>


<!-- =========================
     PRODUCTO
========================= -->

<div class="contenedor">


    <!-- =====================
         GALERÍA
    ====================== -->

    <div class="galeria">


        <div class="galeria-principal">

            <img
                id="imgPrincipal"
                src=""
                alt="Producto">

        </div>


        <div class="miniaturas">

            <img
                id="img1"
                onclick="cambiar(this)">

            <img
                id="img2"
                onclick="cambiar(this)">

            <img
                id="img3"
                onclick="cambiar(this)">

        </div>


    </div>


    <!-- =====================
         INFORMACIÓN
    ====================== -->

    <div class="info">


        <div id="etiquetas"></div>


        <div
            class="titulo"
            id="nombre">
        </div>


        <div>

            <span
                class="precio"
                id="precio">
            </span>


            <span
                class="precio-anterior"
                id="precioAnt">
            </span>

        </div>


        <div
            class="stock"
            id="stock">
        </div>


        <div
            class="descripcion"
            id="descripcion">
        </div>


        <!-- WHATSAPP -->

        <a
            id="wpp"
            class="btn btn-wpp"
            target="_blank">

            📲 WhatsApp

        </a>


        <!-- CARRITO -->

        <button
            class="btn btn-carrito"
            id="btnAddCart">

            🛒 Agregar al carrito

        </button>


    </div>


</div>


<script>


/* =====================================================
   GOOGLE SHEETS
===================================================== */

const url =
"https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";


/* =====================================================
   CÓDIGO DEL PRODUCTO
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const codigoBuscado =
    (params.get("codigo") || "")
    .toString()
    .trim();


let productoActual = null;


/* =====================================================
   CARGAR PRODUCTO
===================================================== */

fetch(url)

.then(res => {

    if(!res.ok){

        throw new Error(
            "No se pudo cargar el catálogo."
        );

    }

    return res.json();

})

.then(data => {


    /*
       Buscamos el producto por código.

       Se normaliza para evitar problemas
       con espacios.
    */

    productoActual =
        data.find(p => {

            return (
                (p.Código || "")
                .toString()
                .trim()
                ===
                codigoBuscado
            );

        });


    /* =========================
       PRODUCTO NO ENCONTRADO
    ========================= */

    if(!productoActual){

        document.body.innerHTML = `

            <div class="no-encontrado">

                <h2>
                    Producto no encontrado
                </h2>

                <p>
                    El producto que buscas
                    no existe o ya no está disponible.
                </p>

                <br>

                <a
                    href="index.html"
                    class="btn btn-carrito">

                    ← Volver al inicio

                </a>

            </div>

        `;

        return;

    }


    /* =========================
       FOTOS
    ========================= */

    const img1 =
        (productoActual["Foto 1"] || "")
        .toString()
        .trim();


    const img2 =
        (productoActual["Foto 2"] || "")
        .toString()
        .trim();


    const img3 =
        (productoActual["Foto 3"] || "")
        .toString()
        .trim();


    const imgPrincipal =
        document.getElementById(
            "imgPrincipal"
        );


    const mini1 =
        document.getElementById("img1");


    const mini2 =
        document.getElementById("img2");


    const mini3 =
        document.getElementById("img3");


    /* =========================
       FOTO PRINCIPAL
    ========================= */

    if(img1){

        imgPrincipal.src =
            img1;

    }
    else if(img2){

        imgPrincipal.src =
            img2;

    }
    else if(img3){

        imgPrincipal.src =
            img3;

    }


    /* =========================
       MINIATURA 1
    ========================= */

    if(img1){

        mini1.src =
            img1;

        mini1.style.display =
            "block";

    }
    else{

        mini1.style.display =
            "none";

    }


    /* =========================
       MINIATURA 2
    ========================= */

    if(img2){

        mini2.src =
            img2;

        mini2.style.display =
            "block";

    }
    else{

        mini2.style.display =
            "none";

    }


    /* =========================
       MINIATURA 3
    ========================= */

    if(img3){

        mini3.src =
            img3;

        mini3.style.display =
            "block";

    }
    else{

        mini3.style.display =
            "none";

    }


    /* =========================
       NOMBRE
    ========================= */

    document.getElementById(
        "nombre"
    ).textContent =
        productoActual.Nombre || "";


    /* =========================
       PRECIO
    ========================= */

    document.getElementById(
        "precio"
    ).textContent =
        "$" +
        (productoActual.Precio || "");


    /* =========================
       PRECIO ANTERIOR
    ========================= */

    const precioAnterior =
        (productoActual["Precio Anterior"] || "")
        .toString()
        .trim();


    if(precioAnterior){

        document.getElementById(
            "precioAnt"
        ).textContent =
            "$" +
            precioAnterior;

    }
    else{

        document.getElementById(
            "precioAnt"
        ).textContent =
            "";

    }


    /* =========================
       DESCRIPCIÓN + TAMAÑO
    ========================= */

    const descripcion =
        (productoActual["Descripción"] || "")
        .toString()
        .trim();


    const tamaño =
        (productoActual["Tamaño"] || "")
        .toString()
        .trim();


    let contenidoDescripcion = "";


    if(descripcion){

        contenidoDescripcion += `

            <b>Descripción:</b>

            <br>

            ${descripcion}

        `;

    }


    if(tamaño){

        if(contenidoDescripcion){

            contenidoDescripcion +=
                "<br><br>";

        }


        contenidoDescripcion += `

            <b>📏 Tamaño:</b>
            ${tamaño}

        `;

    }


    document.getElementById(
        "descripcion"
    ).innerHTML =
        contenidoDescripcion;


    /* =========================
       STOCK
    ========================= */

    const stock =
        (productoActual.Stock || "")
        .toString()
        .trim();


    if(stock){

        document.getElementById(
            "stock"
        ).textContent =
            "Stock: " +
            stock;

    }
    else{

        document.getElementById(
            "stock"
        ).textContent =
            "";

    }


    /* =========================
       ETIQUETAS
    ========================= */

    let etiquetas = "";


    const oferta =
        (productoActual.Oferta || "")
        .toString()
        .trim()
        .toUpperCase();


    const nuevo =
        (productoActual.Nuevo || "")
        .toString()
        .trim()
        .toUpperCase();


    if(oferta === "SI"){

        etiquetas += `

            <span class="oferta">
                OFERTA
            </span>

        `;

    }


    if(nuevo === "SI"){

        etiquetas += `

            <span class="nuevo">
                NUEVO
            </span>

        `;

    }


    document.getElementById(
        "etiquetas"
    ).innerHTML =
        etiquetas;


    /* =========================
       WHATSAPP
    ========================= */

    const linkProducto =
        window.location.href;


    const mensaje =
`Hola, quiero información sobre:

${productoActual.Nombre || ""}

Precio: $${productoActual.Precio || ""}

Código: ${productoActual.Código || ""}

Link:
${linkProducto}`;


    document.getElementById(
        "wpp"
    ).href =
        "https://wa.me/593990924437?text=" +
        encodeURIComponent(
            mensaje
        );


    /* =========================
       ACTUALIZAR CONTADOR
    ========================= */

    actualizarCarritoUI();

});


/* =====================================================
   CAMBIAR FOTO
===================================================== */

function cambiar(img){

    if(!img.src){

        return;

    }


    document.getElementById(
        "imgPrincipal"
    ).src =
        img.src;


    document
        .querySelectorAll(
            ".miniaturas img"
        )
        .forEach(imagen => {

            imagen.classList.remove(
                "activa"
            );

        });


    img.classList.add(
        "activa"
    );

}


/* =====================================================
   CARRITO
===================================================== */

function getCart(){

    return JSON.parse(
        localStorage.getItem(
            "carrito"
        )
    ) || [];

}


function saveCart(cart){

    localStorage.setItem(
        "carrito",
        JSON.stringify(cart)
    );

}


/* =====================================================
   AGREGAR AL CARRITO
===================================================== */

document.getElementById(
    "btnAddCart"
).addEventListener(
    "click",
    function(){

        if(!productoActual){

            return;

        }


        let cart =
            getCart();


        const codigo =
            (productoActual.Código || "")
            .toString()
            .trim();


        const index =
            cart.findIndex(
                item =>
                    item.codigo ===
                    codigo
            );


        const precio =
            parseFloat(
                productoActual.Precio
            ) || 0;


        const imagen =
            (productoActual["Foto 1"] || "")
            .toString()
            .trim();


        /* =========================
           YA EXISTE
        ========================= */

        if(index !== -1){

            cart[index].cantidad =
                (Number(
                    cart[index].cantidad
                ) || 1)
                + 1;

        }


        /* =========================
           NUEVO
        ========================= */

        else{

            cart.push({

                codigo:
                    codigo,

                nombre:
                    productoActual.Nombre || "",

                precio:
                    precio,

                imagen:
                    imagen,

                cantidad:
                    1

            });

        }


        saveCart(cart);

        actualizarCarritoUI();


        /* =========================
           CAMBIO VISUAL
        ========================= */

        const btn =
            this;


        btn.innerText =
            "✔ Agregado";


        btn.style.background =
            "#28a745";


        setTimeout(
            () => {

                btn.innerText =
                    "🛒 Agregar al carrito";


                btn.style.background =
                    "#d63384";

            },
            1200
        );

    }
);


/* =====================================================
   ACTUALIZAR CARRITO
===================================================== */

function actualizarCarritoUI(){

    const carrito =
        getCart();


    const total =
        carrito.reduce(
            (sum,p) =>
                sum +
                (Number(
                    p.cantidad
                ) || 0),
            0
        );


    const contador =
        document.getElementById(
            "cartCount"
        );


    if(contador){

        contador.textContent =
            total;

    }

}


/* =====================================================
   BOTÓN ARRIBA
===================================================== */

window.addEventListener(
    "scroll",
    function(){

        document.getElementById(
            "btnArriba"
        ).style.display =
            window.scrollY > 200
            ? "flex"
            : "none";

    }
);


/* =====================================================
   IR ARRIBA
===================================================== */

function irArriba(){

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


</script>


</body>

</html>
