const URL_SHEET =

/* =====================================================
   OBTENER CÓDIGO
===================================================== */

const params =
new URLSearchParams(
    window.location.search
);


const codigoBuscado =
(params.get("codigo") || "")
.toString()
.trim();


/* =====================================================
   NORMALIZAR
===================================================== */

function normalizar(texto){

    return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto){

    return String(texto || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   URL DEL PRODUCTO
===================================================== */

function crearURLProducto(codigo){

    return new URL(

        "producto.html?codigo=" +
        encodeURIComponent(codigo),

        window.location.href

    ).href;

}

        ) || [];

document.getElementById(
    "btnAddCart"
).addEventListener(

    "click",

    function(){

        if(!productoActual){

            return;

        }


        const codigo =
            String(
                productoActual.Código || ""
            ).trim();


        const precio =
            parseFloat(
                String(
                    productoActual.Precio || "0"
                )
                .replace(",", ".")
                .replace(/[^0-9.]/g,"")
            ) || 0;


        const imagen =
            String(
                productoActual["Foto 1"] ||
                productoActual["Foto 2"] ||
                ""
            ).trim();


        let cart =
            getCart();


        const index =
            cart.findIndex(
                item =>
                    String(item.codigo)
                    .trim()
                    === codigo
            );


        if(index !== -1){

            cart[index].cantidad =

                (Number(
                    cart[index].cantidad
                ) || 1) + 1;

        }

        else{

            cart.push({

                codigo:codigo,

                nombre:
                    productoActual.Nombre || "",

                precio:precio,

                imagen:imagen,

                cantidad:1

            });

        }


        saveCart(cart);

        actualizarCarritoUI();


        /* CAMBIO VISUAL */

        const boton =
            this;


        boton.textContent =
            "✔ Agregado al carrito";


        boton.style.background =
            "#28a745";


        setTimeout(() => {

            boton.textContent =
                "🛒 Agregar al carrito";


            boton.style.background =
                "var(--rosa)";

        },1200);

    }

);


/* =====================================================
   RENDERIZAR CARRITO
===================================================== */

function renderizarCarrito(){

    const contenedor =
        document.getElementById(
            "carritoItems"
        );


    const totalElemento =
        document.getElementById(
            "carritoTotal"
        );


    if(!contenedor){

        return;

    }


    const carrito =
        getCart();


    if(carrito.length === 0){

        contenedor.innerHTML = `

            <div class="carrito-vacio">

                🛒

                <br><br>

                Tu carrito está vacío.

            </div>

        `;


        totalElemento.textContent =
            "$0.00";


        actualizarWppCarrito();

        return;

    }


    let total = 0;


    contenedor.innerHTML = "";


    carrito.forEach(
        (producto,index) => {


        const cantidad =
            Number(
                producto.cantidad
            ) || 1;


        const precio =
            Number(
                producto.precio
            ) || 0;


        const subtotal =
            precio * cantidad;


        total += subtotal;


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "item-carrito";


        div.innerHTML = `

            <img
                src="${escaparHTML(producto.imagen || "")}"
                alt="">


            <div class="item-info">

                <div class="item-nombre">

                    ${escaparHTML(
                        producto.nombre
                    )}

                </div>


                <div class="item-precio">

                    $${precio.toFixed(2)}

                </div>


                <div class="item-controles">

                    <button
                        onclick="cambiarCantidad(${index},-1)">

                        −

                    </button>


                    <span>

                        ${cantidad}

                    </span>


                    <button
                        onclick="cambiarCantidad(${index},1)">

                        +

                    </button>

                </div>

            </div>


            <button
                class="btn-eliminar"
                onclick="eliminarProducto(${index})">

                🗑️

            </button>

        `;


        contenedor.appendChild(div);

    });


    totalElemento.textContent =
        "$" + total.toFixed(2);


    actualizarWppCarrito();

}


/* =====================================================
   CAMBIAR CANTIDAD
===================================================== */

function cambiarCantidad(index,cambio){

    let cart =
        getCart();


    if(!cart[index]){

        return;

    }


    cart[index].cantidad =
        (Number(
            cart[index].cantidad
        ) || 1) + cambio;


    if(cart[index].cantidad <= 0){

        cart.splice(index,1);

    }


    saveCart(cart);

    actualizarCarritoUI();

}


/* =====================================================
   ELIMINAR
===================================================== */

function eliminarProducto(index){

    let cart =
        getCart();


    cart.splice(
        index,
        1
    );


    saveCart(cart);

    actualizarCarritoUI();

}


/* =====================================================
   WHATSAPP DEL CARRITO
===================================================== */

function actualizarWppCarrito(){

    const carrito =
        getCart();


    let total = 0;


    let mensaje =

`Hola, quiero realizar una compra:

`;


    carrito.forEach(producto => {


        const cantidad =
            Number(
                producto.cantidad
            ) || 1;


        const precio =
            Number(
                producto.precio
            ) || 0;


        total +=
            precio * cantidad;


        const urlProducto =
            crearURLProducto(
                producto.codigo
            );


        mensaje +=

`🛍️ ${producto.nombre}
Cantidad: ${cantidad}
Precio: $${precio.toFixed(2)}
${urlProducto}

`;

    });


    mensaje +=

`TOTAL: $${total.toFixed(2)}`;


    const boton =
        document.getElementById(
            "wppCarrito"
        );


    if(boton){

        boton.href =

            "https://wa.me/" +
            WHATSAPP +
            "?text=" +
            encodeURIComponent(
                mensaje
            );

    }

}
