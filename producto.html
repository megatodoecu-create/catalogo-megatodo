<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Producto - Megatodo</title>

<style>

/* =====================================================
   COLORES MEGATODO
===================================================== */

:root{
    --rosa:#E83B83;
    --morado:#7867B7;
    --lavanda:#9690D0;
    --naranja:#F2A52B;
    --celeste:#08A5C6;
    --turquesa:#63BBAE;
    --azul:#18234B;
    --rosa-claro:#FFF5FA;
    --rosa-suave:#FDE4EF;
}


/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    width:100%;
    min-height:125px;
    background:white;
    display:flex;
    align-items:flex-start;
    gap:20px;
    padding:10px 20px;
    position:relative;
    z-index:1000;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}


/* =====================================================
   MARCA MEGATODO
===================================================== */

.marca-megatodo{
    flex-shrink:0;
    width:270px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}


/* =====================================================
   ENLACE DEL LOGO
===================================================== */

.logo-enlace{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    width:max-content;
    padding:0;
    margin:0;
    text-decoration:none;
    color:inherit;
    line-height:normal;
}


/* =====================================================
   LOGO
===================================================== */

.logo-megatodo{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    height:49px;
    line-height:1;
    white-space:nowrap;
}

.logo-letra{
    font-family:Arial Rounded MT Bold,Arial,Helvetica,sans-serif;
    font-size:48px;
    font-weight:900;
    letter-spacing:-4px;
}

.logo-m{
    color:var(--rosa);
}

.logo-e{
    color:var(--morado);
}

.logo-g{
    color:var(--lavanda);
}

.logo-a{
    color:var(--naranja);
}

.logo-t{
    color:var(--rosa);
}

.logo-o1{
    color:var(--celeste);
}

.logo-d{
    color:var(--celeste);
}

.logo-o2{
    color:var(--turquesa);
}


/* =====================================================
   ESLÓGAN
===================================================== */

.eslogan{
    margin:2px 0 5px 8px;
    font-size:15px;
    color:var(--azul);
    font-weight:500;
    letter-spacing:.2px;
}


/* =====================================================
   SONRISA
===================================================== */

.sonrisa-megatodo{
    position:relative;
    width:68px;
    height:25px;
    margin-left:92px;
    margin-bottom:7px;
}

.sonrisa-megatodo:before{
    content:"";
    position:absolute;
    left:5px;
    top:0;
    width:54px;
    height:22px;
    border-bottom:5px solid var(--rosa);
    border-radius:0 0 50px 50px;
}

.sonrisa-megatodo:after{
    content:"";
    position:absolute;
    left:2px;
    top:-2px;
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--rosa);
    box-shadow:53px 0 0 var(--rosa);
}


/* =====================================================
   MENÚ CATEGORÍAS
===================================================== */

.menu-categorias{
    position:relative;
    flex-shrink:0;
}

.btn-menu{
    height:38px;
    padding:0 15px;
    border:0;
    border-radius:22px;
    background:linear-gradient(
        135deg,
        var(--rosa),
        #f05b9b
    );
    color:white;
    font-size:14px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(232,59,131,.22);
    transition:.2s;
}

.btn-menu:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 17px rgba(232,59,131,.30);
}

.btn-menu-icono{
    font-size:20px;
    line-height:1;
}

.menu-flecha{
    font-size:17px;
    transition:.25s;
}


/* =====================================================
   DESPLEGABLE
===================================================== */

.menu-desplegable{
    position:absolute;
    top:46px;
    left:0;
    width:235px;
    background:white;
    border-radius:0 0 17px 17px;
    box-shadow:0 10px 28px rgba(0,0,0,.14);
    border:1px solid #f3d7e4;
    overflow:hidden;
    opacity:0;
    visibility:hidden;
    transform:translateY(-8px);
    transition:.25s;
    z-index:10000;
}

.menu-categorias.abierto .menu-desplegable{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

.menu-categorias.abierto .menu-flecha{
    transform:rotate(180deg);
}

.menu-desplegable a{
    display:flex;
    align-items:center;
    gap:12px;
    min-height:45px;
    padding:9px 16px;
    text-decoration:none;
    color:var(--azul);
    font-size:14px;
    font-weight:bold;
    border-bottom:1px solid #f5edf1;
    transition:.2s;
}

.menu-desplegable a:last-child{
    border-bottom:0;
}

.menu-desplegable a:hover{
    background:#fff0f7;
    color:var(--rosa);
    padding-left:21px;
}


/* =====================================================
   BUSCADOR
===================================================== */

.buscador-header{
    flex:1;
    max-width:700px;
    position:relative;
    margin-top:18px;
}

.buscador-header input{
    width:100%;
    height:45px;
    border:2px solid #eadde5;
    border-radius:25px;
    outline:none;
    padding:0 55px 0 18px;
    font-size:14px;
    background:#fff;
    transition:.2s;
}

.buscador-header input:focus{
    border-color:var(--rosa);
    box-shadow:0 0 0 3px rgba(232,59,131,.10);
}

.buscador-header button{
    position:absolute;
    right:5px;
    top:5px;
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:var(--rosa);
    color:white;
    cursor:pointer;
    font-size:17px;
}


/* =====================================================
   RESULTADOS DEL BUSCADOR
===================================================== */

#resultadosBusqueda{
    position:absolute;
    top:50px;
    left:0;
    width:100%;
    background:white;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    overflow:hidden;
    display:none;
    z-index:20000;
}

.resultado-busqueda{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 13px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.resultado-busqueda:hover{
    background:#fff0f7;
}

.resultado-busqueda img{
    width:45px;
    height:45px;
    object-fit:contain;
    border-radius:8px;
    background:#fafafa;
}

.resultado-busqueda strong{
    font-size:13px;
    color:var(--azul);
}

.resultado-busqueda small{
    display:block;
    color:var(--rosa);
    margin-top:3px;
}


/* =====================================================
   CARRITO SUPERIOR
===================================================== */

.btn-carrito-global{
    flex-shrink:0;
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:var(--rosa-suave);
    font-size:25px;
    cursor:pointer;
    position:relative;
    margin-top:14px;
    transition:.2s;
}

.btn-carrito-global:hover{
    transform:scale(1.06);
}

#cartCount{
    position:absolute;
    top:-3px;
    right:-3px;
    min-width:23px;
    height:23px;
    padding:0 5px;
    border-radius:50%;
    background:var(--rosa);
    color:white;
    font-size:11px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}


/* =====================================================
   CONTENIDO PRODUCTO
===================================================== */

.contenedor-producto{
    width:min(1200px,94%);
    margin:35px auto 60px;
}

.volver{
    display:inline-flex;
    align-items:center;
    gap:7px;
    color:var(--rosa);
    text-decoration:none;
    font-weight:bold;
    margin-bottom:20px;
}

.volver:hover{
    text-decoration:underline;
}


/* =====================================================
   TARJETA PRODUCTO
===================================================== */

.producto{
    background:white;
    border-radius:20px;
    padding:25px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:35px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}


/* =====================================================
   FOTOS
===================================================== */

.galeria{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.foto-principal{
    width:100%;
    height:430px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
}

.foto-principal img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.miniaturas{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.miniatura{
    width:72px;
    height:72px;
    border:2px solid #eee;
    border-radius:10px;
    padding:4px;
    background:white;
    cursor:pointer;
    transition:.2s;
}

.miniatura:hover{
    border-color:var(--rosa);
}

.miniatura.activa{
    border-color:var(--rosa);
}

.miniatura img{
    width:100%;
    height:100%;
    object-fit:contain;
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.info-producto{
    padding:10px 5px;
}

.categoria-producto{
    color:var(--morado);
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

.nombre-producto{
    font-size:32px;
    color:var(--azul);
    margin:0 0 15px;
    line-height:1.15;
}


/* =====================================================
   BADGES
===================================================== */

.badges{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    color:white;
    font-size:12px;
    font-weight:bold;
}

.badge-oferta{
    background:var(--rosa);
}

.badge-nuevo{
    background:var(--turquesa);
}


/* =====================================================
   PRECIO
===================================================== */

.precio{
    font-size:34px;
    font-weight:900;
    color:var(--rosa);
    margin:15px 0;
}

.precio-anterior{
    color:#999;
    font-size:18px;
    text-decoration:line-through;
    margin-right:8px;
}


/* =====================================================
   DETALLES
===================================================== */

.detalle{
    padding:13px 0;
    border-bottom:1px solid #eee;
    font-size:15px;
}

.detalle strong{
    color:var(--azul);
}


/* =====================================================
   DESCRIPCIÓN
===================================================== */

.descripcion{
    margin-top:20px;
}

.descripcion-titulo{
    font-size:18px;
    font-weight:bold;
    color:var(--azul);
    margin-bottom:8px;
}

.descripcion-texto{
    color:#555;
    line-height:1.6;
}


/* =====================================================
   STOCK
===================================================== */

.stock{
    margin-top:18px;
    padding:10px 14px;
    border-radius:10px;
    background:#eefaf5;
    color:#20855d;
    font-weight:bold;
    display:inline-block;
}


/* =====================================================
   BOTONES PRODUCTO
===================================================== */

.botones-producto{
    display:flex;
    gap:12px;
    margin-top:25px;
    flex-wrap:wrap;
}

.btn-carrito{
    flex:1;
    min-width:190px;
    height:48px;
    border:0;
    border-radius:25px;
    background:var(--azul);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.btn-carrito:hover{
    transform:translateY(-2px);
    opacity:.92;
}

.btn-whatsapp{
    flex:1;
    min-width:190px;
    height:48px;
    border:0;
    border-radius:25px;
    background:#25D366;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.btn-whatsapp:hover{
    transform:translateY(-2px);
    opacity:.92;
}


/* =====================================================
   CARRITO LATERAL
===================================================== */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:30000;
}

.overlay.activo{
    opacity:1;
    visibility:visible;
}

.carrito-panel{
    position:fixed;
    top:0;
    right:0;
    width:min(420px,92%);
    height:100vh;
    background:white;
    box-shadow:-8px 0 30px rgba(0,0,0,.18);
    z-index:30001;
    transform:translateX(100%);
    transition:.35s;
    display:flex;
    flex-direction:column;
}

.carrito-panel.abierto{
    transform:translateX(0);
}

.carrito-header{
    padding:20px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.carrito-header h2{
    margin:0;
    color:var(--azul);
    font-size:21px;
}

.cerrar-carrito{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#f5f5f5;
    cursor:pointer;
    font-size:20px;
}

.carrito-items{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.carrito-vacio{
    text-align:center;
    padding:50px 20px;
    color:#888;
}

.item-carrito{
    display:grid;
    grid-template-columns:65px 1fr auto;
    gap:10px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.item-carrito img{
    width:65px;
    height:65px;
    object-fit:contain;
    border-radius:10px;
    background:#fafafa;
}

.item-carrito strong{
    display:block;
    color:var(--azul);
    font-size:13px;
}

.item-carrito .item-precio{
    color:var(--rosa);
    font-weight:bold;
    margin-top:5px;
}

.controles-cantidad{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:7px;
}

.controles-cantidad button{
    width:25px;
    height:25px;
    border:0;
    border-radius:50%;
    background:var(--rosa-suave);
    color:var(--rosa);
    font-weight:bold;
    cursor:pointer;
}

.btn-eliminar{
    border:0;
    background:none;
    color:#999;
    cursor:pointer;
    font-size:17px;
}


/* =====================================================
   PIE DEL CARRITO
===================================================== */

.carrito-footer{
    border-top:1px solid #eee;
    padding:18px;
    background:white;
}

.total-carrito{
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:bold;
    color:var(--azul);
    margin-bottom:15px;
}


/* BOTÓN WHATSAPP */

.btn-whatsapp-carrito{
    width:100%;
    height:48px;
    border:0;
    border-radius:25px;
    background:#25D366;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.btn-whatsapp-carrito:hover{
    transform:translateY(-1px);
    opacity:.92;
}


/* BOTÓN VER CARRITO COMPLETO */

.btn-ver-carrito{
    width:100%;
    height:46px;
    margin-top:10px;
    border:2px solid var(--rosa);
    border-radius:25px;
    background:white;
    color:var(--rosa);
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
    transition:.2s;
}

.btn-ver-carrito:hover{
    background:var(--rosa-suave);
    transform:translateY(-1px);
}


/* =====================================================
   BOTÓN ARRIBA
===================================================== */

#btnArriba{
    position:fixed;
    left:18px;
    bottom:20px;
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:var(--rosa);
    color:white;
    font-size:20px;
    cursor:pointer;
    display:none;
    z-index:25000;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}


/* =====================================================
   MENSAJES
===================================================== */

.mensaje{
    text-align:center;
    padding:60px 20px;
}

.mensaje h2{
    color:var(--azul);
}

.mensaje p{
    color:#777;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

    .header{
        min-height:115px;
        padding:9px 15px;
        gap:14px;
    }

    .marca-megatodo{
        width:245px;
    }

    .logo-letra{
        font-size:43px;
    }

    .producto{
        grid-template-columns:1fr;
    }

    .foto-principal{
        height:400px;
    }

}


@media(max-width:650px){

    .header{
        min-height:105px;
        height:auto;
        padding:7px 9px;
        gap:7px;
        align-items:center;
    }

    .marca-megatodo{
        width:130px;
        align-items:flex-start;
    }

    .logo-megatodo{
        height:31px;
    }

    .logo-letra{
        font-size:29px;
        letter-spacing:-3px;
    }

    .eslogan{
        font-size:8px;
        margin:2px 0 2px 3px;
    }

    .sonrisa-megatodo{
        transform:scale(.60);
        transform-origin:left top;
        width:68px;
        height:18px;
        margin-left:39px;
        margin-bottom:-2px;
    }

    .menu-categorias{
        position:absolute;
        left:9px;
        bottom:5px;
    }

    .btn-menu{
        height:28px;
        padding:0 10px;
        font-size:10px;
        gap:5px;
    }

    .btn-menu-icono{
        font-size:15px;
    }

    .menu-flecha{
        font-size:13px;
    }

    .menu-desplegable{
        top:34px;
        left:0;
        width:215px;
    }

    .buscador-header{
        margin-left:3px;
        margin-right:3px;
        margin-top:0;
    }

    .buscador-header input{
        height:40px;
        padding-left:13px;
        padding-right:47px;
        font-size:12px;
    }

    .buscador-header button{
        width:34px;
        height:34px;
        top:3px;
        right:3px;
        font-size:16px;
    }

    .btn-carrito-global{
        width:45px;
        height:45px;
        font-size:22px;
        margin-top:0;
    }

    #cartCount{
        min-width:21px;
        height:21px;
        font-size:10px;
    }

    .contenedor-producto{
        width:94%;
        margin-top:25px;
    }

    .producto{
        padding:16px;
        border-radius:16px;
        gap:20px;
    }

    .foto-principal{
        height:320px;
    }

    .nombre-producto{
        font-size:25px;
    }

    .precio{
        font-size:29px;
    }

    .botones-producto{
        flex-direction:column;
    }

    .btn-carrito,
    .btn-whatsapp{
        width:100%;
    }

}


@media(max-width:400px){

    .marca-megatodo{
        width:112px;
    }

    .logo-letra{
        font-size:25px;
        letter-spacing:-3px;
    }

    .eslogan{
        font-size:7px;
    }

    .buscador-header input{
        font-size:11px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="marca-megatodo">

        <!-- LOGO CLICKEABLE -->

        <a href="index.html"
           class="logo-enlace"
           aria-label="Ir a la página principal">

            <div class="logo-megatodo">

                <span class="logo-letra logo-m">m</span>
                <span class="logo-letra logo-e">e</span>
                <span class="logo-letra logo-g">g</span>
                <span class="logo-letra logo-a">a</span>
                <span class="logo-letra logo-t">t</span>
                <span class="logo-letra logo-o1">o</span>
                <span class="logo-letra logo-d">d</span>
                <span class="logo-letra logo-o2">o</span>

            </div>

            <div class="eslogan">
                Todo lo que necesitas
            </div>

            <div class="sonrisa-megatodo"></div>

        </a>


        <!-- MENÚ -->

        <div class="menu-categorias"
             id="menuCategorias">

            <button
                class="btn-menu"
                id="btnMenuCategorias"
                type="button">

                <span class="btn-menu-icono">
                    ☰
                </span>

                <span>
                    Categorías
                </span>

                <span class="menu-flecha">
                    ⌄
                </span>

            </button>


            <div
                class="menu-desplegable"
                id="menuDesplegable">

                <a href="categoria.html?cat=Artículos%20de%20Belleza">
                    💄 Artículos de Belleza
                </a>

                <a href="categoria.html?cat=Juguetes">
                    🧸 Juguetes
                </a>

                <a href="categoria.html?cat=Bazar">
                    🏠 Bazar
                </a>

                <a href="categoria.html?cat=Peluches">
                    🐻 Peluches
                </a>

<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const URL_SHEET =
"https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

const NUMERO_WHATSAPP =
"593990924437";


/* =====================================================
   VARIABLES
===================================================== */

let productos = [];

let productoActual = null;


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto){

    return String(texto ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();

}


/* =====================================================
   OBTENER CÓDIGO DE URL
===================================================== */

const parametros =
new URLSearchParams(
    window.location.search
);

const codigoURL =
parametros.get("codigo");


/* =====================================================
   CARGAR PRODUCTOS
===================================================== */

async function cargarProductos(){

    try{

        const respuesta =
        await fetch(URL_SHEET);


        if(!respuesta.ok){

            throw new Error(
                "No se pudo cargar el catálogo."
            );

        }


        productos =
        await respuesta.json();


        /* =============================================
           BUSCAR PRODUCTO POR CÓDIGO
        ============================================= */

        productoActual =
        productos.find(p => {

            const codigo =
            String(
                p.Código ??
                p.Codigo ??
                ""
            ).trim();


            return codigo ===
            String(
                codigoURL ?? ""
            ).trim();

        });


        /* =============================================
           SEGUNDO INTENTO SIN ACENTOS
        ============================================= */

        if(!productoActual){

            productoActual =
            productos.find(p => {

                const codigo =
                String(
                    p.Código ??
                    p.Codigo ??
                    ""
                );


                return normalizar(codigo) ===
                normalizar(codigoURL);

            });

        }


        if(!productoActual){

            document.getElementById(
                "contenedorProducto"
            ).innerHTML = `

                <div class="mensaje">

                    <h2>
                        Producto no encontrado
                    </h2>

                    <p>
                        No encontramos el producto solicitado.
                    </p>

                </div>

            `;

            return;

        }


        mostrarProducto();

        actualizarContadorCarrito();

    }

    catch(error){

        console.error(error);


        document.getElementById(
            "contenedorProducto"
        ).innerHTML = `

            <div class="mensaje">

                <h2>
                    Error al cargar el producto
                </h2>

                <p>
                    Intenta nuevamente.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   MOSTRAR PRODUCTO
===================================================== */

function mostrarProducto(){

    const p =
    productoActual;


    const nombre =
    String(
        p.Nombre ?? ""
    ).trim();


    const categoria =
    String(
        p.Categoria ??
        p.Categoría ??
        ""
    ).trim();


    const precio =
    String(
        p.Precio ??
        ""
    ).trim();


    const precioAnterior =
    String(
        p["Precio Anterior"] ??
        p.PrecioAnterior ??
        ""
    ).trim();


    const tamanio =
    String(
        p.Tamaño ??
        p.Tamano ??
        ""
    ).trim();


    const descripcion =
    String(
        p.Descripción ??
        p.Descripcion ??
        ""
    ).trim();


    const stock =
    String(
        p.Stock ??
        ""
    ).trim();


    const foto1 =
    String(
        p["Foto 1"] ??
        p.Foto ??
        ""
    ).trim();


    const foto2 =
    String(
        p["Foto 2"] ??
        ""
    ).trim();


    const foto3 =
    String(
        p["Foto 3"] ??
        ""
    ).trim();


    const oferta =
    normalizar(p.Oferta) === "si";


    const nuevo =
    normalizar(p.Nuevo) === "si";


    /* =============================================
       FOTOS
    ============================================= */

    const fotos = [];


    if(foto1){
        fotos.push(foto1);
    }

    if(foto2){
        fotos.push(foto2);
    }

    if(foto3){
        fotos.push(foto3);
    }


    if(fotos.length === 0){

        fotos.push(
            "https://via.placeholder.com/600x600?text=Megatodo"
        );

    }


    /* =============================================
       BADGES
    ============================================= */

    let htmlBadges = "";


    if(oferta){

        htmlBadges += `

            <span class="badge badge-oferta">
                OFERTA
            </span>

        `;

    }


    if(nuevo){

        htmlBadges += `

            <span class="badge badge-nuevo">
                NUEVO
            </span>

        `;

    }


    /* =============================================
       PRECIO ANTERIOR
    ============================================= */

    let htmlPrecioAnterior = "";


    if(precioAnterior){

        htmlPrecioAnterior = `

            <span class="precio-anterior">
                ${precioAnterior}
            </span>

        `;

    }


    /* =============================================
       TAMAÑO
    ============================================= */

    let htmlTamanio = "";


    if(tamanio){

        htmlTamanio = `

            <div class="detalle">

                <strong>
                    Tamaño:
                </strong>

                ${tamanio}

            </div>

        `;

    }


    /* =============================================
       DESCRIPCIÓN
    ============================================= */

    let htmlDescripcion = "";


    if(descripcion){

        htmlDescripcion = `

            <div class="descripcion">

                <div class="descripcion-titulo">
                    Descripción
                </div>

                <div class="descripcion-texto">
                    ${descripcion}
                </div>

            </div>

        `;

    }


    /* =============================================
       STOCK
    ============================================= */

    let htmlStock = "";


    if(stock){

        htmlStock = `

            <div class="stock">
                ${stock}
            </div>

        `;

    }


    /* =============================================
       MINIATURAS
    ============================================= */

    let htmlMiniaturas = "";


    if(fotos.length > 1){

        fotos.forEach(
            (foto,index) => {

                htmlMiniaturas += `

                    <button
                        class="miniatura ${index === 0 ? "activa" : ""}"
                        type="button"
                        onclick="cambiarFoto(${index})">

                        <img
                            src="${foto}"
                            alt="${nombre}">

                    </button>

                `;

            }
        );

    }


    /* =============================================
       HTML PRODUCTO
    ============================================= */

    document.getElementById(
        "contenedorProducto"
    ).innerHTML = `

        <div class="producto">


            <!-- GALERÍA -->

            <div class="galeria">

                <div class="foto-principal">

                    <img
                        id="fotoPrincipal"
                        src="${fotos[0]}"
                        alt="${nombre}">

                </div>


                <div class="miniaturas">

                    ${htmlMiniaturas}

                </div>

            </div>


            <!-- INFORMACIÓN -->

            <div class="info-producto">


                <div class="categoria-producto">

                    ${categoria}

                </div>


                <h1 class="nombre-producto">

                    ${nombre}

                </h1>


                <div class="badges">

                    ${htmlBadges}

                </div>


                <div class="precio">

                    ${htmlPrecioAnterior}

                    ${precio}

                </div>


                ${htmlTamanio}


                ${htmlDescripcion}


                ${htmlStock}


                <div class="botones-producto">


                    <button
                        class="btn-carrito"
                        type="button"
                        onclick="agregarAlCarrito()">

                        🛒 Agregar al carrito

                    </button>


                    <button
                        class="btn-whatsapp"
                        type="button"
                        onclick="comprarProductoWhatsApp()">

                        💬 Comprar por WhatsApp

                    </button>


                </div>


            </div>

        </div>

    `;

}


/* =====================================================
   CAMBIAR FOTO
===================================================== */

function cambiarFoto(indice){

    const p =
    productoActual;


    const fotos = [];


    const foto1 =
    String(
        p["Foto 1"] ??
        p.Foto ??
        ""
    ).trim();


    const foto2 =
    String(
        p["Foto 2"] ??
        ""
    ).trim();


    const foto3 =
    String(
        p["Foto 3"] ??
        ""
    ).trim();


    if(foto1){
        fotos.push(foto1);
    }

    if(foto2){
        fotos.push(foto2);
    }

    if(foto3){
        fotos.push(foto3);
    }


    if(!fotos[indice]){
        return;
    }


    document.getElementById(
        "fotoPrincipal"
    ).src =
    fotos[indice];


    document.querySelectorAll(
        ".miniatura"
    ).forEach(
        (miniatura,i) => {

            miniatura.classList.toggle(
                "activa",
                i === indice
            );

        }
    );

}


/* =====================================================
   OBTENER CARRITO
===================================================== */

function obtenerCarrito(){

    try{

        return JSON.parse(
            localStorage.getItem("carrito")
        ) || [];

    }

    catch{

        return [];

    }

}


/* =====================================================
   GUARDAR CARRITO
===================================================== */

function guardarCarrito(carrito){

    localStorage.setItem(
        "carrito",
        JSON.stringify(carrito)
    );


    actualizarContadorCarrito();

}


/* =====================================================
   AGREGAR AL CARRITO
===================================================== */

function agregarAlCarrito(){

    if(!productoActual){
        return;
    }


    const carrito =
    obtenerCarrito();


    const codigo =
    String(
        productoActual.Código ??
        productoActual.Codigo ??
        ""
    ).trim();


    const nombre =
    String(
        productoActual.Nombre ??
        ""
    ).trim();


    const precio =
    String(
        productoActual.Precio ??
        ""
    ).trim();


    const foto =
    String(
        productoActual["Foto 1"] ??
        productoActual.Foto ??
        ""
    ).trim();


    const existente =
    carrito.find(
        item =>
        item.codigo === codigo
    );


    if(existente){

        existente.cantidad++;

    }

    else{

        carrito.push({

            codigo:codigo,

            nombre:nombre,

            precio:precio,

            cantidad:1,

            foto:foto

        });

    }


    guardarCarrito(carrito);


    abrirCarrito();

}


/* =====================================================
   CONTADOR CARRITO
===================================================== */

function actualizarContadorCarrito(){

    const carrito =
    obtenerCarrito();


    const cantidad =
    carrito.reduce(
        (total,item) =>
        total +
        Number(
            item.cantidad || 0
        ),
        0
    );


    document.getElementById(
        "cartCount"
    ).textContent =
    cantidad;

}


/* =====================================================
   PRECIO A NÚMERO
===================================================== */

function convertirPrecio(valor){

    const limpio =
    String(valor ?? "")
        .replace(/[^\d.,-]/g,"")
        .replace(",", ".");


    const numero =
    parseFloat(limpio);


    return isNaN(numero)
        ? 0
        : numero;

}


/* =====================================================
   MOSTRAR CARRITO
===================================================== */

function mostrarCarrito(){

    const carrito =
    obtenerCarrito();


    const contenedor =
    document.getElementById(
        "carritoItems"
    );


    if(carrito.length === 0){

        contenedor.innerHTML = `

            <div class="carrito-vacio">

                <div style="font-size:45px;">
                    🛒
                </div>

                <p>
                    Tu carrito está vacío.
                </p>

            </div>

        `;


        document.getElementById(
            "totalCarrito"
        ).textContent =
        "$0.00";


        return;

    }


    let total = 0;


    contenedor.innerHTML =
    carrito.map(
        (item,index) => {

            const precio =
            convertirPrecio(
                item.precio
            );


            const cantidad =
            Number(
                item.cantidad || 1
            );


            total +=
            precio * cantidad;


            return `

                <div class="item-carrito">

                    <img
                        src="${item.foto || ""}"
                        alt="${item.nombre}">


                    <div>

                        <strong>
                            ${item.nombre}
                        </strong>


                        <div class="item-precio">

                            ${item.precio}

                        </div>


                        <div class="controles-cantidad">

                            <button
                                type="button"
                                onclick="cambiarCantidad(${index},-1)">

                                −

                            </button>


                            <span>
                                ${cantidad}
                            </span>


                            <button
                                type="button"
                                onclick="cambiarCantidad(${index},1)">

                                +

                            </button>

                        </div>

                    </div>


                    <button
                        class="btn-eliminar"
                        type="button"
                        onclick="eliminarDelCarrito(${index})">

                        🗑️

                    </button>

                </div>

            `;

        }
    ).join("");


    document.getElementById(
        "totalCarrito"
    ).textContent =
    "$" +
    total.toFixed(2);

}


/* =====================================================
   CAMBIAR CANTIDAD
===================================================== */

function cambiarCantidad(
    indice,
    cambio
){

    const carrito =
    obtenerCarrito();


    if(!carrito[indice]){
        return;
    }


    carrito[indice].cantidad =
    Number(
        carrito[indice].cantidad || 1
    ) + cambio;


    if(
        carrito[indice].cantidad <= 0
    ){

        carrito.splice(
            indice,
            1
        );

    }


    guardarCarrito(carrito);

    mostrarCarrito();

}


/* =====================================================
   ELIMINAR PRODUCTO
===================================================== */

function eliminarDelCarrito(indice){

    const carrito =
    obtenerCarrito();


    carrito.splice(
        indice,
        1
    );


    guardarCarrito(carrito);

    mostrarCarrito();

}


/* =====================================================
   ABRIR CARRITO
===================================================== */

function abrirCarrito(){

    mostrarCarrito();


    document.getElementById(
        "carritoPanel"
    ).classList.add(
        "abierto"
    );


    document.getElementById(
        "overlayCarrito"
    ).classList.add(
        "activo"
    );

}


/* =====================================================
   CERRAR CARRITO
===================================================== */

function cerrarCarrito(){

    document.getElementById(
        "carritoPanel"
    ).classList.remove(
        "abierto"
    );


    document.getElementById(
        "overlayCarrito"
    ).classList.remove(
        "activo"
    );

}


/* =====================================================
   WHATSAPP PRODUCTO
===================================================== */

function comprarProductoWhatsApp(){

    if(!productoActual){
        return;
    }


    const codigo =
    String(
        productoActual.Código ??
        productoActual.Codigo ??
        ""
    ).trim();


    const nombre =
    String(
        productoActual.Nombre ??
        ""
    ).trim();


    const precio =
    String(
        productoActual.Precio ??
        ""
    ).trim();


    const urlProducto =
    new URL(
        "producto.html?codigo=" +
        encodeURIComponent(codigo),
        window.location.href
    ).href;


    const mensaje =
`Hola Megatodo 👋

Estoy interesado en este producto:

🛍️ ${nombre}
💰 Precio: ${precio}
🔢 Código: ${codigo}

🔗 Ver producto:
${urlProducto}`;


    const urlWhatsApp =
    "https://wa.me/" +
    NUMERO_WHATSAPP +
    "?text=" +
    encodeURIComponent(
        mensaje
    );


    window.open(
        urlWhatsApp,
        "_blank"
    );

}


/* =====================================================
   WHATSAPP CARRITO
===================================================== */

function prepararWhatsAppCarrito(){

    const carrito =
    obtenerCarrito();


    if(carrito.length === 0){

        alert(
            "Tu carrito está vacío."
        );

        return;

    }


    let mensaje =
`Hola Megatodo 👋

Quiero realizar una compra:

`;


    let total = 0;


    carrito.forEach(
        (item,index) => {

            const precio =
            convertirPrecio(
                item.precio
            );


            const cantidad =
            Number(
                item.cantidad || 1
            );


            total +=
            precio * cantidad;


            const urlProducto =
            new URL(
                "producto.html?codigo=" +
                encodeURIComponent(
                    item.codigo
                ),
                window.location.href
            ).href;


            mensaje +=
`${index + 1}. ${item.nombre}
Cantidad: ${cantidad}
Precio: ${item.precio}
Subtotal: $${(
    precio * cantidad
).toFixed(2)}

🔗 Producto:
${urlProducto}

`;

        }
    );


    mensaje +=
`💰 TOTAL: $${total.toFixed(2)}

Quedo atento/a. Gracias 😊`;


    const urlWhatsApp =
    "https://wa.me/" +
    NUMERO_WHATSAPP +
    "?text=" +
    encodeURIComponent(
        mensaje
    );


    window.open(
        urlWhatsApp,
        "_blank"
    );

}

/* =====================================================
   BUSCADOR
===================================================== */

const buscadorGlobal =
document.getElementById(
    "buscadorGlobal"
);


const resultadosBusqueda =
document.getElementById(
    "resultadosBusqueda"
);


function mostrarResultadosBusqueda(){

    const texto =
    normalizar(
        buscadorGlobal.value
    );


    if(!texto){

        resultadosBusqueda.style.display =
        "none";

        resultadosBusqueda.innerHTML =
        "";

        return;

    }


    if(productos.length === 0){
        return;
    }


    const resultados =
    productos.filter(
        p => {

            const nombre =
            normalizar(
                p.Nombre
            );


            const categoria =
            normalizar(
                p.Categoria ??
                p.Categoría ??
                ""
            );


            const codigo =
            normalizar(
                p.Código ??
                p.Codigo ??
                ""
            );


            return (
                nombre.includes(texto) ||
                categoria.includes(texto) ||
                codigo.includes(texto)
            );

        }
    ).slice(0,8);


    if(resultados.length === 0){

        resultadosBusqueda.innerHTML = `

            <div
                style="
                    padding:15px;
                    text-align:center;
                    color:#888;
                ">

                No encontramos productos.

            </div>

        `;


        resultadosBusqueda.style.display =
        "block";


        return;

    }


    resultadosBusqueda.innerHTML =
    resultados.map(
        p => {

            const codigo =
            String(
                p.Código ??
                p.Codigo ??
                ""
            ).trim();


            const nombre =
            String(
                p.Nombre ??
                ""
            ).trim();


            const precio =
            String(
                p.Precio ??
                ""
            ).trim();


            const foto =
            String(
                p["Foto 1"] ??
                p.Foto ??
                ""
            ).trim();


            return `

                <div
                    class="resultado-busqueda"
                    onclick="irAProducto('${encodeURIComponent(codigo)}')">

                    <img
                        src="${foto}"
                        alt="${nombre}">


                    <div>

                        <strong>
                            ${nombre}
                        </strong>


                        <small>
                            ${precio}
                        </small>

                    </div>

                </div>

            `;

        }
    ).join("");


    resultadosBusqueda.style.display =
    "block";

}

   IR AL PRODUCTO
===================================================== */

function irAProducto(codigo){

    window.location.href =
    "producto.html?codigo=" +
    codigo;

}

===================================================== */

buscadorGlobal.addEventListener(

);

buscadorGlobal.addEventListener(

        if(event.key === "Enter"){

                );

        }

    }
);

document.getElementById(
    "btnBuscar"
).addEventListener(
    "click",
    function(){

        const texto =
        buscadorGlobal.value.trim();


        if(texto){

            window.location.href =
            "buscar.html?q=" +
            encodeURIComponent(
                texto
            );

        }

    }
);

        if(

                ".buscador-header"
            )
        ){

            resultadosBusqueda.style.display =
            "none";

        }

);

===================================================== */

const btnArriba =
document.getElementById(
    "btnArriba"
);


window.addEventListener(
    "scroll",
    function(){

        if(window.scrollY > 300){

            btnArriba.style.display =
            "block";

        }

        else{

            btnArriba.style.display =
            "none";

        }

    }
);


btnArriba.addEventListener(
    "click",
    function(){

        window.scrollTo({

            top:0,

            behavior:"smooth"

        });

    }
);
