<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto - Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

/* 🔥 BOTÓN VOLVER (PRO FLOTANTE) */
.volver-home{
position:fixed;
top:15px;
left:15px;
background:#333;
color:white;
padding:10px 14px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
z-index:9999;
box-shadow:0 2px 10px rgba(0,0,0,.2);
transition:0.2s;
}

.volver-home:hover{
transform:scale(1.05);
}

/* BOTÓN SUBIR */
#btnArriba{
position:fixed;
bottom:20px;
left:20px;
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
z-index:9999;
}

/* CONTENEDOR PRINCIPAL */
.contenedor{
max-width:1100px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
padding:20px;
}

/* GALERÍA */
.galeria{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.galeria img{
width:100%;
height:400px;
object-fit:contain;
border-radius:10px;
background:white;
}

/* MINIATURAS */
.miniaturas{
display:flex;
gap:10px;
margin-top:10px;
}

.miniaturas img{
width:80px;
height:80px;
object-fit:contain;
border-radius:8px;
cursor:pointer;
border:2px solid transparent;
}

.miniaturas img:hover{
border:2px solid #ff2a2a;
}

/* INFO */
.info{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.titulo{
font-size:24px;
font-weight:bold;
}

.precio{
font-size:28px;
color:#ff2a2a;
font-weight:bold;
margin:10px 0;
}

.precio-anterior{
text-decoration:line-through;
color:#888;
margin-left:10px;
font-size:16px;
}

.oferta{
display:inline-block;
background:red;
color:white;
padding:5px 10px;
border-radius:6px;
font-size:12px;
margin-bottom:10px;
}

.nuevo{
display:inline-block;
background:green;
color:white;
padding:5px 10px;
border-radius:6px;
font-size:12px;
margin-bottom:10px;
margin-left:5px;
}

.stock{
margin:10px 0;
font-weight:bold;
}

.descripcion{
margin-top:15px;
color:#555;
line-height:1.5;
}

/* BOTONES */
.btn{
display:block;
margin-top:15px;
padding:12px;
text-align:center;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

.btn-wpp{
background:#25D366;
color:white;
}

.btn-carrito{
background:#ff2a2a;
color:white;
}

@media(max-width:900px){
.contenedor{
grid-template-columns:1fr;
}
}

.btn-carrito-global{
position:fixed;
top:15px;
right:15px;
background:#ff2a2a;
color:white;
padding:12px 18px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
box-shadow:0 4px 12px rgba(0,0,0,.25);
z-index:9999;
transition:0.2s;
}

.btn-carrito-global:hover{
transform:scale(1.05);
}    
</style>
</head>

<body>
<a href="carrito.html" class="btn-carrito-global">🛒 Carrito</a>
    <span id="cartCount" style="
background:red;
color:white;
font-size:12px;
padding:3px 7px;
border-radius:50%;
margin-left:6px;
font-weight:bold;
">
0
</span>
<a class="volver-home" href="index.html">← Inicio</a>

<div id="btnArriba" onclick="irArriba()">⬆️</div>

<div class="contenedor">

<div class="galeria">
<img id="imgPrincipal" src="" alt="producto">

<div class="miniaturas">
<img id="img1" onclick="cambiar(this)">
<img id="img2" onclick="cambiar(this)">
<img id="img3" onclick="cambiar(this)">
</div>
</div>

<div class="info">

<div id="etiquetas"></div>

<div class="titulo" id="nombre"></div>

<div>
<span class="precio" id="precio"></span>
<span class="precio-anterior" id="precioAnt"></span>
</div>

<div class="stock" id="stock"></div>

<div class="descripcion" id="descripcion"></div>

<a id="wpp" class="btn btn-wpp" target="_blank">📲 WhatsApp</a>

<a href="#" class="btn btn-carrito" id="btnAddCart">🛒 Agregar al carrito</a>

</div>

</div>

<script>

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

const params = new URLSearchParams(window.location.search);
const codigo = params.get("codigo");

let productoActual = null;

fetch(url)
.then(res => res.json())
.then(data => {

productoActual = data.find(p => p.Código === codigo);

if(!productoActual){
document.body.innerHTML = "<h2 style='text-align:center'>Producto no encontrado</h2>";
return;
}

// IMÁGENES
const img1 = productoActual["Foto 1"];
const img2 = productoActual["Foto 2"];
const img3 = productoActual["Foto 3"];

document.getElementById("imgPrincipal").src = img1;
document.getElementById("img1").src = img1;
document.getElementById("img2").src = img2 || img1;
document.getElementById("img3").src = img3 || img1;

// INFO
document.getElementById("nombre").textContent = productoActual.Nombre;
document.getElementById("precio").textContent = "$" + productoActual.Precio;

if(productoActual["Precio Anterior"]){
document.getElementById("precioAnt").textContent = "$" + productoActual["Precio Anterior"];
}

// 🔥 FIX STOCK (DISPONIBLE / AGOTADO)
let stockTexto = (productoActual.Stock || "").toLowerCase();
document.getElementById("stock").textContent =
(stockTexto.includes("disponible") || stockTexto.includes("si") || stockTexto.includes("1"))
? "Disponible"
: "Agotado";

// DESCRIPCIÓN (solo si existe)
const descripcion = productoActual.Descripción || "";
const tamaño = productoActual.Tamaño || "";

// DESCRIPCIÓN (solo si existe)
if(descripcion && descripcion.trim() !== ""){
    document.getElementById("descripcion").textContent = descripcion;
} else {
    document.getElementById("descripcion").style.display = "none";
}

// TAMAÑO (solo si existe)
if(tamaño && tamaño.trim() !== ""){
    const div = document.createElement("div");
    div.className = "descripcion";
    div.textContent = "Tamaño: " + tamaño;
    document.querySelector(".info").appendChild(div);
}

// ETIQUETAS
let etiquetas = "";
if(productoActual.Oferta === "SI") etiquetas += `<span class="oferta">OFERTA</span>`;
if(productoActual.Nuevo === "SI") etiquetas += `<span class="nuevo">NUEVO</span>`;
document.getElementById("etiquetas").innerHTML = etiquetas;

// WHATSAPP
const link = window.location.href;

const mensaje =
`Hola, quiero información sobre:

${productoActual.Nombre}

Precio: $${productoActual.Precio}

Código: ${productoActual.Código}

Link:
${link}`;

document.getElementById("wpp").href =
`https://wa.me/593990924437?text=${encodeURIComponent(mensaje)}`;

});

// CAMBIAR IMAGEN
function cambiar(img){
document.getElementById("imgPrincipal").src = img.src;
}


// 🛒 CARRITO PRO NIVEL 2
// =====================

function getCart(){
    return JSON.parse(localStorage.getItem("carrito")) || [];
}

function saveCart(cart){
    localStorage.setItem("carrito", JSON.stringify(cart));
}

// agregar al carrito (PRO)
document.getElementById("btnAddCart").addEventListener("click", function(e){
    e.preventDefault();

    if(!productoActual){
        alert("Producto no cargado aún");
        return;
    }

    let cart = getCart();

    const codigo = productoActual.Código;

    // 🔥 verificar si ya existe
    let index = cart.findIndex(item => item.codigo === codigo);

    if(index !== -1){
        cart[index].cantidad += 1;
    } else {
        cart.push({
            codigo: codigo,
            nombre: productoActual.Nombre,
            precio: parseFloat(productoActual.Precio),
            imagen: productoActual["Foto 1"],
            cantidad: 1
        });
    }

    saveCart(cart);

    // feedback PRO
    const btn = document.getElementById("btnAddCart");
    btn.innerText = "✔ Agregado";
    btn.style.background = "#28a745";

    setTimeout(() => {
        btn.innerText = "🛒 Agregar al carrito";
        btn.style.background = "#ff2a2a";
    }, 1200);
});

// BOTÓN SUBIR
window.addEventListener("scroll", function(){
document.getElementById("btnArriba").style.display =
window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({ top: 0, behavior: "smooth" });
}
function actualizarCarritoUI() {
    let carrito = getCart();
    let total = carrito.reduce((sum, p) => sum + p.cantidad, 0);

    const el = document.getElementById("cartCount");
    if (el) el.textContent = total;
}
actualizarCarritoUI();
</script>

</body>
</html>
