<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados - Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
}

.volver{
display:block;
width:200px;
margin:10px auto 20px;
padding:10px;
text-align:center;
background:#333;
color:white;
text-decoration:none;
border-radius:8px;
}

/* BOTÓN SUBIR IZQUIERDA */
#btnArriba{
position:fixed;
bottom:20px;
left:20px;
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:22px;
box-shadow:0 6px 15px rgba(0,0,0,.3);
cursor:pointer;
z-index:9999;
}

/* GRID PRODUCTOS */
#resultados{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1200px;
margin:auto;
}

.producto{
background:white;
border-radius:10px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
text-align:center;
position:relative;
}

.producto img{
width:100%;
height:280px;
object-fit:contain;
}

.oferta{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
padding:5px 10px;
border-radius:6px;
font-weight:bold;
}

.tamano{
background:#eee;
padding:5px;
border-radius:6px;
display:inline-block;
margin:5px 0;
font-size:13px;
}

.descripcion{
font-size:13px;
color:#666;
margin:8px 0;
line-height:1.4;
}

.precio{
font-weight:bold;
color:green;
font-size:18px;
margin-top:5px;
}

/* WHATSAPP (igual que antes) */
.btn-wpp{
display:block;
margin-top:10px;
background:#25D366;
color:white;
text-align:center;
padding:10px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

</style>
</head>

<body>

<div id="btnArriba" onclick="irArriba()">⬆️</div>

<h1>Resultados de búsqueda</h1>

<a class="volver" href="index.html">← Volver al inicio</a>

<div id="resultados"></div>

<script>

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

const params = new URLSearchParams(window.location.search);
const texto = (params.get("q") || "").toLowerCase().trim();

fetch(url)
.then(res => res.json())
.then(data => {

const palabras = texto.split(" ").filter(p => p.length > 0);

const encontrados = data.filter(p => {

const nombre = (p.Nombre || "").toLowerCase();
const categoria = (p.Categoria || "").toLowerCase();
const descripcion = (p["Descripción"] || p["Descripcion"] || "").toLowerCase();

return palabras.some(word =>
nombre.includes(word) ||
categoria.includes(word) ||
descripcion.includes(word)
);

});

const contenedor = document.getElementById("resultados");

if(encontrados.length === 0){
contenedor.innerHTML = "<h2 style='text-align:center'>No se encontraron productos</h2>";
return;
}

contenedor.innerHTML = encontrados.map(p => {

const codigo = p.Código || p.Codigo || p.ID || "";
const nombre = p.Nombre || "Producto";

const foto =
p.Foto || p["Foto 1"] || p["Foto2"] || "https://via.placeholder.com/300";

const precio = p.Precio || "0";
const descripcion = p["Descripción"] || p["Descripcion"] || "";
const tamaño = p.Tamaño || "";

/* LINK PRODUCTO */
const link = `producto.html?codigo=${codigo}`;

/* WHATSAPP */
const mensaje = `🛍️ Producto:
${nombre}
💰 Precio: $${precio}
🔗 Ver producto: ${link}`;

return `
<div class="producto">

${p.Oferta && p.Oferta.toUpperCase() === "SI"
? `<div class="oferta">OFERTA</div>` : ""}

/* SOLO LA FOTO ES CLICKEABLE */
<a href="${link}">
    <img src="${foto}" alt="${nombre}">
</a>

<h3>${nombre}</h3>

${descripcion ? `<div class="descripcion">${descripcion}</div>` : ""}

${tamaño ? `<div class="tamano">Tamaño: ${tamaño}</div>` : ""}

<div class="precio">$${precio}</div>

<a class="btn-wpp"
target="_blank"
onclick="event.stopPropagation()"
href="https://wa.me/593990924437?text=${encodeURIComponent(mensaje)}">
📲 WhatsApp
</a>

</div>
`;

}).join("");

});

/* BOTÓN SUBIR */
window.addEventListener("scroll", function(){
const btn = document.getElementById("btnArriba");
btn.style.display = window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({ top: 0, behavior: "smooth" });
}

</script>

</body>
</html>
