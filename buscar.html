<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buscar productos - Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f6;
}

.logo{
width:100%;
display:block;
}

.barra{
padding:20px;
text-align:center;
background:white;
}

.barra input{
width:90%;
max-width:600px;
padding:15px;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
}


.titulo{
text-align:center;
font-size:28px;
margin:25px 0;
color:#d63384;
}


.contenedor{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}


.producto{

background:white;
border-radius:15px;
padding:15px;
text-align:center;
box-shadow:0 3px 12px rgba(0,0,0,.15);

}
/* ETIQUETAS OFERTA Y NUEVO */

.imagen-producto{
position:relative;
}

.etiqueta{
position:absolute;
left:10px;
padding:5px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
color:white;
z-index:10;
box-shadow:0 2px 6px rgba(0,0,0,.2);
}

.etiqueta.oferta{
top:10px;
background:#ff2a2a;
}

.etiqueta.nuevo{
top:45px;
background:#2ecc71;
}

.producto img{

width:100%;
height:200px;
object-fit:contain;
border-radius:10px;
cursor:pointer;

}


.producto h3{

font-size:17px;
margin:10px 0;
cursor:pointer;

}


.precio{

font-size:20px;
font-weight:bold;
color:#e60000;

}


.descripcion{

font-size:13px;
color:#666;
margin-top:8px;

}


.tamano{

font-size:13px;
color:#777;
margin-top:5px;

}


.sin-resultados{

text-align:center;
background:white;
padding:30px;
margin:20px;
border-radius:15px;
font-size:18px;

}



.btn-carrito-global{

position:fixed;
top:15px;
right:15px;
background:#ff2a2a;
color:white;
padding:12px 18px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
z-index:9999;

}


#cartCount{

background:white;
color:red;
padding:3px 7px;
border-radius:50%;
margin-left:5px;

}



/* MISMO BOTON WHATSAPP QUE CATEGORIA */

.btn{

display:block;
margin-top:10px;
background:#25D366;
color:white;
text-align:center;
padding:10px;
border-radius:8px;
text-decoration:none;
font-weight:bold;

}

.volver-home{
position:fixed;
top:15px;
left:15px;
background:#333;
color:white;
padding:10px 14px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
z-index:9999;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}
</style>

</head>


<body>

 <a class="volver-home" href="index.html">← Inicio</a> 

<a href="carrito.html" class="btn-carrito-global">
🛒 Carrito <span id="cartCount">0</span>
</a>


<img src="logo-megatodo.jpg" class="logo">



<div class="barra">

<input 
type="text" 
id="buscar"
placeholder="Buscar productos..."
>

</div>



<h2 class="titulo" id="tituloBusqueda">
Resultados de búsqueda
</h2>


<div id="productos" class="contenedor"></div>




<script>


const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";


let productos=[];



function normalizar(texto){

return (texto || "")
.toString()
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");

}



fetch(url)

.then(res=>res.json())

.then(data=>{

productos=data || [];

mostrarResultados();

});




function mostrarResultados(){


const params=new URLSearchParams(window.location.search);


let busqueda=params.get("q") || "";


document.getElementById("buscar").value=busqueda;


busqueda=normalizar(busqueda);



const contenedor=document.getElementById("productos");



if(!busqueda){

contenedor.innerHTML=`

<div class="sin-resultados">
Escribe un producto para buscar
</div>

`;

return;

}



const encontrados=productos.filter(p=>{


return(

normalizar(p.Nombre).includes(busqueda)

||

normalizar(p.Código).includes(busqueda)

||

normalizar(p.Codigo).includes(busqueda)

||

normalizar(p.Categoria).includes(busqueda)

||

normalizar(p["Descripción"]).includes(busqueda)

);


});




document.getElementById("tituloBusqueda").innerHTML=
"Resultados para: "+busqueda;




if(encontrados.length===0){

contenedor.innerHTML=`

<div class="sin-resultados">
No encontramos productos con esa búsqueda
</div>

`;

return;

}





contenedor.innerHTML=encontrados.map(p=>{


let foto=
p["Foto 1"] ||
p["Foto 2"] ||
p["Foto 3"] ||
"https://via.placeholder.com/300";



let descripcion="";

if(p["Descripción"] && p["Descripción"].trim()!=""){

descripcion=`

<p class="descripcion">
${p["Descripción"]}
</p>

`;

}



let tamano="";

if(p["Tamaño"] && p["Tamaño"].trim()!=""){

tamano=`

<p class="tamano">
📏 ${p["Tamaño"]}
</p>

`;

}



let precio="";

if(p.Precio && p.Precio.trim()!=""){

precio=`

<p class="precio">
$${p.Precio}
</p>

`;

}

const oferta=(p.Oferta || "").toString().trim().toUpperCase()==="SI";
const nuevo=(p.Nuevo || "").toString().trim().toUpperCase()==="SI";

let etiquetas="";

if(oferta){
etiquetas+=`<div class="etiqueta oferta">OFERTA</div>`;
}

if(nuevo){
etiquetas+=`<div class="etiqueta nuevo">NUEVO</div>`;
}

let codigo=p.Código || p.Codigo || "";



let mensaje=encodeURIComponent(

"Hola Megatodo, deseo consultar este producto:\n\n"+

"Producto: "+(p.Nombre || "")+

"\nCódigo: "+codigo+

"\nPrecio: $"+(p.Precio || "")+

"\n\nGracias."

);





return `


<div class="producto">


<a href="producto.html?codigo=${encodeURIComponent(codigo)}">

<img src="${foto}">

<h3>${p.Nombre || ""}</h3>

</a>

<div class="imagen-producto">

${etiquetas}

<a href="producto.html?codigo=${encodeURIComponent(codigo)}">

<img src="${foto}">

</a>

</div>

<a href="producto.html?codigo=${encodeURIComponent(codigo)}">

<h3>${p.Nombre || ""}</h3>

</a>

${precio}


${tamano}


${descripcion}




<a 
class="btn"
href="https://wa.me/593990924437?text=${mensaje}"
target="_blank">

📲 WhatsApp

</a>



</div>


`;



}).join("");



}





document.getElementById("buscar").addEventListener("keypress",function(e){


if(e.key==="Enter"){


let texto=this.value.trim();


if(texto){


window.location.href=
"buscar.html?q="+encodeURIComponent(texto);


}


}


});





document.getElementById("buscar").addEventListener("input",function(){


if(this.value.trim()==""){


window.history.pushState(
"",
"",
"buscar.html"
);


mostrarResultados();


}


});





function getCart(){

return JSON.parse(localStorage.getItem("carrito")) || [];

}



function actualizarCarritoUI(){

let carrito=getCart();


let cantidad=carrito.reduce(

(sum,p)=>sum+(p.cantidad || 0),

0

);


document.getElementById("cartCount").textContent=cantidad;


}


actualizarCarritoUI();



</script>


</body>

</html>
```
