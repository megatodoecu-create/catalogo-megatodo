<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados - Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
}

#resultados{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1200px;
margin:auto;
}

.producto{
background:white;
border-radius:10px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
text-align:center;
position:relative;
}

.producto img{
width:100%;
height:280px;
object-fit:contain;
border-radius:10px;
background:white;
}

.producto h3{
margin:10px 0;
font-size:16px;
}

.descripcion{
font-size:13px;
color:#666;
margin:8px 0;
line-height:1.4;
}

.tamano{
display:inline-block;
background:#eee;
padding:5px 10px;
border-radius:5px;
margin-bottom:10px;
font-size:13px;
font-weight:bold;
}

.precio{
font-weight:bold;
color:green;
font-size:18px;
margin-top:10px;
}

.oferta{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
font-weight:bold;
padding:5px 10px;
border-radius:5px;
font-size:12px;
}

.btn-wsp{
display:block;
margin-top:12px;
background:#25D366;
color:white;
text-decoration:none;
padding:10px;
border-radius:8px;
font-weight:bold;
}

/* BOTÓN SUBIR */
#btnArriba{
position:fixed;
bottom:20px;
left:20px;
right:auto; /* 👈 IMPORTANTE: anula la derecha */
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:20px;
box-shadow:0 6px 15px rgba(0,0,0,.3);
cursor:pointer;
z-index:9999;
transition:all .3s ease;
}

</style>
</head>

<body>

<div id="btnArriba" onclick="irArriba()">⬆️</div>

<h1>Resultados de búsqueda</h1>

<a href="index.html">← Volver</a>

<div id="resultados"></div>

<script>

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

const params = new URLSearchParams(window.location.search);
const texto = (params.get("q") || "").toLowerCase();

fetch(url)
.then(r => r.json())
.then(data => {

const encontrados = data.filter(p =>
(p.Nombre || "").toLowerCase().includes(texto)
);

const contenedor = document.getElementById("resultados");

if(encontrados.length === 0){
contenedor.innerHTML = "<h2>No se encontraron productos</h2>";
return;
}

contenedor.innerHTML = encontrados.map(p => {

const nombre = p.Nombre || "Sin nombre";
const precio = p.Precio || "";
const foto = p.Foto || "https://via.placeholder.com/300";
const tamano = p.Tamaño || "";
const desc = p.Descripción || "";

const mensaje = `
Hola 👋 quiero este producto:
Nombre: ${nombre}
Precio: $${precio}
${tamano ? "Tamaño: " + tamano : ""}
`;

const wsp = `https://wa.me/593990924437?text=${encodeURIComponent(mensaje)}`;

return `
<div class="producto">

${p.Oferta && p.Oferta.toLowerCase() === "si"
? `<div class="oferta">OFERTA</div>` : ""}

<img src="${foto}" alt="${nombre}">

<h3>${nombre}</h3>

${desc ? `<div class="descripcion">${desc}</div>` : ""}

${tamano ? `<div class="tamano">${tamano}</div>` : ""}

<div class="precio">$${precio}</div>

<a class="btn-wsp" href="${wsp}" target="_blank">
💬 WhatsApp
</a>

</div>
`;

}).join("");

});

// BOTÓN SUBIR
window.addEventListener("scroll", () => {
const btn = document.getElementById("btnArriba");
if(!btn) return;
btn.style.display = window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({ top: 0, behavior: "smooth" });
}

</script>

</body>
</html>
