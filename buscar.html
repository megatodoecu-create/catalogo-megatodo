<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados - Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
}

#resultados{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1200px;
margin:auto;
}

.producto{
position:relative;
background:white;
border-radius:10px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
text-align:center;
}

.producto img{
width:100%;
height:300px;
object-fit:contain;
border-radius:10px;
background:white;
}

.producto h3{
margin:10px 0;
}

.descripcion{
font-size:13px;
color:#666;
margin:8px 0;
line-height:1.4;
}

.producto p{
font-weight:bold;
color:green;
}

.oferta{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
font-weight:bold;
padding:5px 10px;
border-radius:5px;
font-size:14px;
z-index:10;
}

.tamano{
display:inline-block;
background:#eee;
padding:5px 10px;
border-radius:5px;
margin-bottom:10px;
font-size:14px;
font-weight:bold;
}

.volver{
display:block;
width:200px;
margin:20px auto;
padding:12px;
background:#333;
color:white;
text-align:center;
text-decoration:none;
border-radius:8px;
}

/* BOTÓN SUBIR */
#btnArriba{
position:fixed;
bottom:20px;
right:20px;
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:22px;
box-shadow:0 4px 10px rgba(0,0,0,.3);
cursor:pointer;
z-index:9999;
}

@media (max-width:600px){
#btnArriba{
width:60px;
height:60px;
font-size:24px;
}
}

</style>
</head>

<body>

<div id="btnArriba" onclick="irArriba()">⬆️</div>

<h1>Resultados de búsqueda</h1>

<a href="index.html" class="volver">← Volver al inicio</a>

<div id="resultados"></div>

<script>

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

const params = new URLSearchParams(window.location.search);
const texto = (params.get("q") || "").toLowerCase();

fetch(url)
.then(res => res.json())
.then(productos => {

const encontrados = productos.filter(p =>
p.Nombre && p.Nombre.toLowerCase().includes(texto)
);

const contenedor = document.getElementById("resultados");

if(encontrados.length === 0){
contenedor.innerHTML = "<h2 style='text-align:center;'>No se encontraron productos.</h2>";
return;
}

contenedor.innerHTML = encontrados.map(p => `
<div class="producto">

${p.Oferta && p.Oferta.toLowerCase() === "si"
? '<div class="oferta">OFERTA</div>'
: ''}

<img src="${p.Foto}" alt="${p.Nombre}">

<h3>${p.Nombre}</h3>

${p.Descripción ? `<div class="descripcion">${p.Descripción}</div>` : ""}

${p.Tamaño ? `<div class="tamano">${p.Tamaño}</div>` : ""}

<p>$${p.Precio}</p>

</div>
`).join("");

})
.catch(() => {
document.getElementById("resultados").innerHTML =
"<h2 style='text-align:center;'>Error cargando productos.</h2>";
});

// BOTÓN SUBIR
window.addEventListener("scroll", function(){
const btn = document.getElementById("btnArriba");
if(!btn) return;

btn.style.display = window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({
top: 0,
behavior: "smooth"
});
}

</script>

</body>
</html>
