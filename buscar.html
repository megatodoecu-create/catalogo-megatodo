<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar - Megatodo</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:20px;
}

/* TITULO */
h1{
text-align:center;
}

/* GRID */
#resultados{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1200px;
margin:auto;
}

/* CARD */
.producto{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.15);
position:relative;
}

.producto img{
width:100%;
height:280px;
object-fit:contain;
background:white;
}

/* INFO */
.info{
padding:15px;
}

.nombre{
font-size:18px;
font-weight:bold;
}

.descripcion{
font-size:13px;
color:#666;
margin:6px 0;
line-height:1.4;
}

.tamano{
font-size:13px;
color:#777;
margin:5px 0;
}

.precio{
font-size:22px;
color:#2e7d32;
font-weight:bold;
margin-top:8px;
}

/* OFERTA */
.oferta{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
padding:6px 10px;
border-radius:6px;
font-size:12px;
font-weight:bold;
}

/* BOTON WHATSAPP */
.btn{
display:block;
margin-top:10px;
background:#25D366;
color:white;
text-align:center;
padding:10px;
border-radius:8px;
text-decoration:none;
}

/* BOTÓN SUBIR */
#btnArriba{
position:fixed;
bottom:20px;
left:20px;
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.3);
z-index:9999;
}

</style>
</head>

<body>

<div id="btnArriba" onclick="irArriba()">
<i class="fa-solid fa-arrow-up"></i>
</div>

<h1>Resultados de búsqueda</h1>

<a href="index.html" style="display:block;text-align:center;margin-bottom:20px;color:#ff2a2a;font-weight:bold;">
← Volver al inicio
</a>

<div id="resultados"></div>

<script>

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

const params = new URLSearchParams(window.location.search);
const texto = (params.get("q") || "").toLowerCase();

fetch(url)
.then(res => res.json())
.then(data => {

const encontrados = data.filter(p =>
p.Nombre && p.Nombre.toLowerCase().includes(texto)
);

const contenedor = document.getElementById("resultados");

if(encontrados.length === 0){
contenedor.innerHTML = "<h3 style='text-align:center;'>No se encontraron productos</h3>";
return;
}

contenedor.innerHTML = encontrados.map(p => {

const descripcion = p.Descripción ? `<div class="descripcion">${p.Descripción}</div>` : "";
const tamaño = p.Tamaño ? `<div class="tamano">Tamaño: ${p.Tamaño}</div>` : "";

return `
<div class="producto">

${p.Oferta === "SI" ? `<div class="oferta">OFERTA</div>` : ""}

<img src="${p.Foto}" alt="${p.Nombre}">

<div class="info">

<div class="nombre">${p.Nombre}</div>

${descripcion}
${tamaño}

<div class="precio">$${p.Precio}</div>

<a class="btn"
target="_blank"
href="https://wa.me/593990924437?text=Hola,%20quiero%20el%20producto:%20${encodeURIComponent(p.Nombre)}%20-%20Precio:%20$${p.Precio}">
💬 WhatsApp
</a>

</div>
</div>
`;
}).join("");

});

// BOTÓN SUBIR
window.addEventListener("scroll", () => {
const btn = document.getElementById("btnArriba");
btn.style.display = window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({ top: 0, behavior: "smooth" });
}

</script>

</body>
</html>
