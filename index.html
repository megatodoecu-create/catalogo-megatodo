
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Megatodo</title>

<style>
body{
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

/* Header */
header{
    background: #ff4d6d;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

/* Categorías */
.categorias{
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding: 10px;
    background: white;
}

.categoria{
    flex: 0 0 auto;
    background: #eee;
    padding: 10px 15px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

.categoria.activa{
    background: #ff4d6d;
    color: white;
}

/* Productos */
#productos{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 10px;
}

.producto{
    background: white;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
}

.producto img{
    width: 100%;
    border-radius: 10px;
}

.precio{
    font-weight: bold;
    color: #ff4d6d;
}
</style>
</head>

<body>

<header>MEGATODO</header>

<!-- CATEGORÍAS -->
<div class="categorias" id="categorias"></div>

<!-- PRODUCTOS -->
<div id="productos"></div>

<script>

let productos = [];
let categoriaSeleccionada = "TODOS";

// Cargar CSV
fetch("productos.csv")
.then(res => res.text())
.then(data => {
    const filas = data.trim().split("\n").slice(1);

    productos = filas.map(fila => {
        const [nombre, categoria, foto, tamaño, precio] = fila.split(";");
        return {nombre, categoria, foto, tamaño, precio};
    });

    crearCategorias();
    mostrar(productos);
});

// Crear categorías automáticas
function crearCategorias(){
    const cont = document.getElementById("categorias");

    const categoriasUnicas = ["TODOS", ...new Set(productos.map(p => p.categoria))];

    categoriasUnicas.forEach(cat => {
        const div = document.createElement("div");
        div.className = "categoria";
        div.innerText = cat;

        if(cat === "TODOS") div.classList.add("activa");

        div.onclick = () => filtrar(cat, div);

        cont.appendChild(div);
    });
}

// Filtrar productos
function filtrar(cat, elemento){
    categoriaSeleccionada = cat;

    document.querySelectorAll(".categoria").forEach(c => c.classList.remove("activa"));
    elemento.classList.add("activa");

    if(cat === "TODOS"){
        mostrar(productos);
    }else{
        mostrar(productos.filter(p => p.categoria === cat));
    }
}

// Mostrar productos
function mostrar(lista){
    const cont = document.getElementById("productos");
    cont.innerHTML = "";

    lista.forEach(p => {
        cont.innerHTML += `
        <div class="producto">
            <img src="${p.foto}">
            <h4>${p.nombre}</h4>
            <div>${p.tamaño}</div>
            <div class="precio">${p.precio}</div>
        </div>
        `;
    });
}

</script>

</body>
</html>
