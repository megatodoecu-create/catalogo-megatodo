<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.logo{
width:100%;
display:block;
}

.buscador{
padding:20px;
text-align:center;
}

.buscador input{
width:90%;
max-width:600px;
padding:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

#resultadosBusqueda{
max-width:600px;
margin:10px auto;
background:white;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
overflow:hidden;
}

.resultado{
padding:12px;
border-bottom:1px solid #eee;
}

.resultado a{
text-decoration:none;
color:#333;
font-weight:bold;
display:block;
}

.categorias{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.categoria{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
text-decoration:none;
color:#333;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.nuevos{
padding:25px;
margin:20px;
background:linear-gradient(135deg,#ffe4ec,#fff0f5);
border-radius:20px;
}

.nuevos h2{
text-align:center;
font-size:28px;
color:#d63384;
}

.productos-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
}

.producto-nuevo{
background:white;
border-radius:15px;
padding:15px;
text-align:center;
text-decoration:none;
color:#000;
box-shadow:0 4px 15px rgba(214,51,132,.15);
display:block;
transition:0.2s;
}

.producto-nuevo:hover{
transform:scale(1.03);
}

.producto-nuevo img{
width:100%;
height:180px;
object-fit:contain;
background:white;
border-radius:10px;
}

.descripcion{
font-size:13px;
color:#666;
margin:6px 0;
}

.tamano{
font-size:13px;
color:#777;
margin:5px 0;
}

.horario{
max-width:700px;
margin:30px auto;
padding:20px;
background:white;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.horario h2{
text-align:center;
margin-top:0;
margin-bottom:20px;
color:#ff2a2a;
}

.fila{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 0;
border-bottom:1px solid #eee;
font-size:16px;
}

.fila:last-child{
border-bottom:none;
}

.fila strong{
color:#ff2a2a;
}

.titulo-categorias{
text-align:center;
margin:30px auto 15px;
font-size:26px;
font-weight:bold;
color:white;
background: linear-gradient(135deg, #ff2a8a, #ff5fb0);
padding:18px 20px;
border-radius:15px;
max-width:600px;
box-shadow:0 6px 18px rgba(255,42,138,0.35);
letter-spacing:1px;
opacity:0;
transform: translateY(10px);
animation: aparecerBanner 0.8s ease forwards;
}

@keyframes aparecerBanner{
from{opacity:0;transform: translateY(15px);}
to{opacity:1;transform: translateY(0);}
}

.btn-carrito-global{
position:fixed;
top:15px;
right:15px;
background:#ff2a2a;
color:white;
padding:12px 18px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
box-shadow:0 4px 12px rgba(0,0,0,.25);
z-index:9999;
transition:0.2s;
}

.btn-carrito-global:hover{
transform:scale(1.05);
}

#btnArriba{
position:fixed;
bottom:20px;
left:20px;
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
z-index:9999;
}

.btn-wpp-flotante{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:#25D366;
color:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
text-decoration:none;
box-shadow:0 4px 12px rgba(0,0,0,.3);
z-index:9999;
transition:0.2s;
}

.btn-wpp-flotante:hover{
transform:scale(1.1);
}

#cartCount{
background:red;
color:white;
font-size:12px;
padding:3px 7px;
border-radius:50%;
margin-left:6px;
font-weight:bold;
}

</style>

</head>

<body>

<a href="https://wa.me/593990924437" target="_blank" class="btn-wpp-flotante">💬</a>

<a href="carrito.html" class="btn-carrito-global">
🛒 Carrito <span id="cartCount">0</span>
</a>

<div id="btnArriba" onclick="irArriba()">⬆️</div>

<img src="logo-megatodo.jpg" class="logo">

<div class="buscador">
<input type="text" id="buscadorGlobal" placeholder="Buscar productos...">
<div id="resultadosBusqueda"></div>
</div>

<div class="nuevos">
<h2>NUEVOS INGRESOS</h2>
<div id="productosNuevos" class="productos-grid"></div>
</div>

<h2 class="titulo-categorias">ELIGE UNA CATEGORÍA</h2>

<div class="categorias">
<a class="categoria" href="categoria.html?cat=Artículos%20de%20Belleza">✨ Artículos de Belleza</a>
<a class="categoria" href="categoria.html?cat=Juguetes">🧸 Juguetes</a>
<a class="categoria" href="categoria.html?cat=Bazar">🏠 Bazar</a>
<a class="categoria" href="categoria.html?cat=Peluches">🐻 Peluches</a>
<a class="categoria" href="categoria.html?cat=Cajas%20de%20Regalo">🎁 Cajas de Regalos</a>
<a class="categoria" href="categoria.html?cat=Coches%20de%20Bebé">👶Juguetes para Bebé</a>
</div>

<div class="horario">
<h2>🕒 Horario de atención</h2>

<div class="fila">
<span>Lunes a Sábado</span>
<strong>8:30 a 19:30</strong>
</div>

<div class="fila">
<span>Domingo</span>
<strong>9:30 a 18:30</strong>
</div>

</div>

<script>

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

let productos = [];

function normalizar(texto){
return (texto || "")
.toString()
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g, "");
}

fetch(url)
.then(res => res.json())
.then(data => {

productos = data || [];

const nuevos = productos.filter(p => (p.Nuevo || "").toUpperCase() === "SI");

document.getElementById("productosNuevos").innerHTML =
nuevos.slice(0,8).map(p => {

const foto =
p["Foto 1"] ||
p["Foto 2"] ||
p["Foto 3"] ||
"https://via.placeholder.com/300";

return `
<a href="producto.html?codigo=${p.Código || ''}" class="producto-nuevo">
<img src="${foto}">
<h3>${p.Nombre || ""}</h3>
<p><b>$${p.Precio || ""}</b></p>
</a>
`;
}).join("");
});

/* BUSCADOR CORREGIDO */
document.getElementById("buscadorGlobal").addEventListener("input", function(){

const texto = normalizar(this.value);
const resultados = document.getElementById("resultadosBusqueda");

if(!texto){
resultados.innerHTML = "";
return;
}

const filtrados = productos.filter(p => {
return normalizar(p.Nombre).includes(texto) ||
normalizar(p.Codigo).includes(texto) ||
normalizar(p.Categoria).includes(texto) ||
normalizar(p["Descripción"]).includes(texto);
});

resultados.innerHTML = filtrados.slice(0,10).map(p => `
<div class="resultado">
<a href="producto.html?codigo=${p.Código}">
${p.Nombre}
</a>
</div>
`).join("");
});

/* ENTER BUSCAR */
document.getElementById("buscadorGlobal").addEventListener("keypress", function(e){
if(e.key === "Enter"){
const texto = this.value.trim();
if(texto){
window.location.href = "buscar.html?q=" + encodeURIComponent(texto);
}
}
});

/* BOTÓN SUBIR */
window.addEventListener("scroll", () => {
document.getElementById("btnArriba").style.display =
window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({ top: 0, behavior: "smooth" });
}

/* CARRITO GLOBAL */
function getCart(){
return JSON.parse(localStorage.getItem("carrito")) || [];
}

function actualizarCarritoUI(){
let carrito = getCart();
let total = carrito.reduce((sum, p) => sum + p.cantidad, 0);
document.getElementById("cartCount").textContent = total;
}

actualizarCarritoUI();

</script>

</body>
</html>
