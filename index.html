<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megatodo</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#f5f5f5;
}

/* HEADER ROSADO */
header{
  background:#ff4d6d;
  color:white;
  text-align:center;
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

/* CATEGORÍAS */
#categorias{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:10px;
  background:white;
}

.categoria{
  padding:6px 10px;
  background:#eee;
  border-radius:15px;
  font-size:13px;
  cursor:pointer;
}

.categoria:hover{
  background:#ff4d6d;
  color:white;
}

/* PRODUCTOS */
#productos{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:10px;
  padding:10px;
}

/* CARD SIMPLE */
.card{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.info{
  padding:8px;
}

.nombre{
  font-size:13px;
}

.precio{
  color:#ff4d6d;
  font-weight:bold;
  margin-top:5px;
}

.tamaño{
  font-size:12px;
  color:#666;
}
</style>
</head>

<body>

<header>Megatodo</header>

<div id="categorias"></div>
<div id="productos"></div>

<script>

const csvURL = "https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/Productos.csv";

let productos = [];
let categoriaActual = "Todos";

fetch(csvURL)
.then(r => r.text())
.then(data => {

  const filas = data.trim().split("\n").slice(1);

  productos = filas.map(f => {
    const [nombre,categoria,foto,tamaño,precio] = f.split(";");

    return {
      nombre,
      categoria,
      foto: "Peluches/" + foto,
      tamaño,
      precio
    };
  });

  crearCategorias();
  mostrar(productos);
});

/* CATEGORÍAS */
function crearCategorias(){
  const cont = document.getElementById("categorias");

  const cats = ["Todos", ...new Set(productos.map(p => p.categoria))];

  cats.forEach(c=>{
    const div = document.createElement("div");
    div.className = "categoria";
    div.textContent = c;

    div.onclick = () => {
      categoriaActual = c;
      filtrar();
    };

    cont.appendChild(div);
  });
}

/* FILTRO */
function filtrar(){
  if(categoriaActual === "Todos"){
    mostrar(productos);
  } else {
    mostrar(productos.filter(p => p.categoria === categoriaActual));
  }
}

/* MOSTRAR */
function mostrar(lista){
  const cont = document.getElementById("productos");
  cont.innerHTML = "";

  lista.forEach(p=>{
    cont.innerHTML += `
      <div class="card">
        <img src="${p.foto}">
        <div class="info">
          <div class="nombre">${p.nombre}</div>
          <div class="precio">${p.precio}</div>
          <div class="tamaño">${p.tamaño}</div>
        </div>
      </div>
    `;
  });
}

</script>

</body>
</html>
