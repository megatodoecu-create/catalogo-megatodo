<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.logo{
width:100%;
display:block;
}

.buscador{
padding:20px;
text-align:center;
}

.buscador input{
width:90%;
max-width:600px;
padding:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

#resultadosBusqueda{
max-width:600px;
margin:10px auto;
text-align:left;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.resultado{
padding:12px;
border-bottom:1px solid #eee;
}

.resultado a{
text-decoration:none;
color:#333;
font-weight:bold;
display:block;
}

.resultado:last-child{
border-bottom:none;
}

.categorias{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.categoria{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
text-decoration:none;
color:#333;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.horarios{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
}

.whatsapp{
position:fixed;
right:20px;
bottom:20px;
background:#25D366;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
text-decoration:none;
}   

.nuevos{
padding:25px;
background:linear-gradient(135deg,#ffe4ec,#fff0f5);
border-radius:20px;
margin:20px;
}

.nuevos h2{
text-align:center;
font-size:28px;
color:#d63384;
margin-bottom:20px;
}

.productos-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
}

.producto-nuevo{
background:white;
border-radius:15px;
padding:15px;
text-align:center;
box-shadow:0 4px 15px rgba(214,51,132,.15);
transition:transform .3s ease, box-shadow .3s ease;
}

.producto-nuevo:hover{
transform:translateY(-5px);
box-shadow:0 8px 20px rgba(214,51,132,.25);
}

.producto-nuevo img{
width:100%;
height:180px;
object-fit:contain;
background:white;
border-radius:10px;
margin-bottom:10px;
}

.producto-nuevo h3{
font-size:15px;
color:#444;
margin:10px 0;
min-height:40px;
}

.producto-nuevo p{
margin:5px 0;
}

.etiqueta-nuevo{
background:linear-gradient(45deg,#ff4d94,#ff80bf);
color:white;
padding:6px 12px;
border-radius:25px;
font-size:12px;
font-weight:bold;
display:inline-block;
margin-bottom:10px;
}

.producto-nuevo p:last-child{
font-size:20px;
font-weight:bold;
color:#d63384;
} 
</style>

</head>

<body>

<img src="logo-megatodo.jpg" class="logo">

<div class="buscador">

<input
type="text"
id="buscadorGlobal"
placeholder="Buscar productos...">

<div id="resultadosBusqueda"></div>

</div>
<div class="nuevos">
<h2>NUEVOS INGRESOS</h2>
<div id="productosNuevos" class="productos-grid"></div>
</div>
<div class="categorias">

<a class="categoria" href="categoria.html?cat=Artículos%20de%20Belleza">
✨ Artículos de Belleza
</a>

<a class="categoria" href="categoria.html?cat=Juguetes">
🧸 Juguetes
</a>

<a class="categoria" href="categoria.html?cat=Bazar">
🏠 Bazar
</a>

<a class="categoria" href="categoria.html?cat=Peluches">
🐻 Peluches
</a>

<a class="categoria" href="categoria.html?cat=Cosméticos">
💄 Cosméticos
</a>

<a class="categoria" href="categoria.html?cat=Cajas%20de%20Regalo">
🎁 Cajas de Regalo
</a>

<a class="categoria" href="categoria.html?cat=Coches%20de%20Bebé">
👶 Coches de Bebé
</a>

</div>

<div class="horarios">
<h2>Horarios de Atención</h2>
<p>Lunes a Sábado: 8:30 am - 7:30 pm</p>
<p>Domingo: 9:30 am - 6:30 pm</p>
</div>

<a
href="https://wa.me/593990924437"
class="whatsapp"
target="_blank">
💬
</a>

<script>

const url =
"https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

let productos = [];

fetch(url)
.then(response => response.json())
.then(data => {

    productos = data;
const nuevos = productos.filter(
producto =>
producto.Nuevo &&
producto.Nuevo.toUpperCase() === "SI"
);

document.getElementById("productosNuevos").innerHTML =
nuevos.slice(0,8).map(producto => `
<div class="producto-nuevo">

<div class="etiqueta-nuevo">
NUEVO
</div>

<img src="${producto.Foto}" alt="${producto.Nombre}">

<h3>${producto.Nombre}</h3>

<p>Tamaño: ${producto.Tamaño}</p>

<p>$${producto.Precio}</p>

</div>
`).join("");
    // Mostrar sugerencias mientras escribe
    document
    .getElementById("buscadorGlobal")
    .addEventListener("input", function(){

        const texto = this.value.toLowerCase();

        const resultados =
        document.getElementById("resultadosBusqueda");

        if(texto.length < 2){
            resultados.innerHTML = "";
            return;
        }

        const encontrados =
        productos.filter(producto =>
            producto.Nombre &&
            producto.Nombre.toLowerCase().includes(texto)
        );

        if(encontrados.length === 0){

            resultados.innerHTML =
            '<div class="resultado">No se encontraron productos.</div>';

            return;
        }

        resultados.innerHTML =
        encontrados
        .slice(0,10)
        .map(producto => `
        <div class="resultado">
            <a href="buscar.html?q=${encodeURIComponent(producto.Nombre)}">
                ${producto.Nombre}
            </a>
        </div>
        `)
        .join("");

    });

    // Buscar al presionar Enter
    document
    .getElementById("buscadorGlobal")
    .addEventListener("keydown", function(e){

        if(e.key === "Enter"){

            const texto = this.value.trim();

            if(texto.length > 0){

                window.location.href =
                `buscar.html?q=${encodeURIComponent(texto)}`;

            }

        }

    });

})
.catch(error => {
    console.error("Error cargando productos:", error);
});

</script>

</body>
</html>
