<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Megatodo</title>
<style>
body{
font-family:Arial;
padding:20px;
background:#fff0f5;
}

h1{
text-align:center;
color:#d63384;
}

#buscador{
width:100%;
padding:10px;
font-size:16px;
margin-bottom:20px;
border:2px solid #ffb6c1;
border-radius:10px;
}

.productos{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:20px;
}

.producto{
background:white;
border:2px solid #ffc0cb;
padding:10px;
border-radius:15px;
box-shadow:0 2px 8px rgba(255,192,203,0.4);
}

.producto img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
}

.producto h3{
color:#d63384;
}

.producto p{
color:#555;
}
</style>
</head>
<a href="https://wa.me/0990924437" class="whatsapp" target="_blank">
💬
</a>

<style>
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50%;
text-decoration:none;
font-size:30px;
}
</style>
  <body>

<h1>🌸 Catálogo Megatodo 🌸</h1>

<input type="text" id="buscador" placeholder="Buscar productos...">

<div class="productos" id="productos"></div>

<script>
const productos = [];

const contenedor = document.getElementById(“productos”);

function mostrar(lista){
contenedor.innerHTML=””;

lista.forEach(p=>{

let tamanosHtml = “”;

if(p.tamanos){
tamanosHtml = p.tamanos
.split(”;”)
.map(t => <p>${t.trim()}</p>)
.join(””);
}

contenedor.innerHTML += `

<div class="producto">
<img src="${p.foto}">
<h3>${p.nombre}</h3>
<p>Categoría: ${p.categoria}</p>
${tamanosHtml}
</div>
`;
});

}

fetch(“Productos.csv”)
.then(response => response.text())
.then(data => {

const filas = data.split(”\n”).slice(1);

filas.forEach(fila => {

if(!fila.trim()) return;

const columnas = fila.split(”,”);

productos.push({
nombre: columnas[0]?.trim(),
categoria: columnas[1]?.trim(),
foto: “Peluches/” + columnas[2]?.trim(),
tamanos: columnas[3]?.trim()
});

});

mostrar(productos);

});

document.getElementById(“buscador”).addEventListener(“input”,e=>{
const texto=e.target.value.toLowerCase();

mostrar(productos.filter(p=>
p.nombre.toLowerCase().includes(texto)
));

});
</script>

</body>
</html>
