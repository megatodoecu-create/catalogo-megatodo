<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.logo{
width:100%;
display:block;
}

.buscador{
padding:20px;
text-align:center;
}

.buscador input{
width:90%;
max-width:600px;
padding:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

#resultadosBusqueda{
max-width:600px;
margin:10px auto;
text-align:left;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.resultado{
padding:12px;
border-bottom:1px solid #eee;
}

.resultado a{
text-decoration:none;
color:#333;
font-weight:bold;
display:block;
}

.resultado:last-child{
border-bottom:none;
}

.categorias{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.categoria{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
text-decoration:none;
color:#333;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.horarios{
background:linear-gradient(135deg,#ffe4ec,#fff0f5);
margin:20px;
padding:25px;
border-radius:20px;
box-shadow:0 4px 15px rgba(214,51,132,.15);
text-align:center;
}

.horarios h2{
color:#d63384;
margin-bottom:15px;
font-size:28px;
}

.horarios p{
font-size:18px;
color:#555;
margin:8px 0;
}

.whatsapp{
position:fixed;
right:20px;
bottom:20px;
background:#25D366;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
text-decoration:none;
}

.nuevos{
padding:25px;
background:linear-gradient(135deg,#ffe4ec,#fff0f5);
border-radius:20px;
margin:20px;
}

.nuevos h2{
text-align:center;
font-size:28px;
color:#d63384;
margin-bottom:20px;
}

.productos-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
}

.producto-nuevo{
background:white;
border-radius:15px;
padding:15px;
text-align:center;
box-shadow:0 4px 15px rgba(214,51,132,.15);
transition:transform .3s ease, box-shadow .3s ease;
}

.producto-nuevo:hover{
transform:translateY(-5px);
box-shadow:0 8px 20px rgba(214,51,132,.25);
}

.producto-nuevo img{
width:100%;
height:180px;
object-fit:contain;
background:white;
border-radius:10px;
margin-bottom:10px;
}

.producto-nuevo h3{
font-size:15px;
color:#444;
margin:10px 0;
min-height:40px;
}

.descripcion{
font-size:13px;
color:#666;
line-height:1.4;
margin:8px 0;
min-height:38px;
}

.producto-nuevo p{
margin:5px 0;
}

.etiqueta-nuevo{
background:linear-gradient(45deg,#ff4d94,#ff80bf);
color:white;
padding:6px 12px;
border-radius:25px;
font-size:12px;
font-weight:bold;
display:inline-block;
margin-bottom:10px;
}

.producto-nuevo p:last-child{
font-size:20px;
font-weight:bold;
color:#d63384;
}

/* BOTÓN SUBIR */
#btnArriba{
position:fixed;
bottom:20px;
right:20px;
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
z-index:99999;
box-shadow:0 4px 10px rgba(0,0,0,.3);
}

@media (max-width:600px){
#btnArriba{
width:60px;
height:60px;
font-size:24px;
}
}

</style>

</head>

<body>

<div id="btnArriba" onclick="irArriba()">⬆️</div>

<img src="logo-megatodo.jpg" class="logo">

<div class="buscador">

<input type="text" id="buscadorGlobal" placeholder="Buscar productos...">
<div id="resultadosBusqueda"></div>

</div>

<div class="nuevos">
<h2>NUEVOS INGRESOS</h2>
<div id="productosNuevos" class="productos-grid"></div>
</div>

<div class="categorias">

<a class="categoria" href="categoria.html?cat=Artículos%20de%20Belleza">✨ Artículos de Belleza</a>
<a class="categoria" href="categoria.html?cat=Juguetes">🧸 Juguetes</a>
<a class="categoria" href="categoria.html?cat=Bazar">🏠 Bazar</a>
<a class="categoria" href="categoria.html?cat=Peluches">🐻 Peluches</a>
<a class="categoria" href="categoria.html?cat=Cajas%20de%20Regalo">🎁 Cajas de Regalo</a>
<a class="categoria" href="categoria.html?cat=Coches%20de%20Bebé">👶 Coches de Bebé</a>

</div>

<div class="horarios">
<h2>Horarios de Atención</h2>
<p>Lunes a Sábado: 8:30 am - 7:30 pm</p>
<p>Domingo: 9:30 am - 6:30 pm</p>
</div>

<a href="https://wa.me/593990924437" class="whatsapp" target="_blank">💬</a>

<script>

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

let productos = [];

fetch(url)
.then(res => res.json())
.then(data => {

productos = data;

const nuevos = productos.filter(p => p.Nuevo && p.Nuevo.toUpperCase() === "SI");

document.getElementById("productosNuevos").innerHTML =
nuevos.slice(0,8).map(p => `
<div class="producto-nuevo">

<div class="etiqueta-nuevo">NUEVO</div>

<img src="${p.Foto}" alt="${p.Nombre}">

<h3>${p.Nombre}</h3>

${p.Descripción ? `<p class="descripcion">${p.Descripción}</p>` : ""}

${p.Tamaño ? `<p>Tamaño: ${p.Tamaño}</p>` : ""}

<p>$${p.Precio}</p>

</div>
`).join("");

// BUSCADOR
document.getElementById("buscadorGlobal").addEventListener("input", function(){

const texto = this.value.toLowerCase();
const resultados = document.getElementById("resultadosBusqueda");

if(texto.length < 2){
resultados.innerHTML = "";
return;
}

const encontrados = productos.filter(p =>
p.Nombre && p.Nombre.toLowerCase().includes(texto)
);

resultados.innerHTML = encontrados.slice(0,10).map(p => `
<div class="resultado">
<a href="buscar.html?q=${encodeURIComponent(p.Nombre)}">${p.Nombre}</a>
</div>
`).join("");

});

// ENTER BUSCADOR
document.getElementById("buscadorGlobal").addEventListener("keydown", function(e){
if(e.key === "Enter"){
window.location.href = `buscar.html?q=${encodeURIComponent(this.value)}`;
}
});

});

// BOTÓN SUBIR
window.addEventListener("scroll", function(){
const btn = document.getElementById("btnArriba");
if(!btn) return;

btn.style.display = window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({ top: 0, behavior: "smooth" });
}

</script>

</body>
</html>
