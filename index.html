<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Megatodo</title>

<style>
body{
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

header{
    background: #ff4d6d;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

#productos{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 10px;
}

.producto{
    background: white;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
}

.producto img{
    width: 100%;
    border-radius: 10px;
}

.precio{
    color: #ff4d6d;
    font-weight: bold;
}
</style>
</head>

<body>

<header>MEGATODO</header>

<div id="productos"></div>

<script>

let productos = [];

fetch("productos.csv")
.then(r => r.text())
.then(data => {

    const filas = data.trim().split("\n").slice(1);

    productos = filas.map(f => {
        const [nombre, categoria, foto, tamaño, precio] = f.split(";");
        return {nombre, categoria, foto, tamaño, precio};
    });

    mostrar(productos);
});

function mostrar(lista){

    const cont = document.getElementById("productos");
    cont.innerHTML = "";

    lista.forEach(p => {

        cont.innerHTML += `
        <div class="producto">
            <img src="${p.foto}">
            <h4>${p.nombre}</h4>
            <div>${p.tamaño}</div>
            <div class="precio">${p.precio}</div>
        </div>
        `;
    });
}

</script>

</body>
</html>
