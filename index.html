<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Megatodo</title>

<style>
body{
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

/* HEADER */
header{
    background: #ff4d6d;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

/* CATEGORÍAS */
#categorias{
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding: 10px;
    background: white;
}

.categoria{
    flex: 0 0 auto;
    padding: 10px 15px;
    border-radius: 20px;
    background: #eee;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
}

.categoria.activa{
    background: #ff4d6d;
    color: white;
}

/* PRODUCTOS */
#productos{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 10px;
}

.producto{
    background: white;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
}

.producto img{
    width: 100%;
    border-radius: 10px;
}

.precio{
    color: #ff4d6d;
    font-weight: bold;
}
</style>
</head>

<body>

<header>MEGATODO</header>

<div id="categorias"></div>
<div id="productos"></div>

<script>

let productos = [];

// CARGAR CSV
fetch("productos.csv")
.then(r => r.text())
.then(data => {

    const filas = data.trim().split("\n").slice(1);

    productos = filas.map(f => {
        const [nombre, categoria, foto, tamaño, precio] = f.split(";");
        return {nombre, categoria, foto, tamaño, precio};
    });

    crearCategorias();
    mostrar(productos);
});

// CREAR CATEGORÍAS
function crearCategorias(){

    const cont = document.getElementById("categorias");

    const cats = ["TODOS", ...new Set(productos.map(p => p.categoria))];

    cats.forEach(cat => {

        const div = document.createElement("div");
        div.className = "categoria";
        div.innerText = cat;

        if(cat === "TODOS") div.classList.add("activa");

        div.onclick = () => filtrar(cat, div);

        cont.appendChild(div);
    });
}

// FILTRAR
function filtrar(cat, el){

    document.querySelectorAll(".categoria")
    .forEach(c => c.classList.remove("activa"));

    el.classList.add("activa");

    if(cat === "TODOS"){
        mostrar(productos);
    }else{
        mostrar(productos.filter(p => p.categoria === cat));
    }
}

// MOSTRAR PRODUCTOS
function mostrar(lista){

    const cont = document.getElementById("productos");
    cont.innerHTML = "";

    lista.forEach(p => {

        cont.innerHTML += `
        <div class="producto">
            <img src="${p.foto}">
            <h4>${p.nombre}</h4>
            <div>${p.tamaño}</div>
            <div class="precio">${p.precio}</div>
        </div>
        `;
    });
}

</script>

</body>
</html>
