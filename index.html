<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

/* LOGO */
.logo{
width:100%;
display:block;
}

/* BUSCADOR */
.buscador{
padding:20px;
text-align:center;
}

.buscador input{
width:90%;
max-width:600px;
padding:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

#resultadosBusqueda{
max-width:600px;
margin:10px auto;
background:white;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
overflow:hidden;
}

.resultado{
padding:12px;
border-bottom:1px solid #eee;
}

.resultado a{
text-decoration:none;
color:#333;
font-weight:bold;
display:block;
}

/* CATEGORIAS */
.categorias{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.categoria{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
text-decoration:none;
color:#333;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

/* HORARIOS */
.horarios{
background:linear-gradient(135deg,#ffe4ec,#fff0f5);
margin:20px;
padding:25px;
border-radius:20px;
text-align:center;
}

.horarios h2{
color:#d63384;
font-size:28px;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
right:20px;
bottom:20px;
width:60px;
height:60px;
background:#25D366;
color:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
text-decoration:none;
z-index:999;
}

/* NUEVOS */
.nuevos{
padding:25px;
margin:20px;
background:linear-gradient(135deg,#ffe4ec,#fff0f5);
border-radius:20px;
}

.nuevos h2{
text-align:center;
font-size:28px;
color:#d63384;
}

.productos-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
}

.producto-nuevo{
background:white;
border-radius:15px;
padding:15px;
text-align:center;
box-shadow:0 4px 15px rgba(214,51,132,.15);
}

.producto-nuevo img{
width:100%;
height:180px;
object-fit:contain;
background:white;
border-radius:10px;
}

/* BOTÓN SUBIR */
#btnArriba{
position:fixed;
bottom:20px;
left:20px;
width:55px;
height:55px;
background:#ff2a2a;
color:white;
border-radius:50%;
display:none;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
z-index:9999;
box-shadow:0 4px 12px rgba(0,0,0,.3);
}

</style>

</head>

<body>

<!-- BOTÓN SUBIR -->
<div id="btnArriba" onclick="irArriba()">⬆️</div>

<img src="logo-megatodo.jpg" class="logo">

<!-- BUSCADOR -->
<div class="buscador">
<input type="text" id="buscadorGlobal" placeholder="Buscar productos...">
<div id="resultadosBusqueda"></div>
</div>

<!-- NUEVOS -->
<div class="nuevos">
<h2>NUEVOS INGRESOS</h2>
<div id="productosNuevos" class="productos-grid"></div>
</div>

<!-- CATEGORIAS -->
<div class="categorias">

<a class="categoria" href="categoria.html?cat=Artículos%20de%20Belleza">✨ Belleza</a>
<a class="categoria" href="categoria.html?cat=Juguetes">🧸 Juguetes</a>
<a class="categoria" href="categoria.html?cat=Bazar">🏠 Bazar</a>
<a class="categoria" href="categoria.html?cat=Peluches">🐻 Peluches</a>
<a class="categoria" href="categoria.html?cat=Cajas%20de%20Regalo">🎁 Regalos</a>
<a class="categoria" href="categoria.html?cat=Coches%20de%20Bebé">👶 Bebé</a>

</div>

<!-- HORARIOS -->
<div class="horarios">
<h2>Horarios de Atención</h2>
<p>Lunes a Sábado: 8:30 am - 7:30 pm</p>
<p>Domingo: 9:30 am - 6:30 pm</p>
</div>

<!-- WHATSAPP -->
<a href="https://wa.me/593990924437" class="whatsapp" target="_blank">💬</a>

<script>

const url = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

let productos = [];

fetch(url)
.then(res => res.json())
.then(data => {

productos = data;

/* NUEVOS INGRESOS */
const nuevos = productos.filter(p => p.Nuevo && p.Nuevo.toUpperCase() === "SI");

document.getElementById("productosNuevos").innerHTML =
nuevos.slice(0,8).map(p => {

const foto =
p["Foto 1"] ||
p["Foto 2"] ||
p["Foto 3"] ||
"https://via.placeholder.com/300";

return `
<div class="producto-nuevo">
<img src="${foto}" alt="${p.Nombre}">
<h3>${p.Nombre}</h3>
<p>$${p.Precio}</p>
</div>
`;
}).join("");

/* BUSCADOR INTELIGENTE */
document.getElementById("buscadorGlobal").addEventListener("input", function(){

const texto = this.value.toLowerCase();
const resultados = document.getElementById("resultadosBusqueda");

if(texto.length < 2){
resultados.innerHTML = "";
return;
}

const palabras = texto.split(" ");

const encontrados = productos.filter(p => {

const nombre = (p.Nombre || "").toLowerCase();
const categoria = (p.Categoria || "").toLowerCase();
const descripcion = (p["Descripción"] || "").toLowerCase();

return palabras.some(word =>
nombre.includes(word) ||
categoria.includes(word) ||
descripcion.includes(word)
);

});

resultados.innerHTML = encontrados.slice(0,10).map(p => `
<div class="resultado">
<a href="producto.html?codigo=${p.Código}">
${p.Nombre}
</a>
</div>
`).join("");

});

/* ENTER BUSCADOR */
document.getElementById("buscadorGlobal").addEventListener("keydown", function(e){
if(e.key === "Enter"){
const texto = this.value.trim();
if(texto.length > 0){
window.location.href = `buscar.html?q=${encodeURIComponent(texto)}`;
}
}
});

});

window.addEventListener("scroll", function(){
const btn = document.getElementById("btnArriba");
btn.style.display = window.scrollY > 200 ? "flex" : "none";
});

function irArriba(){
window.scrollTo({ top: 0, behavior: "smooth" });
}

</script>

</body>
</html>
