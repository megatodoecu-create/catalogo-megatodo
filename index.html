<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megatodo</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#f4f4f4;
}

header{
  background:#ff4d6d;
  color:white;
  padding:15px;
  text-align:center;
}

#categorias{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:10px;
  background:white;
}

.categoria{
  padding:6px 10px;
  background:#eee;
  border-radius:15px;
  font-size:14px;
}

#productos{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:10px;
  padding:10px;
}

.producto{
  background:white;
  border-radius:12px;
  padding:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.producto img{
  width:100%;
  height:140px;
  object-fit:cover;
  border-radius:10px;
}

.precio{
  font-weight:bold;
  color:#ff4d6d;
}

.tamaño{
  font-size:12px;
  color:#555;
}
</style>
</head>

<body>

<header>Megatodo</header>

<div id="categorias"></div>
<div id="productos"></div>

<script>

// 🔴 CAMBIA ESTO (IMPORTANTE)
const csvURL = "https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/Productos.csv";

let productos = [];
let categoriaActual = "Todos";

fetch(csvURL)
.then(r => r.text())
.then(data => {

  const filas = data.trim().split("\n").slice(1);

  productos = filas.map(f => {
    const [nombre,categoria,foto,tamaño,precio] = f.split(";");

    return {
      nombre,
      categoria,
      foto: "./Peluches/" + foto
      tamaño,
      precio
    };
  });

  renderCategorias();
  render(productos);
});

function renderCategorias(){
  const cont = document.getElementById("categorias");

  const cats = ["Todos", ...new Set(productos.map(p => p.categoria))];

  cats.forEach(c=>{
    const btn = document.createElement("div");
    btn.className = "categoria";
    btn.textContent = c;

    btn.onclick = () => {
      categoriaActual = c;
      filtrar();
    };

    cont.appendChild(btn);
  });
}

function filtrar(){
  if(categoriaActual === "Todos"){
    render(productos);
  } else {
    render(productos.filter(p => p.categoria === categoriaActual));
  }
}

function render(lista){
  const cont = document.getElementById("productos");
  cont.innerHTML = "";

  lista.forEach(p=>{
    cont.innerHTML += `
      <div class="producto">
        <img src="${p.foto}">
        <h4>${p.nombre}</h4>
        <div class="precio">${p.precio}</div>
        <div class="tamaño">${p.tamaño}</div>
      </div>
    `;
  });
}

</script>

</body>
</html>
