<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Megatodo</title>
<style>
body{
font-family:Arial;
padding:20px;
}

#buscador{
width:100%;
padding:10px;
font-size:16px;
margin-bottom:20px;
}

.productos{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:20px;
}

.producto{
border:1px solid #ddd;
padding:10px;
border-radius:10px;
}

.producto img{
width:100%;
height:200px;
object-fit:cover;
}
</style>
</head>
<a href="https://wa.me/0990924437" class="whatsapp" target="_blank">
💬
</a>

<style>
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:15px;
border-radius:50%;
text-decoration:none;
font-size:30px;
}
</style>
  <body>

<h1>Catálogo Megatodo</h1>

<input type="text" id="buscador" placeholder="Buscar productos...">

<div class="productos" id="productos"></div>

<script>
const productos = [
{
nombre:"Peluche Stitch",
precio:"$10",
categoria:"Peluches",
foto:"https://via.placeholder.com/200"
},
{
 nombre:"Peluche Vaca que corre",
 precio:"$10",
 categoria:"Peluches",
 foto:"https://raw.githubusercontent.com/megatodoecu-create/catalogo-megatodo/main/a2054f59-0aef-499e-b570-8e4b102d27bb.jpg"
},
];

const contenedor=document.getElementById("productos");

function mostrar(lista){
contenedor.innerHTML="";
lista.forEach(p=>{
contenedor.innerHTML+=`
<div class="producto">
<img src="${p.foto}">
<h3>${p.nombre}</h3>
<p>${p.precio}</p>
<p>Categoría: ${p.categoria}</p>
</div>
`;
});
}

mostrar(productos);

document.getElementById("buscador").addEventListener("input",e=>{
const texto=e.target.value.toLowerCase();
mostrar(productos.filter(p=>
p.nombre.toLowerCase().includes(texto)
));
});
</script>

</body>
</html>
