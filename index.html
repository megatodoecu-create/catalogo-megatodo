<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megatodo</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

/* LOGO */
.logo{
width:100%;
display:block;
}

/* BUSCADOR */
.buscador{
padding:20px;
text-align:center;
}

.buscador input{
width:90%;
max-width:600px;
padding:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

#resultadosBusqueda{
max-width:600px;
margin:10px auto;
background:white;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
overflow:hidden;
}

.resultado{
padding:12px;
border-bottom:1px solid #eee;
}

.resultado a{
text-decoration:none;
color:#333;
font-weight:bold;
display:block;
}

/* CATEGORIAS */
.categorias{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.categoria{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
text-decoration:none;
color:#333;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

/* HORARIOS */
.horarios{
background:linear-gradient(135deg,#ffe4ec,#fff0f5);
margin:20px;
padding:25px;
border-radius:20px;
text-align:center;
}

.horarios h2{
color:#d63384;
font-size:28px;
}
