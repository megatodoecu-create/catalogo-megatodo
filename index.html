<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Megatodo</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f6f6f6;
}

/* HEADER */
header{
  background:#ff4d6d;
  color:white;
  padding:12px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  position:sticky;
  top:0;
  z-index:10;
}

/* SEARCH */
#search{
  width:90%;
  margin:10px auto;
  display:block;
  padding:10px;
  border-radius:20px;
  border:1px solid #ddd;
  outline:none;
}

/* CATEGORÍAS */
#categorias{
  display:flex;
  overflow-x:auto;
  gap:8px;
  padding:10px;
  background:white;
  white-space:nowrap;
}

.categoria{
  padding:6px 12px;
  background:#eee;
  border-radius:20px;
  font-size:13px;
  cursor:pointer;
  flex:0 0 auto;
}

.categoria.active{
  background:#ff4d6d;
  color:white;
}

/* PRODUCTOS */
#productos{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:10px;
  padding:10px;
}

/* CARD estilo Temu */
.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.card img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.info{
  padding:8px;
}

.nombre{
  font-size:13px;
  height:32px;
  overflow:hidden;
}

.precio{
  color:#ff4d6d;
  font-weight:bold;
  margin-top:5px;
}

.tamaño{
  font-size:11px;
  color:#666;
}
</style>
</head>

<body>

<header>🛍 Megatodo</header>

<input id="search" placeholder="Buscar productos...">

<div id="categorias"></div>
<div id="productos"></div>

<script>

const csvURL = "https://raw.githubusercontent.com/TU_USUARIO/TU_REPO/main/Productos.csv";

let productos = [];
let categoriaActual = "Todos";

fetch(csvURL)
.then(r => r.text())
.then(data => {

  const filas = data.trim().split("\n").slice(1);

  productos = filas.map(f => {
    const [nombre,categoria,foto,tamaño,precio] = f.split(";");

    return {
      nombre,
      categoria,
      foto: "Peluches/" + foto, // carpeta local
      tamaño,
      precio
    };
  });

  renderCategorias();
  render(productos);
});

/* CATEGORÍAS */
function renderCategorias(){
  const cont = document.getElementById("categorias");

  const cats = ["Todos", ...new Set(productos.map(p => p.categoria))];

  cats.forEach(c=>{
    const div = document.createElement("div");
    div.className = "categoria";
    div.textContent = c;

    div.onclick = () => {
      categoriaActual = c;
      document.querySelectorAll(".categoria").forEach(x=>x.classList.remove("active"));
      div.classList.add("active");
      filtrar();
    };

    cont.appendChild(div);
  });
}

/* FILTRO */
function filtrar(){
  let lista = categoriaActual === "Todos"
    ? productos
    : productos.filter(p => p.categoria === categoriaActual);

  render(lista);
}

/* BUSCADOR */
document.getElementById("search").addEventListener("input", e=>{
  const txt = e.target.value.toLowerCase();

  let lista = productos.filter(p =>
    p.nombre.toLowerCase().includes(txt)
  );

  render(lista);
});

/* RENDER */
function render(lista){
  const cont = document.getElementById("productos");
  cont.innerHTML = "";

  lista.forEach(p=>{
    cont.innerHTML += `
      <div class="card">
        <img src="${p.foto}">
        <div class="info">
          <div class="nombre">${p.nombre}</div>
          <div class="precio">${p.precio}</div>
          <div class="tamaño">${p.tamaño}</div>
        </div>
      </div>
    `;
  });
}

</script>

</body>
</html>
