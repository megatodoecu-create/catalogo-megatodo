<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito - Megatodo</title>
<style>
:root{--rosa:#E83B83;--morado:#7867B7;--lavanda:#9690D0;--naranja:#F2A52B;--celeste:#08A5C6;--turquesa:#63BBAE;--azul:#18234B;--rosa-claro:#FFF5FA;--rosa-suave:#FDE4EF}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#333}
.header{width:100%;min-height:125px;background:white;display:flex;align-items:flex-start;gap:20px;padding:10px 20px;position:relative;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.marca-megatodo{flex-shrink:0;width:270px;display:flex;flex-direction:column;align-items:flex-start}.logo-enlace{display:flex;flex-direction:column;align-items:flex-start;width:max-content;padding:0;margin:0;text-decoration:none;color:inherit;line-height:normal}
.logo-megatodo{display:flex;align-items:center;justify-content:flex-start;height:49px;line-height:1;white-space:nowrap}.logo-letra{font-family:Arial Rounded MT Bold,Arial,Helvetica,sans-serif;font-size:48px;font-weight:900;letter-spacing:-4px}
.logo-m{color:var(--rosa)}.logo-e{color:var(--morado)}.logo-g{color:var(--lavanda)}.logo-a{color:var(--naranja)}.logo-t{color:var(--rosa)}.logo-o1{color:var(--celeste)}.logo-d{color:var(--celeste)}.logo-o2{color:var(--turquesa)}
.eslogan{margin:2px 0 5px 8px;font-size:15px;color:var(--azul);font-weight:500;letter-spacing:.2px}.sonrisa-megatodo{position:relative;width:68px;height:25px;margin-left:92px;margin-bottom:7px}.sonrisa-megatodo:before{content:"";position:absolute;left:5px;top:0;width:54px;height:22px;border-bottom:5px solid var(--rosa);border-radius:0 0 50px 50px}.sonrisa-megatodo:after{content:"";position:absolute;left:2px;top:-2px;width:11px;height:11px;border-radius:50%;background:var(--rosa);box-shadow:53px 0 0 var(--rosa)}
.menu-categorias{position:relative;flex-shrink:0}.btn-menu{height:38px;padding:0 15px;border:0;border-radius:22px;background:linear-gradient(135deg,var(--rosa),#f05b9b);color:white;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 4px 12px rgba(232,59,131,.22);transition:.2s}.btn-menu:hover{transform:translateY(-2px);box-shadow:0 7px 17px rgba(232,59,131,.30)}.btn-menu-icono{font-size:20px;line-height:1}.menu-flecha{font-size:17px;transition:.25s}
.menu-desplegable{position:absolute;top:46px;left:0;width:235px;background:white;border-radius:0 0 17px 17px;box-shadow:0 10px 28px rgba(0,0,0,.14);border:1px solid #f3d7e4;overflow:hidden;opacity:0;visibility:hidden;transform:translateY(-8px);transition:.25s;z-index:10000}.menu-categorias.abierto .menu-desplegable{opacity:1;visibility:visible;transform:translateY(0)}.menu-categorias.abierto .menu-flecha{transform:rotate(180deg)}.menu-desplegable a{display:flex;align-items:center;gap:12px;min-height:45px;padding:9px 16px;text-decoration:none;color:var(--azul);font-size:14px;font-weight:bold;border-bottom:1px solid #f5edf1;transition:.2s}.menu-desplegable a:last-child{border-bottom:0}.menu-desplegable a:hover{background:#fff0f7;color:var(--rosa);padding-left:21px}
.buscador-header{flex:1;max-width:700px;position:relative;margin-top:18px}.buscador-header input{width:100%;height:45px;border:2px solid #eadde5;border-radius:25px;outline:none;padding:0 55px 0 18px;font-size:14px;background:white;transition:.2s}.buscador-header input:focus{border-color:var(--rosa);box-shadow:0 0 0 3px rgba(232,59,131,.10)}.buscador-header button{position:absolute;right:5px;top:5px;width:35px;height:35px;border:0;border-radius:50%;background:var(--rosa);color:white;cursor:pointer;font-size:17px}
#resultadosBusqueda{position:absolute;top:50px;left:0;width:100%;background:white;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,.15);overflow:hidden;display:none;z-index:20000}.resultado-busqueda{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid #eee;cursor:pointer}.resultado-busqueda:hover{background:#fff0f7}.resultado-busqueda img{width:45px;height:45px;object-fit:contain;border-radius:8px;background:#fafafa}.resultado-busqueda strong{font-size:13px;color:var(--azul)}.resultado-busqueda small{display:block;color:var(--rosa);margin-top:3px}
.btn-carrito-global{flex-shrink:0;width:50px;height:50px;border:0;border-radius:50%;background:var(--rosa-suave);font-size:25px;cursor:pointer;position:relative;margin-top:14px;transition:.2s}.btn-carrito-global:hover{transform:scale(1.06)}#cartCount{position:absolute;top:-3px;right:-3px;min-width:23px;height:23px;padding:0 5px;border-radius:50%;background:var(--rosa);color:white;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.contenedor{width:min(1000px,94%);margin:30px auto 60px}.titulo-carrito{text-align:center;margin-bottom:25px}.titulo-carrito h1{margin:0;color:var(--azul);font-size:30px}.titulo-carrito p{margin:7px 0 0;color:#888;font-size:14px}
.item{display:flex;gap:18px;background:white;padding:18px;margin-bottom:15px;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.07);align-items:center;transition:.2s}.item:hover{box-shadow:0 7px 22px rgba(0,0,0,.10)}.item>img{width:115px;height:115px;object-fit:contain;border-radius:12px;background:#fafafa}.info{flex:1;min-width:0}.nombre{font-weight:bold;font-size:17px;color:var(--azul)}.codigo{color:#999;font-size:12px;margin-top:5px}.detalle-variante{display:block;color:#687084;font-size:13px;margin-top:6px;line-height:1.45}.detalle-variante strong{color:var(--azul)}.estado-stock{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:15px;background:#e8f7ef;color:#21865c;font-size:11px;font-weight:bold}.estado-stock.agotado{background:#fff0f1;color:#bd263b}.precio{color:var(--rosa);font-weight:bold;font-size:17px;margin-top:8px}.cantidad{margin-top:12px;display:flex;align-items:center;gap:8px}.cantidad-label{font-size:13px;color:#777}.control-cantidad{display:flex;align-items:center;gap:7px}.control-cantidad button{width:30px;height:30px;border:0;border-radius:50%;background:var(--rosa-suave);color:var(--rosa);font-size:18px;font-weight:bold;cursor:pointer;transition:.2s}.control-cantidad button:hover{background:var(--rosa);color:white}.numero-cantidad{min-width:25px;text-align:center;font-weight:bold}.subtotal{margin-top:10px;font-weight:bold;color:var(--azul)}.eliminar{width:38px;height:38px;flex-shrink:0;border:0;border-radius:50%;background:#f5f5f5;cursor:pointer;font-size:17px;transition:.2s}.eliminar:hover{background:#ffe6ee}
.resumen{background:white;padding:22px;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.07);margin-top:25px}.total{display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:bold;color:var(--azul)}.total span:last-child{color:var(--rosa)}.botones-carrito{display:flex;gap:12px;margin-top:18px}.btn-seguir{flex:1;height:50px;border:2px solid var(--rosa);border-radius:25px;background:white;color:var(--rosa);text-decoration:none;display:flex;align-items:center;justify-content:center;font-weight:bold;transition:.2s}.btn-seguir:hover{background:var(--rosa-suave)}.whatsapp{flex:1;height:50px;background:#25D366;color:white;text-align:center;border-radius:25px;text-decoration:none;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;transition:.2s}.whatsapp:hover{transform:translateY(-2px)}
.carrito-vacio{background:white;padding:55px 20px;text-align:center;border-radius:20px;box-shadow:0 5px 18px rgba(0,0,0,.07)}.carrito-vacio .icono{font-size:55px;margin-bottom:10px}.carrito-vacio h2{color:var(--azul);margin:5px 0}.carrito-vacio p{color:#888}#btnArriba{position:fixed;left:18px;bottom:20px;width:43px;height:43px;border:0;border-radius:50%;background:var(--rosa);color:white;font-size:20px;cursor:pointer;display:none;z-index:25000;box-shadow:0 5px 15px rgba(0,0,0,.15)}
@media(max-width:1000px){.header{min-height:115px;padding:9px 15px;gap:14px}.marca-megatodo{width:245px}.logo-letra{font-size:43px}}
@media(max-width:650px){.header{min-height:105px;height:auto;padding:7px 9px;gap:7px;align-items:center}.marca-megatodo{width:130px;align-items:flex-start}.logo-megatodo{height:31px}.logo-letra{font-size:29px;letter-spacing:-3px}.eslogan{font-size:8px;margin:2px 0 2px 3px}.sonrisa-megatodo{transform:scale(.60);transform-origin:left top;width:68px;height:18px;margin-left:39px;margin-bottom:-2px}.menu-categorias{position:absolute;left:9px;bottom:5px}.btn-menu{height:28px;padding:0 10px;font-size:10px;gap:5px}.btn-menu-icono{font-size:15px}.menu-flecha{font-size:13px}.menu-desplegable{top:34px;left:0;width:215px}.buscador-header{margin-left:3px;margin-right:3px;margin-top:0}.buscador-header input{height:40px;padding-left:13px;padding-right:47px;font-size:12px}.buscador-header button{width:34px;height:34px;top:3px;right:3px;font-size:16px}.btn-carrito-global{width:45px;height:45px;font-size:22px;margin-top:0}#cartCount{min-width:21px;height:21px;font-size:10px}.contenedor{width:94%;margin-top:25px}.titulo-carrito h1{font-size:24px}.item{padding:12px;gap:12px;align-items:flex-start}.item>img{width:85px;height:85px}.nombre{font-size:14px}.precio{font-size:15px}.subtotal{font-size:13px}.eliminar{width:34px;height:34px;font-size:15px}.botones-carrito{flex-direction:column}.btn-seguir,.whatsapp{width:100%}.total{font-size:20px}}
@media(max-width:400px){.marca-megatodo{width:112px}.logo-letra{font-size:25px;letter-spacing:-3px}.eslogan{font-size:7px}.buscador-header input{font-size:11px}}
</style>
</head>
<body>
<header class="header">
  <div class="marca-megatodo">
    <a href="index.html" class="logo-enlace" aria-label="Ir a la página principal">
      <div class="logo-megatodo"><span class="logo-letra logo-m">m</span><span class="logo-letra logo-e">e</span><span class="logo-letra logo-g">g</span><span class="logo-letra logo-a">a</span><span class="logo-letra logo-t">t</span><span class="logo-letra logo-o1">o</span><span class="logo-letra logo-d">d</span><span class="logo-letra logo-o2">o</span></div>
      <div class="eslogan">Todo lo que necesitas</div><div class="sonrisa-megatodo"></div>
    </a>
    <div class="menu-categorias" id="menuCategorias">
      <button class="btn-menu" id="btnMenuCategorias" type="button"><span class="btn-menu-icono">☰</span><span>Categorías</span><span class="menu-flecha">⌄</span></button>
      <div class="menu-desplegable" id="menuDesplegable">
        <a href="categoria.html?cat=Artículos%20de%20Belleza">💄 Artículos de Belleza</a>
        <a href="categoria.html?cat=Juguetes">🧸 Juguetes</a>
        <a href="categoria.html?cat=Bazar">🏠 Bazar</a>
        <a href="categoria.html?cat=Peluches">🐻 Peluches</a>
        <a href="categoria.html?cat=Cosméticos">🧴 Cosméticos</a>
        <a href="categoria.html?cat=Cajas%20de%20Regalo">🎁 Cajas de Regalo</a>
        <a href="categoria.html?cat=Coches%20de%20Bebé">👶 Coches de Bebé</a>
      </div>
    </div>
  </div>
  <div class="buscador-header">
    <input type="text" id="buscadorGlobal" placeholder="Buscar productos..." autocomplete="off">
    <button type="button" id="btnBuscar" aria-label="Buscar">🔍</button>
    <div id="resultadosBusqueda"></div>
  </div>
  <button class="btn-carrito-global" id="btnCarrito" type="button" aria-label="Abrir carrito">🛒<span id="cartCount">0</span></button>
</header>
<main class="contenedor">
  <div class="titulo-carrito"><h1>🛒 Tu carrito</h1><p>Revisa tus productos antes de realizar tu pedido.</p></div>
  <div id="carrito"></div>
  <div class="resumen" id="resumen">
    <div class="total"><span>Total</span><span id="total">$0.00</span></div>
    <div class="botones-carrito"><a class="btn-seguir" href="index.html">← Seguir comprando</a><a id="wpp" class="whatsapp" target="_blank" rel="noopener">💬 Pedir por WhatsApp</a></div>
  </div>
</main>
<button id="btnArriba" type="button" aria-label="Volver arriba">↑</button>
<script>
/* =====================================================
   CARRITO MEGATODO: COMPATIBLE CON PRODUCTOS Y VARIANTES
   Conserva compatibilidad con artículos agregados antes
   de incorporar los tamaños o presentaciones.
===================================================== */
const NUMERO_WHATSAPP = "593990924437";
const URL_CATALOGO = "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo";

function escaparHTML(valor){
  return String(valor ?? "").replace(/[&<>"']/g, caracter => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[caracter]));
}
function getCart(){
  try{
    const datos = JSON.parse(localStorage.getItem("carrito") || "[]");
    return Array.isArray(datos) ? datos : [];
  }catch(error){
    console.warn("No se pudo leer el carrito guardado:", error);
    return [];
  }
}
function saveCart(cart){
  localStorage.setItem("carrito", JSON.stringify(cart));
  actualizarCarritoUI();
}
function convertirPrecio(valor){
  if(typeof valor === "number") return Number.isFinite(valor) ? valor : 0;
  let texto = String(valor ?? "").replace(/[^\d,.-]/g, "").trim();
  if(texto.includes(",") && texto.lastIndexOf(",") > texto.lastIndexOf(".")){
    texto = texto.replace(/\./g, "").replace(",", ".");
  }else{
    texto = texto.replace(/,/g, "");
  }
  const numero = parseFloat(texto);
  return Number.isFinite(numero) ? numero : 0;
}
function actualizarCarritoUI(){
  const cantidad = getCart().reduce((total, producto) => total + (Number(producto.cantidad) || 0), 0);
  const contador = document.getElementById("cartCount");
  if(contador) contador.textContent = cantidad;
}
function obtenerUrlProductoCarrito(item){
  const id = String(item.idProducto ?? item["ID interno"] ?? "").trim();
  const codigo = String(item.codigo ?? item.Código ?? item.Codigo ?? "").trim();
  if(id) return new URL("producto.html?id=" + encodeURIComponent(id), window.location.href).href;
  if(codigo) return new URL("producto.html?codigo=" + encodeURIComponent(codigo), window.location.href).href;
  return new URL("index.html", window.location.href).href;
}
function detallesVariante(item){
  const partes = [];
  const tamano = String(item.tamano ?? item.Tamaño ?? item.Tamano ?? "").trim();
  const codigoVariante = String(item.codigoVariante ?? item.CodigoVariante ?? "").trim();
  const descripcion = String(item.descripcionVariante ?? item["Descripción"] ?? item.Descripcion ?? "").trim();
  if(tamano) partes.push("Presentación: " + tamano);
  if(codigoVariante) partes.push("Código de variante: " + codigoVariante);
  if(descripcion) partes.push("Detalle: " + descripcion);
  return partes;
}
function render(){
  const cart = getCart();
  const contenedor = document.getElementById("carrito");
  const resumen = document.getElementById("resumen");
  if(!cart.length){
    contenedor.innerHTML = `
      <div class="carrito-vacio">
        <div class="icono">🛒</div>
        <h2>Tu carrito está vacío</h2>
        <p>Agrega productos para realizar tu pedido.</p>
        <a href="index.html" class="btn-seguir" style="display:inline-flex;margin-top:15px;padding:0 25px;flex:none">🛍️ Ver productos</a>
      </div>`;
    document.getElementById("total").textContent = "$0.00";
    resumen.style.display = "none";
    actualizarCarritoUI();
    return;
  }
  resumen.style.display = "block";
  let total = 0;
  contenedor.innerHTML = cart.map((producto, indice) => {
    const precio = convertirPrecio(producto.precio);
    const cantidad = Math.max(1, Number(producto.cantidad) || 1);
    const subtotal = precio * cantidad;
    total += subtotal;
    const imagen = String(producto.foto ?? producto.imagen ?? "").trim();
    const nombre = String(producto.nombre ?? "Producto").trim() || "Producto";
    const codigo = String(producto.codigo ?? producto.Código ?? producto.Codigo ?? "").trim();
    const detalles = detallesVariante(producto);
    const stock = String(producto.stock ?? producto.Stock ?? "").trim();
    const agotado = /agotado/i.test(stock);
    const htmlCodigo = codigo ? `<div class="codigo">Código: ${escaparHTML(codigo)}</div>` : "";
    const htmlDetalles = detalles.length ? `<div class="detalle-variante">${detalles.map(escaparHTML).join("<br>")}</div>` : "";
    const htmlStock = stock ? `<span class="estado-stock ${agotado ? "agotado" : ""}">${escaparHTML(stock.toUpperCase())}</span>` : "";
    return `
      <div class="item">
        <img src="${escaparHTML(imagen)}" alt="${escaparHTML(nombre)}" onerror="this.style.visibility='hidden'">
        <div class="info">
          <div class="nombre">${escaparHTML(nombre)}</div>
          ${htmlCodigo}
          ${htmlDetalles}
          ${htmlStock}
          <div class="precio">$${precio.toFixed(2)}</div>
          <div class="cantidad">
            <span class="cantidad-label">Cantidad:</span>
            <div class="control-cantidad">
              <button type="button" onclick="cambiarCantidad(${indice},-1)" aria-label="Disminuir cantidad">−</button>
              <span class="numero-cantidad">${cantidad}</span>
              <button type="button" onclick="cambiarCantidad(${indice},1)" aria-label="Aumentar cantidad">+</button>
            </div>
          </div>
          <div class="subtotal">Subtotal: $${subtotal.toFixed(2)}</div>
        </div>
        <button class="eliminar" type="button" onclick="eliminar(${indice})" title="Eliminar producto" aria-label="Eliminar ${escaparHTML(nombre)}">🗑️</button>
      </div>`;
  }).join("");
  document.getElementById("total").textContent = "$" + total.toFixed(2);
  prepararWhatsApp(cart, total);
  actualizarCarritoUI();
}
function cambiarCantidad(index, cambio){
  const cart = getCart();
  if(!cart[index]) return;
  const cantidad = (Number(cart[index].cantidad) || 1) + cambio;
  if(cantidad <= 0) cart.splice(index, 1);
  else cart[index].cantidad = cantidad;
  saveCart(cart);
  render();
}
function eliminar(index){
  const cart = getCart();
  if(!cart[index]) return;
  cart.splice(index, 1);
  saveCart(cart);
  render();
}
function prepararWhatsApp(cart, total){
  let mensaje = "Hola Megatodo 👋\n\nQuiero realizar un pedido:\n\n";
  cart.forEach((producto, indice) => {
    const precio = convertirPrecio(producto.precio);
    const cantidad = Math.max(1, Number(producto.cantidad) || 1);
    const subtotal = precio * cantidad;
    const codigo = String(producto.codigo ?? producto.Código ?? producto.Codigo ?? "").trim();
    const variante = detallesVariante(producto);
    const urlProducto = obtenerUrlProductoCarrito(producto);
    mensaje += `${indice + 1}. ${producto.nombre || "Producto"}\n`;
    if(codigo) mensaje += `Código: ${codigo}\n`;
    if(variante.length) mensaje += variante.join("\n") + "\n";
    mensaje += `Precio: $${precio.toFixed(2)}\nCantidad: ${cantidad}\nSubtotal: $${subtotal.toFixed(2)}\n\n🔗 Ver producto:\n${urlProducto}\n\n`;
  });
  mensaje += `💰 TOTAL: $${total.toFixed(2)}\n\nQuedo atento/a. Gracias 😊`;
  document.getElementById("wpp").href = "https://wa.me/" + NUMERO_WHATSAPP + "?text=" + encodeURIComponent(mensaje);
}

/* ======================== MENÚ CATEGORÍAS ======================== */
const menuCategorias = document.getElementById("menuCategorias");
const btnMenuCategorias = document.getElementById("btnMenuCategorias");
btnMenuCategorias.addEventListener("click", function(event){
  event.stopPropagation();
  menuCategorias.classList.toggle("abierto");
});
document.addEventListener("click", function(event){
  if(!menuCategorias.contains(event.target)) menuCategorias.classList.remove("abierto");
});

/* ======================== BUSCADOR ======================== */
const buscador = document.getElementById("buscadorGlobal");
const resultados = document.getElementById("resultadosBusqueda");
let productosBusqueda = [];
function normalizar(texto){
  return String(texto ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}
function obtenerIdInterno(producto){
  return String(producto?.["ID interno"] ?? producto?.IDInterno ?? producto?.IdProducto ?? "").trim();
}
function obtenerCodigo(producto){
  return String(producto?.Código ?? producto?.Codigo ?? "").trim();
}
function obtenerUrlDesdeProducto(producto){
  const id = obtenerIdInterno(producto);
  const codigo = obtenerCodigo(producto);
  if(id) return "producto.html?id=" + encodeURIComponent(id);
  if(codigo) return "producto.html?codigo=" + encodeURIComponent(codigo);
  return "index.html";
}
async function cargarProductosBusqueda(){
  try{
    const respuesta = await fetch(URL_CATALOGO, {cache:"no-store"});
    if(!respuesta.ok) throw new Error("No se pudo consultar el catálogo.");
    const datos = await respuesta.json();
    productosBusqueda = Array.isArray(datos) ? datos : [];
  }catch(error){
    console.error("Error cargando el buscador:", error);
  }
}
function mostrarResultados(){
  const texto = normalizar(buscador.value);
  if(!texto){resultados.style.display="none";resultados.innerHTML="";return;}
  if(!productosBusqueda.length) return;
  const encontrados = productosBusqueda.filter(producto => {
    const nombre = normalizar(producto.Nombre);
    const categoria = normalizar(producto.Categoria ?? producto.Categoría ?? "");
    const codigo = normalizar(obtenerCodigo(producto));
    return nombre.includes(texto) || categoria.includes(texto) || codigo.includes(texto);
  }).slice(0,8);
  if(!encontrados.length){
    resultados.innerHTML = `<div style="padding:15px;text-align:center;color:#888">No encontramos productos.</div>`;
    resultados.style.display = "block";
    return;
  }
  window.resultadosCarritoMegatodo = encontrados;
  resultados.innerHTML = encontrados.map((producto, indice) => {
    const nombre = String(producto.Nombre ?? "Producto").trim();
    const precio = String(producto.Precio ?? "").trim();
    const foto = String(producto["Foto 1"] ?? producto.Foto ?? "").trim();
    return `<div class="resultado-busqueda" onclick="irProductoBusqueda(${indice})"><img src="${escaparHTML(foto)}" alt="${escaparHTML(nombre)}"><div><strong>${escaparHTML(nombre)}</strong><small>${escaparHTML(precio)}</small></div></div>`;
  }).join("");
  resultados.style.display = "block";
}
function irProductoBusqueda(indice){
  const producto = (window.resultadosCarritoMegatodo || [])[Number(indice)];
  if(!producto) return;
  window.location.href = obtenerUrlDesdeProducto(producto);
}
buscador.addEventListener("input", mostrarResultados);
buscador.addEventListener("keydown", function(event){
  if(event.key === "Enter"){
    event.preventDefault();
    const texto = buscador.value.trim();
    if(texto) window.location.href = "buscar.html?q=" + encodeURIComponent(texto);
  }
});
document.getElementById("btnBuscar").addEventListener("click", function(){
  const texto = buscador.value.trim();
  if(texto) window.location.href = "buscar.html?q=" + encodeURIComponent(texto);
});
document.addEventListener("click", function(event){
  if(!event.target.closest(".buscador-header")) resultados.style.display = "none";
});

document.getElementById("btnCarrito").addEventListener("click", function(){
  window.location.href = "carrito.html";
});
const btnArriba = document.getElementById("btnArriba");
window.addEventListener("scroll", function(){
  btnArriba.style.display = window.scrollY > 300 ? "block" : "none";
});
btnArriba.addEventListener("click", function(){window.scrollTo({top:0,behavior:"smooth"});});

/* ======================== INICIAR ======================== */
cargarProductosBusqueda();
render();
actualizarCarritoUI();
</script>
</body>
</html>
