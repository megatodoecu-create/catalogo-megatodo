<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito PRO - Megatodo</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#333;
}

.volver{
display:block;
text-align:center;
margin-bottom:15px;
text-decoration:none;
font-weight:bold;
color:#ff2a2a;
}

/* ITEM */
.item{
background:white;
padding:15px;
margin:10px 0;
display:flex;
align-items:center;
gap:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.item img{
width:80px;
height:80px;
object-fit:contain;
}

.info{
flex:1;
}

.nombre{
font-weight:bold;
margin-bottom:5px;
}

.controles{
display:flex;
align-items:center;
gap:10px;
margin-top:5px;
}

.btn{
background:#ff2a2a;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.btn-minus{
background:#333;
}

.total{
text-align:center;
font-size:22px;
margin-top:20px;
font-weight:bold;
}

.btn-wpp{
background:#25D366;
color:white;
width:100%;
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
margin-top:20px;
cursor:pointer;
font-size:16px;
}

</style>
</head>

<body>

<a class="volver" href="index.html">← Seguir comprando</a>

<h1>🛒 Carrito PRO</h1>

<div id="carrito"></div>

<div class="total" id="total"></div>

<button class="btn-wpp" onclick="enviarWhatsApp()">
📲 Finalizar pedido
</button>

<script>

function getCart(){
return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveCart(cart){
localStorage.setItem("cart", JSON.stringify(cart));
render();
}

// 🧠 AGREGAR LÓGICA PRO (SIN DUPLICADOS)
function addItem(p){

let cart = getCart();

let exist = cart.find(x => x.codigo === p.codigo);

if(exist){
exist.cantidad += 1;
} else {
cart.push(p);
}

saveCart(cart);
}

// RENDER
function render(){

let cart = getCart();
let cont = document.getElementById("carrito");

if(cart.length === 0){
cont.innerHTML = "<h3 style='text-align:center'>Carrito vacío</h3>";
document.getElementById("total").textContent = "";
return;
}

let total = 0;

cont.innerHTML = cart.map((p,i)=>{
total += p.precio * p.cantidad;

return `
<div class="item">
<img src="${p.imagen}">

<div class="info">
<div class="nombre">${p.nombre}</div>
<div>$${p.precio}</div>

<div class="controles">

<button class="btn btn-minus" onclick="menos('${p.codigo}')">-</button>

<span>${p.cantidad}</span>

<button class="btn" onclick="mas('${p.codigo}')">+</button>

<button class="btn" onclick="eliminar('${p.codigo}')">🗑</button>

</div>
</div>

</div>
`;
}).join("");

document.getElementById("total").textContent = "Total: $" + total.toFixed(2);
}

// +++
function mas(codigo){
let cart = getCart();
let p = cart.find(x => x.codigo === codigo);
if(p) p.cantidad++;
saveCart(cart);
}

// ---
function menos(codigo){
let cart = getCart();
let p = cart.find(x => x.codigo === codigo);

if(p){
p.cantidad--;
if(p.cantidad <= 0){
cart = cart.filter(x => x.codigo !== codigo);
}
}

saveCart(cart);
}

// eliminar
function eliminar(codigo){
let cart = getCart();
cart = cart.filter(x => x.codigo !== codigo);
saveCart(cart);
}

// WhatsApp
function enviarWhatsApp(){

let cart = getCart();

if(cart.length === 0){
alert("Carrito vacío");
return;
}

let mensaje = "🛒 PEDIDO MEGATODO:%0A%0A";
let total = 0;

cart.forEach(p=>{
mensaje += `• ${p.nombre}%0A`;
mensaje += `$${p.precio} x ${p.cantidad}%0A%0A`;
total += p.precio * p.cantidad;
});

mensaje += `%0ATOTAL: $${total.toFixed(2)}%0A`;

window.open("https://wa.me/593990924437?text=" + mensaje, "_blank");
}

render();

</script>

</body>
</html>
