<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrito - Megatodo</title>

<style>

/* =========================
   GENERAL
========================= */

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
}


/* =========================
   ENCABEZADO
========================= */

header{
    background:linear-gradient(
        135deg,
        #ffe4ec,
        #fff0f5
    );

    color:#d63384;

    padding:20px;

    text-align:center;

    font-size:24px;

    font-weight:bold;
}


/* =========================
   BOTÓN SEGUIR COMPRANDO
========================= */

.volver{
    display:block;

    margin:15px auto;

    width:220px;

    text-align:center;

    padding:10px;

    background:#333;

    color:white;

    text-decoration:none;

    border-radius:8px;

    font-weight:bold;
}


/* =========================
   CONTENEDOR
========================= */

.contenedor{
    max-width:900px;

    margin:auto;

    padding:20px;
}


/* =========================
   PRODUCTO
========================= */

.item{
    display:flex;

    gap:15px;

    background:white;

    padding:15px;

    margin-bottom:15px;

    border-radius:15px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.08);

    align-items:center;
}


.item img{
    width:100px;

    height:100px;

    object-fit:contain;

    border-radius:10px;

    background:white;
}


.info{
    flex:1;
}


.nombre{
    font-weight:bold;

    font-size:16px;
}


.precio{
    color:#d63384;

    font-weight:bold;

    margin-top:5px;
}


.cantidad{
    margin-top:8px;

    font-size:14px;
}


.subtotal{
    margin-top:5px;

    font-weight:bold;
}


/* =========================
   BOTÓN ELIMINAR
========================= */

button{
    padding:6px 12px;

    border:none;

    border-radius:6px;

    cursor:pointer;
}


.eliminar{
    background:#333;

    color:white;

    margin-top:8px;
}


/* =========================
   TOTAL
========================= */

.total{
    text-align:right;

    font-size:22px;

    font-weight:bold;

    margin-top:20px;

    color:#d63384;
}


/* =========================
   WHATSAPP
========================= */

.whatsapp{
    display:block;

    margin-top:20px;

    background:#25D366;

    color:white;

    text-align:center;

    padding:14px;

    border-radius:10px;

    text-decoration:none;

    font-weight:bold;

    font-size:16px;
}


/* =========================
   CARRITO FLOTANTE
========================= */

.btn-carrito-global{
    position:fixed;

    top:15px;

    right:15px;

    background:#d63384;

    color:white;

    padding:11px 16px;

    border-radius:50px;

    text-decoration:none;

    font-weight:bold;

    box-shadow:
        0 4px 12px rgba(0,0,0,.20);

    z-index:9999;
}


/* =========================
   CONTADOR
========================= */

#cartCount{
    background:white;

    color:#d63384;

    font-size:12px;

    padding:3px 7px;

    border-radius:50%;

    margin-left:6px;

    font-weight:bold;
}


/* =========================
   CELULAR
========================= */

@media(max-width:600px){

    .btn-carrito-global{
        top:10px;

        right:10px;

        padding:9px 12px;

        font-size:13px;
    }


    header{
        padding-top:65px;

        font-size:21px;
    }


    .contenedor{
        padding:10px;
    }


    .item{
        padding:12px;
    }


    .item img{
        width:80px;

        height:80px;
    }


    .nombre{
        font-size:14px;
    }


    .total{
        font-size:20px;
    }

}

</style>

</head>


<body>


<!-- =========================
     CARRITO FLOTANTE
========================= -->

<a
    href="carrito.html"
    class="btn-carrito-global">

    🛒 Carrito

    <span id="cartCount">0</span>

</a>


<!-- =========================
     ENCABEZADO
========================= -->

<header>

    🛒 Tu Carrito

</header>


<!-- =========================
     SEGUIR COMPRANDO
========================= -->

<a
    class="volver"
    href="index.html">

    ← Seguir comprando

</a>


<!-- =========================
     PRODUCTOS
========================= -->

<div
    class="contenedor"
    id="carrito">
</div>


<!-- =========================
     TOTAL
========================= -->

<div class="contenedor">

    <div
        class="total"
        id="total">
    </div>


    <!-- =====================
         WHATSAPP
    ====================== -->

    <a
        id="wpp"
        class="whatsapp"
        target="_blank">

        📲 Pedir por WhatsApp

    </a>

</div>


<script>

/* =====================================================
   OBTENER CARRITO
===================================================== */

function getCart(){

    return JSON.parse(
        localStorage.getItem("carrito")
    ) || [];

}


/* =====================================================
   GUARDAR CARRITO
===================================================== */

function saveCart(cart){

    localStorage.setItem(
        "carrito",
        JSON.stringify(cart)
    );

}


/* =====================================================
   ACTUALIZAR CONTADOR
===================================================== */

function actualizarCarritoUI(){

    const cart = getCart();

    const total = cart.reduce(
        (sum,p) =>
        sum + (Number(p.cantidad) || 0),
        0
    );

    const contador =
        document.getElementById("cartCount");

    if(contador){

        contador.textContent = total;

    }

}


/* =====================================================
   MOSTRAR CARRITO
===================================================== */

function render(){

    const cart = getCart();

    const contenedor =
        document.getElementById("carrito");


    /* =========================
       CARRITO VACÍO
    ========================= */

    if(cart.length === 0){

        contenedor.innerHTML = `

            <div style="
                background:white;
                padding:40px 20px;
                text-align:center;
                border-radius:15px;
                box-shadow:0 3px 12px rgba(0,0,0,.08);
            ">

                <h3>
                    🛒 Carrito vacío
                </h3>

                <p>
                    Agrega productos para realizar tu pedido.
                </p>

            </div>

        `;


        document.getElementById("total").innerText = "";

        document.getElementById("wpp").style.display = "none";

        actualizarCarritoUI();

        return;

    }


    let total = 0;


    /* =========================
       MOSTRAR PRODUCTOS
    ========================= */

    contenedor.innerHTML = cart.map(
        (p,i) => {

            const precio =
                Number(p.precio) || 0;

            const cantidad =
                Number(p.cantidad) || 1;

            const subtotal =
                precio * cantidad;


            total += subtotal;


            return `

                <div class="item">

                    <img
                        src="${p.imagen || ""}"
                        alt="${p.nombre || "Producto"}">


                    <div class="info">

                        <div class="nombre">

                            ${p.nombre || ""}

                        </div>


                        <div class="precio">

                            $${precio.toFixed(2)}

                        </div>


                        <div class="cantidad">

                            Cantidad: ${cantidad}

                        </div>


                        <div class="subtotal">

                            Subtotal:
                            $${subtotal.toFixed(2)}

                        </div>


                        <button
                            class="eliminar"
                            onclick="eliminar(${i})">

                            Eliminar

                        </button>

                    </div>

                </div>

            `;

        }

    ).join("");


    /* =========================
       MOSTRAR TOTAL
    ========================= */

    document.getElementById("total").innerText =
        "Total: $" + total.toFixed(2);


    /* =================================================
       CREAR MENSAJE DE WHATSAPP
    ================================================= */

    let mensaje =
        "🛒 Pedido Megatodo%0A%0A";


    cart.forEach(
        p => {

            const precio =
                Number(p.precio) || 0;

            const cantidad =
                Number(p.cantidad) || 1;

            const subtotal =
                precio * cantidad;


            /* =========================
               ENLACE INDIVIDUAL
            ========================= */

            const codigo =
                p.codigo || "";


            const linkProducto =
                "https://megatodoecu-create.github.io/catalogo-megatodo/producto.html?codigo=" +
                encodeURIComponent(codigo);


            mensaje +=
                "--------------------%0A" +

                "Producto: " +
                (p.nombre || "") +
                "%0A" +

                "Código: " +
                (codigo || "N/A") +
                "%0A" +

                "Precio: $" +
                precio.toFixed(2) +
                "%0A" +

                "Cantidad: " +
                cantidad +
                "%0A" +

                "Subtotal: $" +
                subtotal.toFixed(2) +
                "%0A" +

                "Link del producto:%0A" +

                linkProducto +
                "%0A" +

                "--------------------%0A%0A";

        }
    );


    /* =========================
       TOTAL EN WHATSAPP
    ========================= */

    mensaje +=
        "TOTAL: $" +
        total.toFixed(2);


    /* =========================
       BOTÓN WHATSAPP
    ========================= */

    document.getElementById("wpp").href =
        "https://wa.me/593990924437?text=" +
        mensaje;


    document.getElementById("wpp").style.display =
        "block";


    actualizarCarritoUI();

}


/* =====================================================
   ELIMINAR PRODUCTO
===================================================== */

function eliminar(index){

    let cart = getCart();


    cart.splice(
        index,
        1
    );


    saveCart(cart);


    render();

}


/* =====================================================
   INICIAR
===================================================== */

render();

</script>


</body>

</html>
