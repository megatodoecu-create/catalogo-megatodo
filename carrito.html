<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito - Megatodo</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#ff2a2a;
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.volver{
display:block;
margin:15px auto;
width:200px;
text-align:center;
padding:10px;
background:#333;
color:white;
text-decoration:none;
border-radius:8px;
}

.contenedor{
max-width:900px;
margin:auto;
padding:20px;
}

.item{
display:flex;
gap:15px;
background:white;
padding:15px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
align-items:center;
}

.item img{
width:90px;
height:90px;
object-fit:contain;
border-radius:8px;
background:white;
}

.info{
flex:1;
}

.nombre{
font-weight:bold;
}

.precio{
color:#ff2a2a;
font-weight:bold;
margin-top:5px;
}

.cantidad{
margin-top:8px;
}

button{
padding:5px 10px;
border:none;
border-radius:6px;
cursor:pointer;
}

.eliminar{
background:#333;
color:white;
}

.total{
text-align:right;
font-size:20px;
font-weight:bold;
margin-top:20px;
}

.whatsapp{
display:block;
margin-top:20px;
background:#25D366;
color:white;
text-align:center;
padding:12px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

/* 🔥 CARRITO FLOTANTE */
.btn-carrito-global{
position:fixed;
top:15px;
right:15px;
background:#ff2a2a;
color:white;
padding:12px 18px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
box-shadow:0 4px 12px rgba(0,0,0,.25);
z-index:9999;
}

#cartCount{
background:red;
color:white;
font-size:12px;
padding:3px 7px;
border-radius:50%;
margin-left:6px;
font-weight:bold;
}
</style>
</head>

<body>

<!-- 🔥 CARRITO FLOTANTE -->
<a href="carrito.html" class="btn-carrito-global">
🛒 Carrito <span id="cartCount">0</span>
</a>

<header>🛒 Tu Carrito</header>

<a class="volver" href="index.html">← Seguir comprando</a>

<div class="contenedor" id="carrito"></div>

<div class="contenedor">
<div class="total" id="total"></div>
<a id="wpp" class="whatsapp" target="_blank">Pedir por WhatsApp</a>
</div>

<script>

function getCart(){
return JSON.parse(localStorage.getItem("carrito")) || [];
}

function saveCart(cart){
localStorage.setItem("carrito", JSON.stringify(cart));
}

/* 🔥 ACTUALIZAR ICONO */
function actualizarCarritoUI() {
    let cart = getCart();
    let total = cart.reduce((sum, p) => sum + (p.cantidad || 0), 0);

    const el = document.getElementById("cartCount");
    if (el) el.textContent = total;
}

function render(){

let cart = getCart();
let cont = document.getElementById("carrito");

if(cart.length === 0){
cont.innerHTML = "<h3 style='text-align:center'>Carrito vacío</h3>";
document.getElementById("total").innerText = "";
document.getElementById("wpp").style.display = "none";
actualizarCarritoUI();
return;
}

let total = 0;

cont.innerHTML = cart.map((p, i) => {

total += p.precio * p.cantidad;

return `
<div class="item">
<img src="${p.imagen}">
<div class="info">
<div class="nombre">${p.nombre}</div>
<div class="precio">$${p.precio}</div>

<div class="cantidad">
Cantidad: ${p.cantidad}
</div>

<button class="eliminar" onclick="eliminar(${i})">Eliminar</button>
</div>
</div>
`;
}).join("");

document.getElementById("total").innerText = "Total: $" + total.toFixed(2);

// WhatsApp pedido
let mensaje = "🛒 Pedido Megatodo:%0A%0A";

cart.forEach(p => {
mensaje += `${p.nombre} x${p.cantidad} - $${p.precio}%0A`;
});

mensaje += `%0ATotal: $${total.toFixed(2)}`;

document.getElementById("wpp").href =
"https://wa.me/593990924437?text=" + mensaje;

document.getElementById("wpp").style.display = "block";

/* 🔥 actualizar contador */
actualizarCarritoUI();
}

function eliminar(index){
let cart = getCart();
cart.splice(index,1);
saveCart(cart);
render();
}

render();

</script>

</body>
</html>
