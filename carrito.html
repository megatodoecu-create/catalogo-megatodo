<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Carrito - Megatodo</title>


<style>

/* =====================================================
   COLORES MEGATODO
===================================================== */

:root{
    --rosa:#E83B83;
    --morado:#7867B7;
    --lavanda:#9690D0;
    --naranja:#F2A52B;
    --celeste:#08A5C6;
    --turquesa:#63BBAE;
    --azul:#18234B;
    --rosa-claro:#FFF5FA;
    --rosa-suave:#FDE4EF;
}


/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    width:100%;
    min-height:125px;
    background:white;
    display:flex;
    align-items:flex-start;
    gap:20px;
    padding:10px 20px;
    position:relative;
    z-index:1000;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}


/* =====================================================
   MARCA MEGATODO
===================================================== */

.marca-megatodo{
    flex-shrink:0;
    width:270px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}


/* =====================================================
   LOGO CLICKEABLE
===================================================== */

.logo-enlace{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    width:max-content;
    padding:0;
    margin:0;
    text-decoration:none;
    color:inherit;
    line-height:normal;
}


/* =====================================================
   LOGO
===================================================== */

.logo-megatodo{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    height:49px;
    line-height:1;
    white-space:nowrap;
}

.logo-letra{
    font-family:Arial Rounded MT Bold,Arial,Helvetica,sans-serif;
    font-size:48px;
    font-weight:900;
    letter-spacing:-4px;
}

.logo-m{
    color:var(--rosa);
}

.logo-e{
    color:var(--morado);
}

.logo-g{
    color:var(--lavanda);
}

.logo-a{
    color:var(--naranja);
}

.logo-t{
    color:var(--rosa);
}

.logo-o1{
    color:var(--celeste);
}

.logo-d{
    color:var(--celeste);
}

.logo-o2{
    color:var(--turquesa);
}


/* =====================================================
   ESLÓGAN
===================================================== */

.eslogan{
    margin:2px 0 5px 8px;
    font-size:15px;
    color:var(--azul);
    font-weight:500;
    letter-spacing:.2px;
}


/* =====================================================
   SONRISA
===================================================== */

.sonrisa-megatodo{
    position:relative;
    width:68px;
    height:25px;
    margin-left:92px;
    margin-bottom:7px;
}

.sonrisa-megatodo:before{
    content:"";
    position:absolute;
    left:5px;
    top:0;
    width:54px;
    height:22px;
    border-bottom:5px solid var(--rosa);
    border-radius:0 0 50px 50px;
}

.sonrisa-megatodo:after{
    content:"";
    position:absolute;
    left:2px;
    top:-2px;
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--rosa);
    box-shadow:53px 0 0 var(--rosa);
}


/* =====================================================
   MENÚ CATEGORÍAS
===================================================== */

.menu-categorias{
    position:relative;
    flex-shrink:0;
}

.btn-menu{
    height:38px;
    padding:0 15px;
    border:0;
    border-radius:22px;
    background:linear-gradient(
        135deg,
        var(--rosa),
        #f05b9b
    );
    color:white;
    font-size:14px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(232,59,131,.22);
    transition:.2s;
}

.btn-menu:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 17px rgba(232,59,131,.30);
}

.btn-menu-icono{
    font-size:20px;
    line-height:1;
}

.menu-flecha{
    font-size:17px;
    transition:.25s;
}


/* =====================================================
   MENÚ DESPLEGABLE
===================================================== */

.menu-desplegable{
    position:absolute;
    top:46px;
    left:0;
    width:235px;
    background:white;
    border-radius:0 0 17px 17px;
    box-shadow:0 10px 28px rgba(0,0,0,.14);
    border:1px solid #f3d7e4;
    overflow:hidden;
    opacity:0;
    visibility:hidden;
    transform:translateY(-8px);
    transition:.25s;
    z-index:10000;
}

.menu-categorias.abierto .menu-desplegable{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

.menu-categorias.abierto .menu-flecha{
    transform:rotate(180deg);
}

.menu-desplegable a{
    display:flex;
    align-items:center;
    gap:12px;
    min-height:45px;
    padding:9px 16px;
    text-decoration:none;
    color:var(--azul);
    font-size:14px;
    font-weight:bold;
    border-bottom:1px solid #f5edf1;
    transition:.2s;
}

.menu-desplegable a:last-child{
    border-bottom:0;
}

.menu-desplegable a:hover{
    background:#fff0f7;
    color:var(--rosa);
    padding-left:21px;
}


/* =====================================================
   BUSCADOR
===================================================== */

.buscador-header{
    flex:1;
    max-width:700px;
    position:relative;
    margin-top:18px;
}

.buscador-header input{
    width:100%;
    height:45px;
    border:2px solid #eadde5;
    border-radius:25px;
    outline:none;
    padding:0 55px 0 18px;
    font-size:14px;
    background:white;
    transition:.2s;
}

.buscador-header input:focus{
    border-color:var(--rosa);
    box-shadow:0 0 0 3px rgba(232,59,131,.10);
}

.buscador-header button{
    position:absolute;
    right:5px;
    top:5px;
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:var(--rosa);
    color:white;
    cursor:pointer;
    font-size:17px;
}


/* =====================================================
   RESULTADOS BUSCADOR
===================================================== */

#resultadosBusqueda{
    position:absolute;
    top:50px;
    left:0;
    width:100%;
    background:white;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    overflow:hidden;
    display:none;
    z-index:20000;
}

.resultado-busqueda{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 13px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.resultado-busqueda:hover{
    background:#fff0f7;
}

.resultado-busqueda img{
    width:45px;
    height:45px;
    object-fit:contain;
    border-radius:8px;
    background:#fafafa;
}

.resultado-busqueda strong{
    font-size:13px;
    color:var(--azul);
}

.resultado-busqueda small{
    display:block;
    color:var(--rosa);
    margin-top:3px;
}


/* =====================================================
   CARRITO SUPERIOR
===================================================== */

.btn-carrito-global{
    flex-shrink:0;
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:var(--rosa-suave);
    font-size:25px;
    cursor:pointer;
    position:relative;
    margin-top:14px;
    transition:.2s;
}

.btn-carrito-global:hover{
    transform:scale(1.06);
}

#cartCount{
    position:absolute;
    top:-3px;
    right:-3px;
    min-width:23px;
    height:23px;
    padding:0 5px;
    border-radius:50%;
    background:var(--rosa);
    color:white;
    font-size:11px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}


/* =====================================================
   CONTENIDO
===================================================== */

.contenedor{
    width:min(1000px,94%);
    margin:30px auto 60px;
}


/* =====================================================
   TÍTULO
===================================================== */

.titulo-carrito{
    text-align:center;
    margin-bottom:25px;
}

.titulo-carrito h1{
    margin:0;
    color:var(--azul);
    font-size:30px;
}

.titulo-carrito p{
    margin:7px 0 0;
    color:#888;
    font-size:14px;
}


/* =====================================================
   PRODUCTO
===================================================== */

.item{
    display:flex;
    gap:18px;
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
    align-items:center;
    transition:.2s;
}

.item:hover{
    box-shadow:0 7px 22px rgba(0,0,0,.10);
}


.item img{
    width:115px;
    height:115px;
    object-fit:contain;
    border-radius:12px;
    background:#fafafa;
}


.info{
    flex:1;
}


.nombre{
    font-weight:bold;
    font-size:17px;
    color:var(--azul);
}


.codigo{
    color:#999;
    font-size:12px;
    margin-top:5px;
}


.precio{
    color:var(--rosa);
    font-weight:bold;
    font-size:17px;
    margin-top:8px;
}


.cantidad{
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:8px;
}


.cantidad-label{
    font-size:13px;
    color:#777;
}


.control-cantidad{
    display:flex;
    align-items:center;
    gap:7px;
}


.control-cantidad button{
    width:30px;
    height:30px;
    border:0;
    border-radius:50%;
    background:var(--rosa-suave);
    color:var(--rosa);
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.control-cantidad button:hover{
    background:var(--rosa);
    color:white;
}


.numero-cantidad{
    min-width:25px;
    text-align:center;
    font-weight:bold;
}


.subtotal{
    margin-top:10px;
    font-weight:bold;
    color:var(--azul);
}


.eliminar{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#f5f5f5;
    cursor:pointer;
    font-size:17px;
    transition:.2s;
}

.eliminar:hover{
    background:#ffe6ee;
}


/* =====================================================
   TOTAL
===================================================== */

.resumen{
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
    margin-top:25px;
}


.total{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:24px;
    font-weight:bold;
    color:var(--azul);
}


.total span:last-child{
    color:var(--rosa);
}


/* =====================================================
   BOTONES
===================================================== */

.botones-carrito{
    display:flex;
    gap:12px;
    margin-top:18px;
}


.btn-seguir{
    flex:1;
    height:50px;
    border:2px solid var(--rosa);
    border-radius:25px;
    background:white;
    color:var(--rosa);
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    transition:.2s;
}

.btn-seguir:hover{
    background:var(--rosa-suave);
}


.whatsapp{
    flex:1;
    height:50px;
    background:#25D366;
    color:white;
    text-align:center;
    border-radius:25px;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:15px;
    transition:.2s;
}

.whatsapp:hover{
    transform:translateY(-2px);
}


/* =====================================================
   CARRITO VACÍO
===================================================== */

.carrito-vacio{
    background:white;
    padding:55px 20px;
    text-align:center;
    border-radius:20px;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.carrito-vacio .icono{
    font-size:55px;
    margin-bottom:10px;
}

.carrito-vacio h2{
    color:var(--azul);
    margin:5px 0;
}

.carrito-vacio p{
    color:#888;
}


/* =====================================================
   BOTÓN ARRIBA
===================================================== */

#btnArriba{
    position:fixed;
    left:18px;
    bottom:20px;
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:var(--rosa);
    color:white;
    font-size:20px;
    cursor:pointer;
    display:none;
    z-index:25000;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

    .header{

    }

    .marca-megatodo{

    }

    .logo-letra{
        font-size:43px;
    }

}

    }

    }

    }

    }

@media(max-width:400px){

    .marca-megatodo{
        width:112px;
    }

    .logo-letra{
        font-size:25px;

    }

    .eslogan{

    }

    }

</style>

<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const NUMERO_WHATSAPP =
"593990924437";


/* =====================================================
   OBTENER CARRITO
===================================================== */

function getCart(){

    try{

        return JSON.parse(
            localStorage.getItem("carrito")
        ) || [];

    }

    catch{

        return [];

    }

}


/* =====================================================
   GUARDAR CARRITO
===================================================== */

function saveCart(cart){

    localStorage.setItem(
        "carrito",
        JSON.stringify(cart)
    );

}


/* =====================================================
   PRECIO A NÚMERO
===================================================== */

function convertirPrecio(valor){

    if(typeof valor === "number"){
        return valor;
    }


    let texto =
    String(valor ?? "")
        .replace(/[^\d,.-]/g,"");


    /*
       Si viene como 125,50
       lo convertimos a 125.50
    */

    if(
        texto.includes(",") &&
        texto.lastIndexOf(",") >
        texto.lastIndexOf(".")
    ){

        texto =
        texto.replace(/\./g,"")
             .replace(",",".");
    }


    const numero =
    parseFloat(texto);


    return isNaN(numero)
        ? 0
        : numero;

}


/* =====================================================
   ACTUALIZAR CONTADOR
===================================================== */

function actualizarCarritoUI(){

    const cart =
    getCart();


    const cantidad =
    cart.reduce(
        (sum,p) =>
        sum + (Number(p.cantidad) || 0),
        0
    );


    const contador =
    document.getElementById(
        "cartCount"
    );


    if(contador){

        contador.textContent =
        cantidad;

    }

}


/* =====================================================
   MOSTRAR CARRITO
===================================================== */

function render(){

    const cart =
    getCart();


    const contenedor =
    document.getElementById(
        "carrito"
    );


    const resumen =
    document.getElementById(
        "resumen"
    );


    /* =================================================
       CARRITO VACÍO
    ================================================= */

    if(cart.length === 0){

        contenedor.innerHTML = `

            <div class="carrito-vacio">

                <div class="icono">
                    🛒
                </div>

                <h2>
                    Tu carrito está vacío
                </h2>

                <p>
                    Agrega productos para realizar tu pedido.
                </p>

                <a
                    href="index.html"
                    class="btn-seguir"
                    style="
                        display:inline-flex;
                        margin-top:15px;
                        padding:0 25px;
                        flex:none;
                    ">

                    🛍️ Ver productos

                </a>

            </div>

        `;


        document.getElementById(
            "total"
        ).textContent =
        "$0.00";


        resumen.style.display =
        "none";


        actualizarCarritoUI();

        return;

    }


    resumen.style.display =
    "block";


    let total = 0;


    /* =================================================
       PRODUCTOS
    ================================================= */

    contenedor.innerHTML =
    cart.map((p,i) => {


        const precio =
        convertirPrecio(
            p.precio
        );


        const cantidad =
        Number(
            p.cantidad
        ) || 1;


        const subtotal =
        precio * cantidad;


        total += subtotal;


        /*
           Aceptamos "foto" y "imagen"
           para compatibilidad con carritos
           anteriores.
        */

        const imagen =
        p.foto ||
        p.imagen ||
        "";


        const codigo =
        p.codigo ||
        "";


        return `

            <div class="item">


                <img
                    src="${imagen}"
                    alt="${p.nombre || "Producto"}">


                <div class="info">


                    <div class="nombre">

                        ${p.nombre || "Producto"}

                    </div>


                    ${
                        codigo
                        ?
                        `
                        <div class="codigo">
                            Código: ${codigo}
                        </div>
                        `
                        :
                        ""
                    }


                    <div class="precio">

                        $${precio.toFixed(2)}

                    </div>


                    <div class="cantidad">


                        <span class="cantidad-label">
                            Cantidad:
                        </span>


                        <div class="control-cantidad">


                            <button
                                type="button"
                                onclick="cambiarCantidad(${i},-1)">

                                −

                            </button>


                            <span class="numero-cantidad">

                                ${cantidad}

                            </span>


                            <button
                                type="button"
                                onclick="cambiarCantidad(${i},1)">

                                +

                            </button>


                        </div>


                    </div>


                    <div class="subtotal">

                        Subtotal:
                        $${subtotal.toFixed(2)}

                    </div>


                </div>


                <button
                    class="eliminar"
                    type="button"
                    onclick="eliminar(${i})"
                    title="Eliminar producto">

                    🗑️

                </button>


            </div>

        `;

    }).join("");


    /* =================================================
       TOTAL
    ================================================= */

    document.getElementById(
        "total"
    ).textContent =
    "$" + total.toFixed(2);


    /* =================================================
       WHATSAPP
    ================================================= */

    prepararWhatsApp(
        cart,
        total
    );


    actualizarCarritoUI();

}


/* =====================================================
   CAMBIAR CANTIDAD
===================================================== */

function cambiarCantidad(
    index,
    cambio
){

    const cart =
    getCart();


    if(!cart[index]){
        return;
    }


    let cantidad =
    Number(
        cart[index].cantidad
    ) || 1;


    cantidad += cambio;


    if(cantidad <= 0){

        cart.splice(
            index,
            1
        );

    }

    else{

        cart[index].cantidad =
        cantidad;

    }


    saveCart(cart);


    render();

}


/* =====================================================
   ELIMINAR
===================================================== */

function eliminar(index){

    const cart =
    getCart();


    if(!cart[index]){
        return;
    }


    cart.splice(
        index,
        1
    );


    saveCart(cart);


    render();

}


/* =====================================================
   WHATSAPP
===================================================== */

function prepararWhatsApp(
    cart,
    total
){

    let mensaje =
`Hola Megatodo 👋

Quiero realizar un pedido:

`;


    cart.forEach(
        (p,index) => {


            const precio =
            convertirPrecio(
                p.precio
            );


            const cantidad =
            Number(
                p.cantidad
            ) || 1;


            const subtotal =
            precio * cantidad;


            const codigo =
            p.codigo ||
            "";


            const urlProducto =
            new URL(
                "producto.html?codigo=" +
                encodeURIComponent(codigo),
                window.location.href
            ).href;


            mensaje +=
`${index + 1}. ${p.nombre || "Producto"}
Código: ${codigo || "N/A"}
Precio: $${precio.toFixed(2)}
Cantidad: ${cantidad}
Subtotal: $${subtotal.toFixed(2)}

🔗 Ver producto:
${urlProducto}

`;

        }
    );


    mensaje +=
`💰 TOTAL: $${total.toFixed(2)}

Quedo atento/a. Gracias 😊`;


    document.getElementById(
        "wpp"
    ).href =
    "https://wa.me/" +
    NUMERO_WHATSAPP +
    "?text=" +
    encodeURIComponent(mensaje);

}


/* =====================================================
   MENÚ CATEGORÍAS
===================================================== */

const menuCategorias =
document.getElementById(
    "menuCategorias"
);


const btnMenuCategorias =
document.getElementById(

/* =====================================================
   BUSCADOR
===================================================== */

const buscador =
document.getElementById(
    "buscadorGlobal"
);


const resultados =
document.getElementById(
    "resultadosBusqueda"
);


let productosBusqueda = [];


/* =====================================================
   CARGAR PRODUCTOS PARA BUSCADOR
===================================================== */

async function cargarProductosBusqueda(){

    try{

        const respuesta =
        await fetch(
            "https://opensheet.elk.sh/1r9dXj_AOXk5ejaGjLxDLA0aY1h0eD0-FNewslUkH0eU/Megatodo"
        );


        if(!respuesta.ok){
            return;
        }


        productosBusqueda =
        await respuesta.json();

    }

    catch(error){

        console.error(
            "Error cargando buscador:",
            error
        );

    }

}


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto){

    return String(
        texto ?? ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLowerCase()
    .trim();

}


/* =====================================================
   MOSTRAR RESULTADOS
===================================================== */

function mostrarResultados(){

    const texto =
    normalizar(
        buscador.value
    );


    if(!texto){

        resultados.style.display =
        "none";

        resultados.innerHTML =
        "";

        return;

    }


    if(productosBusqueda.length === 0){
        return;
    }


    const encontrados =
    productosBusqueda
    .filter(p => {

        const nombre =
        normalizar(
            p.Nombre
        );


        const categoria =
        normalizar(
            p.Categoria ??
            p.Categoría ??
            ""
        );


        const codigo =
        normalizar(
            p.Código ??
            p.Codigo ??
            ""
        );


        return (
            nombre.includes(texto) ||
            categoria.includes(texto) ||
            codigo.includes(texto)
        );

    })
    .slice(0,8);


    if(encontrados.length === 0){

        resultados.innerHTML = `

            <div style="
                padding:15px;
                text-align:center;
                color:#888;
            ">

                No encontramos productos.

            </div>

        `;


        resultados.style.display =
        "block";


        return;

    }


    resultados.innerHTML =
    encontrados.map(p => {


        const codigo =
        String(
            p.Código ??
            p.Codigo ??
            ""
        ).trim();


        const nombre =
        String(
            p.Nombre ??
            ""
        ).trim();


        const precio =
        String(
            p.Precio ??
            ""
        ).trim();


        const foto =
        String(
            p["Foto 1"] ??
            p.Foto ??
            ""
        ).trim();


        return `

            <div
                class="resultado-busqueda"
                onclick="irProducto('${encodeURIComponent(codigo)}')">


                <img
                    src="${foto}"
                    alt="${nombre}">


                <div>

                    <strong>
                        ${nombre}
                    </strong>


                    <small>
                        ${precio}
                    </small>

                </div>


            </div>

        `;

    }).join("");


    resultados.style.display =
    "block";

}


/* =====================================================
   IR AL PRODUCTO
===================================================== */

function irProducto(codigo){

    window.location.href =
    "producto.html?codigo=" +
    codigo;

}


/* =====================================================
   BUSCADOR INPUT
===================================================== */

buscador.addEventListener(
    "input",
    mostrarResultados
);


/* =====================================================
   ENTER
===================================================== */

buscador.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();


            const texto =
            buscador.value.trim();


            if(texto){

                window.location.href =
                "buscar.html?q=" +
                encodeURIComponent(texto);

            }

        }

    }
);


/* =====================================================
   BOTÓN BUSCAR
===================================================== */

document.getElementById(
    "btnBuscar"
).addEventListener(
    "click",
    function(){

        const texto =
        buscador.value.trim();


        if(texto){

            window.location.href =
            "buscar.html?q=" +
            encodeURIComponent(texto);

        }

    }
);


/* =====================================================
   CERRAR RESULTADOS
===================================================== */

document.addEventListener(
    "click",
    function(event){

        if(
            !event.target.closest(
                ".buscador-header"
            )
        ){

            resultados.style.display =
            "none";

        }

    }
);


/* =====================================================
   BOTÓN CARRITO
===================================================== */

document.getElementById(
    "btnCarrito"
).addEventListener(
    "click",
    function(){

        window.location.href =
        "carrito.html";

    }
);


/* =====================================================
   BOTÓN ARRIBA
===================================================== */

const btnArriba =
document.getElementById(
    "btnArriba"
);


window.addEventListener(
    "scroll",
    function(){

        if(
            window.scrollY > 300
        ){

            btnArriba.style.display =
            "block";

        }

        else{

            btnArriba.style.display =
            "none";

        }

    }
);


btnArriba.addEventListener(
    "click",
    function(){

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


/* =====================================================
   INICIAR
===================================================== */

cargarProductosBusqueda();

render();

actualizarCarritoUI();

</script>
