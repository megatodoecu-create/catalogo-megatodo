
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector de códigos | Megatodo</title>

  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f4fa;
      color: #18234B;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 18px #00000012;
    }

    h1 {
      color: #E83B83;
      margin-top: 5px;
    }

    p {
      line-height: 1.5;
    }

    video {
      width: 100%;
      max-height: 380px;
      background: #111;
      border-radius: 12px;
      object-fit: cover;
      margin-top: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #E83B83;
    }

    button.secondary {
      background: #7867B7;
    }

    #status {
      min-height: 45px;
      margin: 15px 0;
      color: #555;
      font-size: 14px;
    }

    #result {
      display: none;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      background: #e9f8f3;
      overflow-wrap: anywhere;
    }

    #codeResult {
      display: block;
      font-size: 23px;
      font-weight: bold;
      color: #087b63;
      margin: 10px 0;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #E83B83;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">Megatodo</div>

    <h1>Lector de códigos</h1>

    <p>
      Coloca el código de barras frente a la cámara.
      Lo leeremos y lo enviaremos automáticamente al administrador.
    </p>

    <video id="video" autoplay muted playsinline></video>

    <p id="status">Abriendo cámara...</p>

    <div id="result">
      <strong>Código detectado:</strong>
      <span id="codeResult"></span>

      <button
        id="copyButton"
        class="secondary"
        style="display:none"
        onclick="copyCode()">
        Copiar código como respaldo
      </button>
    </div>

    <button
      id="retryButton"
      style="display:none"
      onclick="startScanner()">
      Reintentar cámara
    </button>
  </div>

  <script>
    let reader = null;
    let controls = null;
    let scannedCode = '';
    let processing = false;
    let confirmed = false;
    let confirmationTimer = null;

    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const codeResult = document.getElementById('codeResult');
    const copyButton = document.getElementById('copyButton');
    const retryButton = document.getElementById('retryButton');

    function stopScanner() {
      if (controls) {
        try {
          controls.stop();
        } catch (error) {}

        controls = null;
      }

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
    }

    function sendAutomatically() {
      if (!window.opener || window.opener.closed) {
        status.textContent =
          'Código leído, pero no encontramos el administrador abierto. Puedes copiarlo como respaldo.';

        copyButton.style.display = 'block';
        return;
      }

      status.textContent =
        'Código detectado. Enviando al administrador...';

      window.opener.postMessage({
        type: 'MEGATODO_BARCODE',
        code: scannedCode
      }, '*');

      confirmationTimer = setTimeout(function() {
        if (!confirmed) {
          status.textContent =
            'El código fue leído, pero no recibimos confirmación del administrador. Puedes copiarlo como respaldo.';

          copyButton.style.display = 'block';
        }
      }, 3000);
    }

    async function startScanner() {
      if (processing) return;

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        status.textContent =
          'Este navegador no permite acceder a la cámara. Abre esta página mediante HTTPS.';

        retryButton.style.display = 'block';
        return;
      }

      if (!window.ZXingBrowser) {
        status.textContent =
          'No se pudo cargar el lector. Revisa tu conexión a Internet.';

        retryButton.style.display = 'block';
        return;
      }

      stopScanner();

      processing = false;
      scannedCode = '';
      confirmed = false;

      result.style.display = 'none';
      copyButton.style.display = 'none';
      retryButton.style.display = 'none';

      status.textContent = 'Solicitando permiso para utilizar la cámara...';

      try {
        reader = new ZXingBrowser.BrowserMultiFormatReader();

        controls = await reader.decodeFromVideoDevice(
          undefined,
          video,
          function(scanResult, error) {
            if (!scanResult || processing) return;

            processing = true;

            scannedCode = scanResult.getText();

            codeResult.textContent = scannedCode;
            result.style.display = 'block';

            stopScanner();

            sendAutomatically();
          }
        );

        if (!processing) {
          status.textContent =
            'Cámara activada. Apunta al código de barras.';
        }

      } catch (error) {
        stopScanner();

        status.textContent =
          'No se pudo activar la cámara: ' +
          (error.message || error);

        retryButton.style.display = 'block';
      }
    }

    window.addEventListener('message', function(event) {
      if (event.source !== window.opener) return;

      const data = event.data;

      if (!data) return;

      if (data.type === 'MEGATODO_BARCODE_ACK') {
        confirmed = true;

        if (confirmationTimer) {
          clearTimeout(confirmationTimer);
        }

        status.textContent =
          '¡Listo! El código ya está colocado en el administrador de Megatodo.';

        setTimeout(function() {
          window.close();
        }, 800);
      }

      if (data.type === 'MEGATODO_BARCODE_ERROR') {
        status.textContent =
          data.message || 'No se pudo colocar el código en el formulario.';

        copyButton.style.display = 'block';
      }
    });

    async function copyCode() {
      if (!scannedCode) return;

      try {
        await navigator.clipboard.writeText(scannedCode);
        status.textContent = 'Código copiado correctamente.';
      } catch (error) {
        status.textContent =
          'No se pudo copiar automáticamente. Selecciona el código mostrado.';
      }
    }

    window.addEventListener('beforeunload', stopScanner);

    // Activar la cámara automáticamente al abrir el lector
    window.addEventListener('load', function() {
      startScanner();
    }, { once: true });
  </script>

</body>
</html>
